e},{"id":103,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Remote Sensing","chapterCode":"AGeE0204","topic":"Fundamentals of Remote Sensing","question":"The civilian satellite remote-sensing era is commonly dated from the 1972 launch of __________.","options":["Landsat-1 (ERTS-1)","SPOT-1","IKONOS","Radarsat-1"],"correct":0,"explanation":"Landsat-1, originally ERTS-1, launched in 1972 and began the Landsat land-observation programme. The question refers to this major civilian milestone, not the first satellite of any kind.","examTip":"Link this question to AGeE0204: Fundamentals of Remote Sensing.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":104,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Remote Sensing","chapterCode":"AGeE0204","topic":"Fundamentals of Remote Sensing","question":"A sensor that provides its own illumination, such as radar or LiDAR, is called an __________ sensor.","options":["passive","optical-only","thermal-only","active"],"correct":3,"explanation":"An active sensor transmits energy and measures its return. Radar transmits microwaves and LiDAR laser pulses; a passive optical sensor normally relies on sunlight or natural emission.","examTip":"Link this question to AGeE0204: Fundamentals of Remote Sensing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":105,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Remote Sensing","chapterCode":"AGeE0204","topic":"Fundamentals of Remote Sensing","question":"Spatial resolution refers to the __________ that can be resolved.","options":["bit depth of the image","number of spectral bands","size of the smallest ground detail","revisit time of the sensor"],"correct":2,"explanation":"Spatial resolution describes the scale of ground detail that can be distinguished. Pixel size helps characterize it, but optical blur and contrast also affect whether a feature is actually resolved.","examTip":"Link this question to AGeE0204: Fundamentals of Remote Sensing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":106,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Remote Sensing","chapterCode":"AGeE0204","topic":"Fundamentals of Remote Sensing","question":"An 8-bit image provides __________ grey levels.","options":["8","4096","16","256"],"correct":3,"explanation":"Eight binary bits provide 2⁸ = 256 possible values, conventionally numbered 0–255. Radiometric bit depth is not the number of spectral bands or the spatial pixel size.","examTip":"Link this question to AGeE0204: Fundamentals of Remote Sensing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":107,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Remote Sensing","chapterCode":"AGeE0204","topic":"Fundamentals of Remote Sensing","question":"The visible portion of the electromagnetic spectrum occupies approximately __________.","options":["0.4–0.7 μm","8–14 μm","0.1–0.3 μm","0.7–1.3 μm"],"correct":0,"explanation":"Visible light spans roughly 0.4–0.7 micrometres from violet to red. Near infrared lies beyond the red end and is invisible to the human eye.","examTip":"Link this question to AGeE0204: Fundamentals of Remote Sensing.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":108,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Remote Sensing","chapterCode":"AGeE0204","topic":"Fundamentals of Remote Sensing","question":"Healthy green vegetation shows a very high reflectance in the __________ region.","options":["red","near infrared","thermal infrared","blue"],"correct":1,"explanation":"Leaf internal structure strongly scatters near-infrared radiation, while chlorophyll absorbs much red light. This high-NIR, low-red contrast is the basis of vegetation indices such as NDVI.","examTip":"Link this question to AGeE0204: Fundamentals of Remote Sensing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":109,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Remote Sensing","chapterCode":"AGeE0204","topic":"Fundamentals of Remote Sensing","question":"Rayleigh scattering is proportional to __________ and is the reason the clear sky appears blue.","options":["λ-²","λ","λ-4","λ²"],"correct":2,"explanation":"Rayleigh scattering varies approximately as 1/λ⁴ for particles much smaller than the wavelength. Shorter blue wavelengths therefore scatter more strongly than longer red wavelengths.","examTip":"Link this question to AGeE0204: Fundamentals of Remote Sensing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":110,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Remote Sensing","chapterCode":"AGeE0204","topic":"Fundamentals of Remote Sensing","question":"Non-selective scattering by clouds makes them appear white because the scattering particles are __________ the wavelength.","options":["much larger than","much smaller than","approximately equal to","unrelated to"],"correct":0,"explanation":"Large droplets scatter visible wavelengths relatively similarly rather than strongly favouring one colour. The mixed scattered visible light makes clouds appear white under ordinary illumination.","examTip":"Link this question to AGeE0204: Fundamentals of Remote Sensing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":111,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Remote Sensing","chapterCode":"AGeE0204","topic":"Fundamentals of Remote Sensing","question":"The Normalized Difference Vegetation Index (NDVI) is computed as __________.","options":["NIR/Red","(NIR + Red)/(NIR − Red)","Red − NIR","(NIR − Red)/(NIR + Red)"],"correct":3,"explanation":"NDVI normalizes the NIR–red contrast by their sum: (NIR − Red)/(NIR + Red). It is dimensionless and undefined when the denominator is zero.","examTip":"Link this question to AGeE0204: Fundamentals of Remote Sensing.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":112,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Image Processing and Interpretation","chapterCode":"AGeE0205","topic":"Image Processing and Interpretation","question":"Histogram equalization is an image-enhancement technique used mainly to improve __________.","options":["radiometric calibration","contrast","spatial resolution","geometric accuracy"],"correct":1,"explanation":"Histogram equalization redistributes intensity values to use the display range more effectively. This can reveal low-contrast detail, but it changes pixel values and does not create new spatial information.","examTip":"Link this question to AGeE0205: Image Processing and Interpretation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":113,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Image Processing and Interpretation","chapterCode":"AGeE0205","topic":"Image Processing and Interpretation","question":"For digital classification, the preferred resampling method is generally __________ because it preserves original DN values.","options":["bilinear interpolation","nearest neighbour","kriging","cubic convolution"],"correct":1,"explanation":"Nearest-neighbour resampling copies an existing pixel value. Bilinear and cubic methods interpolate new values, which may alter class labels or spectral digital numbers used for classification.","examTip":"Link this question to AGeE0205: Image Processing and Interpretation.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":114,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Image Processing and Interpretation","chapterCode":"AGeE0205","topic":"Image Processing and Interpretation","question":"In supervised classification, the analyst must provide __________.","options":["only a histogram","only a DEM","no prior information","training areas of known classes"],"correct":3,"explanation":"Supervised classification learns the spectral characteristics of labelled examples supplied as training samples. The resulting model assigns unknown pixels to those classes; independent validation is still needed.","examTip":"Link this question to AGeE0205: Image Processing and Interpretation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":115,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Image Processing and Interpretation","chapterCode":"AGeE0205","topic":"Image Processing and Interpretation","question":"K-means and ISODATA are algorithms used in __________ classification.","options":["unsupervised","supervised","visual interpretation only","object-based only"],"correct":0,"explanation":"K-means and ISODATA group pixels by similarity without starting from analyst-labelled classes. The resulting clusters must then be interpreted or labelled, which is why this is unsupervised classification.","examTip":"Link this question to AGeE0205: Image Processing and Interpretation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":116,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Image Processing and Interpretation","chapterCode":"AGeE0205","topic":"Image Processing and Interpretation","question":"Producer's accuracy is the complement of __________ error.","options":["commission","geometric","omission","radiometric"],"correct":2,"explanation":"Producer's accuracy asks: of all reference samples that truly belong to a class, how many were mapped correctly? PA = TP/(TP + FN). Omission = FN/(TP + FN), so PA = 1 − omission. If 80 of 100 real forest samples are mapped as forest, PA is 80% and omission is 20%. Commission instead relates to user's accuracy.","examTip":"Link this question to AGeE0205: Image Processing and Interpretation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":117,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Image Processing and Interpretation","chapterCode":"AGeE0205","topic":"Image Processing and Interpretation","question":"The kappa coefficient is given by κ = __________.","options":["(Po − Pe)/(1 − Pe)","Po + Pe","1 − Po","Po/Pe"],"correct":0,"explanation":"Po is observed agreement and Pe is agreement expected from the marginal proportions. Subtracting Pe removes that expected component; dividing by 1 − Pe normalizes the maximum possible improvement.","examTip":"Link this question to AGeE0205: Image Processing and Interpretation.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":118,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Terrain Models and Ortho Products","chapterCode":"AGeE0206","topic":"Terrain Models and Ortho Products","question":"A Digital Surface Model (DSM) represents the elevation of the __________ including buildings and vegetation.","options":["ellipsoid","bare earth only","top surface","geoid"],"correct":2,"explanation":"A DSM follows the visible top surface, including roofs and vegetation canopies. A bare-earth terrain model aims to describe ground beneath those objects, so the two products differ in built-up or forested areas.","examTip":"Link this question to AGeE0206: Terrain Models and Ortho Products.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":119,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Terrain Models and Ortho Products","chapterCode":"AGeE0206","topic":"Terrain Models and Ortho Products","question":"Compared with a DSM, a DEM intended to represent bare terrain attempts to minimize the influence of __________.","options":["map projection parameters","natural and artificial surface objects","coordinate reference systems","contour interpolation methods"],"correct":1,"explanation":"A bare-earth elevation model filters or removes buildings and vegetation to approximate ground level. DEM is sometimes used as an umbrella term, so always check the product definition rather than its label alone.","examTip":"Link this question to AGeE0206: Terrain Models and Ortho Products.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":120,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Terrain Models and Ortho Products","chapterCode":"AGeE0206","topic":"Terrain Models and Ortho Products","question":"LiDAR is an __________ sensor that measures range by time-of-flight or phase difference.","options":["passive optical","thermal","gravity","active laser"],"correct":3,"explanation":"LiDAR emits laser energy and measures its return, making it active. In a pulse system, range is cΔt/2 because the measured time includes both outward and return travel.","examTip":"Link this question to AGeE0206: Terrain Models and Ortho Products.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":121,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Terrain Models and Ortho Products","chapterCode":"AGeE0206","topic":"Terrain Models and Ortho Products","question":"SAR is a __________ radar system capable of all-weather, day–night imaging.","options":["passive microwave","side-looking","nadir-looking optical","thermal infrared"],"correct":1,"explanation":"Synthetic aperture radar normally looks to the side and uses microwave signals. It can operate at night and through clouds, though geometry, moisture and weather can still influence the measurement.","examTip":"Link this question to AGeE0206: Terrain Models and Ortho Products.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":122,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Terrain Models and Ortho Products","chapterCode":"AGeE0206","topic":"Terrain Models and Ortho Products","question":"InSAR uses the __________ of two SAR acquisitions to measure millimetre-scale surface displacement.","options":["NDVI","colour composite","phase difference","amplitude only"],"correct":2,"explanation":"InSAR compares radar phase between acquisitions to estimate line-of-sight changes. Atmospheric delay, decorrelation and phase ambiguity must be controlled; millimetre sensitivity does not guarantee millimetre accuracy everywhere.","examTip":"Link this question to AGeE0206: Terrain Models and Ortho Products.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":123,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Terrain Models and Ortho Products","chapterCode":"AGeE0206","topic":"Terrain Models and Ortho Products","question":"An orthophoto is a photograph in which __________ have been removed.","options":["tilt and relief displacements","only shadows","only atmospheric haze","only fiducial marks"],"correct":0,"explanation":"An orthophoto corrects tilt and terrain-induced displacement to produce a map-like image. Ordinary perspective photographs retain scale variation with terrain height and are not directly equivalent to maps.","examTip":"Link this question to AGeE0206: Terrain Models and Ortho Products.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":124,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Image Processing and Interpretation","chapterCode":"AGeE0205","topic":"Image Processing and Interpretation","question":"The interpretation elements used in photo interpretation include tone, texture, size, shape, shadow, pattern, site and __________.","options":["ellipsoid","datum","DOP","association"],"correct":3,"explanation":"Association uses contextual relationships, such as a bridge beside a river or a playground near a school. It supplements direct visual cues like shape, tone and texture.","examTip":"Link this question to AGeE0205: Image Processing and Interpretation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":125,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Image Processing and Interpretation","chapterCode":"AGeE0205","topic":"Image Processing and Interpretation","question":"If NIR reflectance is 0.60 and red reflectance is 0.20, the NDVI value is __________.","options":["0.80","0.25","0.50","0.33"],"correct":2,"explanation":"NDVI = (0.60 − 0.20)/(0.60 + 0.20) = 0.40/0.80 = 0.50. Subtract first, then divide by the sum; do not divide NIR by red alone.","examTip":"Link this question to AGeE0205: Image Processing and Interpretation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":126,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Image Processing and Interpretation","chapterCode":"AGeE0205","topic":"Image Processing and Interpretation","question":"Maximum-likelihood classification assumes that the spectral classes follow a __________ distribution.","options":["Gaussian","exponential","uniform","Poisson"],"correct":0,"explanation":"The common maximum-likelihood classifier models each class with a multivariate Gaussian distribution. Means and covariance matrices then determine the probability of a pixel belonging to each class.","examTip":"Link this question to AGeE0205: Image Processing and Interpretation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":127,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"A photo format of 230 mm × 230 mm at a scale of 1:10 000 covers a ground square of side __________.","options":["23.0 km","230 m","1.15 km","2.30 km"],"correct":3,"explanation":"Ground side = 230 mm × 10 000 = 2 300 000 mm = 2300 m = 2.30 km. Both the map scale and unit conversion are necessary.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":128,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"A photograph covering 2.30 km on a side is flown with 60% forward overlap. The air base is __________.","options":["1.84 km","0.92 km","1.38 km","2.30 km"],"correct":1,"explanation":"With 60% overlap, only 40% of the footprint is new ground. B = 2.30 × 0.40 = 0.92 km; using 60% directly would give the overlap distance instead.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":129,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Bundle block adjustment is a simultaneous __________ solution for camera parameters and point coordinates.","options":["magnetic","graphical","barometric","least-squares"],"correct":3,"explanation":"Bundle adjustment minimizes weighted image reprojection residuals while estimating camera parameters and object-point coordinates together. Control and tie points connect the images into a consistent block.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":130,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Terrain Models and Ortho Products","chapterCode":"AGeE0206","topic":"Terrain Models and Ortho Products","question":"Which of the following statements about a DTM is most accurate?","options":["A DTM includes building roofs by definition.","A DTM is identical to a DSM.","A DTM is a bare-earth model often enriched with breaklines.","A DTM cannot be derived from LiDAR."],"correct":2,"explanation":"A DTM represents bare terrain and can include breaklines that preserve abrupt slope changes. It is not simply the elevation of treetops or roofs; those belong in a DSM.","examTip":"Link this question to AGeE0206: Terrain Models and Ortho Products.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":131,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Basic Geodesy","chapterCode":"AGeE0301","topic":"Basic Geodesy","question":"Geodesy is the science of measuring and representing the shape, size and __________ of the Earth.","options":["gravity field","vegetation cover","land use","climate"],"correct":0,"explanation":"Geodesy deals with Earth's geometry and gravity, including their changes through time. Gravity is needed to define physical height surfaces, not just horizontal coordinates.","examTip":"Link this question to AGeE0301: Basic Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":132,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Basic Geodesy","chapterCode":"AGeE0301","topic":"Basic Geodesy","question":"The equipotential surface of the Earth's gravity field that best approximates mean sea level is the __________.","options":["topographic surface","geoid","sphere","ellipsoid"],"correct":1,"explanation":"The geoid is a selected equipotential gravity surface approximating mean sea level. It is physically defined and irregular, unlike a smooth mathematical reference ellipsoid.","examTip":"Link this question to AGeE0301: Basic Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":133,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Basic Geodesy","chapterCode":"AGeE0301","topic":"Basic Geodesy","question":"The reference ellipsoid is a mathematically defined __________ used for geodetic coordinates.","options":["oblate spheroid","horizontal plane","prolate spheroid","irregular physical surface"],"correct":0,"explanation":"An oblate spheroid is a sphere flattened at the poles. Its semi-major axis and flattening define a smooth reference surface on which geodetic coordinates can be computed.","examTip":"Link this question to AGeE0301: Basic Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":134,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Basic Geodesy","chapterCode":"AGeE0301","topic":"Basic Geodesy","question":"If ellipsoidal height is represented by h, orthometric height by H and geoid undulation by N, the relationship is __________.","options":["h = H − N","N = h + H","H = h + N","h = H + N"],"correct":3,"explanation":"Ellipsoidal height spans from the ellipsoid to the point; orthometric height spans approximately from the geoid to the point. The geoid's separation N gives h = H + N.","examTip":"Link this question to AGeE0301: Basic Geodesy.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":135,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Basic Geodesy","chapterCode":"AGeE0301","topic":"Basic Geodesy","question":"The deflection of the vertical is the angle between the plumb line and the __________.","options":["magnetic meridian","normal to the reference ellipsoid","celestial equator","prime vertical"],"correct":1,"explanation":"Gravity defines the plumb direction, while ellipsoid geometry defines the surface normal. Their small angular difference is the deflection of the vertical.","examTip":"Link this question to AGeE0301: Basic Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":136,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Basic Geodesy","chapterCode":"AGeE0301","topic":"Basic Geodesy","question":"The meridian component of the deflection of the vertical is given by __________.","options":["η = (Λ − λ) cos φ","N = T/γ","ξ = Φ − φ","A − α"],"correct":2,"explanation":"Astronomical latitude Φ follows the gravity direction; geodetic latitude φ follows the ellipsoid normal. Their difference ξ = Φ − φ is the north–south deflection component.","examTip":"Link this question to AGeE0301: Basic Geodesy.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":137,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Basic Geodesy","chapterCode":"AGeE0301","topic":"Basic Geodesy","question":"The Laplace equation of geodesy relates astronomical and geodetic azimuths by __________.","options":["A − α = η / tan φ","A − α = ξ tan φ","A − α = ξ + η","A − α = η tan φ"],"correct":3,"explanation":"Under the notes' sign convention, the east–west deflection component η changes astronomical and geodetic azimuth by η tan φ. This Laplace relation is distinct from the potential equation ∇²V = 0.","examTip":"Link this question to AGeE0301: Basic Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":138,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Mathematical and Geometrical Geodesy","chapterCode":"AGeE0302","topic":"Mathematical and Geometrical Geodesy","question":"Flattening of an ellipsoid is defined as __________.","options":["f = (a − b)/a","f = a/b","f = (a + b)/a","f = (a − b)/b"],"correct":0,"explanation":"Flattening is the equatorial–polar radius difference divided by the equatorial radius: f = (a − b)/a. It is dimensionless and zero for a sphere.","examTip":"Link this question to AGeE0302: Mathematical and Geometrical Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":139,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Mathematical and Geometrical Geodesy","chapterCode":"AGeE0302","topic":"Mathematical and Geometrical Geodesy","question":"The WGS84 ellipsoid has a semi-major axis of __________.","options":["6 377 276 m","6 378 137 m","6 356 752 m","6 399 594 m"],"correct":1,"explanation":"The WGS84 ellipsoid defines a = 6 378 137 m. This is the semi-major equatorial axis, not a mean Earth radius or the polar semi-minor axis.","examTip":"Link this question to AGeE0302: Mathematical and Geometrical Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":140,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Mathematical and Geometrical Geodesy","chapterCode":"AGeE0302","topic":"Mathematical and Geometrical Geodesy","question":"The classical ellipsoid historically used for the Nepal/India datum is __________.","options":["Clarke 1866","Bessel 1841","Everest 1830","GRS80"],"correct":2,"explanation":"The supplied notes associate the historical Nepal/India datum with the Everest 1830 ellipsoid. This must not be confused with WGS84 used for global satellite positioning.","examTip":"Link this question to AGeE0302: Mathematical and Geometrical Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":141,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Mathematical and Geometrical Geodesy","chapterCode":"AGeE0302","topic":"Mathematical and Geometrical Geodesy","question":"Between the equator and the pole, the radii of curvature satisfy __________.","options":["N < M < R","M < R < N","N < R < M","M = N = R"],"correct":1,"explanation":"For intermediate latitudes on an oblate ellipsoid, the meridional radius M is less than the prime-vertical radius N. A directional normal-section radius lies between them; equality occurs in limiting directions.","examTip":"Link this question to AGeE0302: Mathematical and Geometrical Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":142,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Mathematical and Geometrical Geodesy","chapterCode":"AGeE0302","topic":"Mathematical and Geometrical Geodesy","question":"The radius of curvature in the prime vertical is denoted by __________.","options":["f","M","a","N"],"correct":3,"explanation":"N conventionally denotes the prime-vertical curvature radius. The same letter can denote geoid undulation elsewhere, so identify the equation's context before substituting.","examTip":"Link this question to AGeE0302: Mathematical and Geometrical Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":143,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Datum, Coordinate Systems and Projections","chapterCode":"AGeE0303","topic":"Datum, Coordinate Systems and Projections","question":"A geodetic datum defines the origin, orientation and scale of a coordinate system together with the __________.","options":["flying height","contour interval","reference ellipsoid","map legend"],"correct":2,"explanation":"An ellipsoid describes shape but not a complete datum. Origin, orientation and scale tie that reference geometry to a coordinate system or its realization.","examTip":"Link this question to AGeE0303: Datum, Coordinate Systems and Projections.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":144,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Datum, Coordinate Systems and Projections","chapterCode":"AGeE0303","topic":"Datum, Coordinate Systems and Projections","question":"ITRF is the realization of the __________.","options":["International Terrestrial Reference System","cadastral sheet system","celestial reference system","magnetic reference system"],"correct":0,"explanation":"ITRS is the system of definitions; ITRF realizes it through station coordinates and velocities. A coordinate without its reference-frame realization and epoch can be ambiguous in precise work.","examTip":"Link this question to AGeE0303: Datum, Coordinate Systems and Projections.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":145,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Datum, Coordinate Systems and Projections","chapterCode":"AGeE0303","topic":"Datum, Coordinate Systems and Projections","question":"The seven-parameter Helmert transformation consists of three translations, three rotations and __________.","options":["one scale","one azimuth","two scales","one flattening"],"correct":0,"explanation":"A 3D Helmert similarity transform uses three shifts, three rotations and one uniform scale. It aligns reference frames without introducing separate scale factors for each axis.","examTip":"Link this question to AGeE0303: Datum, Coordinate Systems and Projections.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":146,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Physical Geodesy","chapterCode":"AGeE0304","topic":"Physical Geodesy","question":"Gravity potential W is the sum of gravitational potential V and __________ potential.","options":["thermal","atmospheric","magnetic","centrifugal"],"correct":3,"explanation":"On the rotating Earth, gravity combines gravitational attraction with centrifugal acceleration. Its potential therefore combines V with the centrifugal potential.","examTip":"Link this question to AGeE0304: Physical Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":147,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Physical Geodesy","chapterCode":"AGeE0304","topic":"Physical Geodesy","question":"Gravity anomaly is defined as __________.","options":["γ / g","g × γ","g − γ","g + γ"],"correct":2,"explanation":"The notes abbreviate gravity anomaly as g − γ. In rigorous work, the observed and normal gravity values must be reduced to the appropriate surfaces; a raw difference at one point is a gravity disturbance.","examTip":"Link this question to AGeE0304: Physical Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":148,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Physical Geodesy","chapterCode":"AGeE0304","topic":"Physical Geodesy","question":"Bruns' formula relates geoid undulation to the disturbing potential by __________.","options":["N = T + γ","N = T/γ","N = Tγ","N = γ/T"],"correct":1,"explanation":"Bruns' formula N = T/γ converts disturbing potential T into an approximate geoid-height separation using normal gravity γ. The dimensions are potential divided by acceleration, giving length.","examTip":"Link this question to AGeE0304: Physical Geodesy.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":149,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Physical Geodesy","chapterCode":"AGeE0304","topic":"Physical Geodesy","question":"Clairaut's theorem states that __________.","options":["f + β = m/2","fβ = (5/2)m","f − β = (5/2)m","f + β = (5/2)m"],"correct":3,"explanation":"Clairaut's first-order relation links geometric flattening f, gravity flattening β and the rotational parameter m. It shows that Earth's shape and latitude-dependent gravity are connected.","examTip":"Link this question to AGeE0304: Physical Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":150,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Gravimetry and Earth’s Gravity Field","chapterCode":"AGeE0305","topic":"Gravimetry and Earth’s Gravity Field","question":"The free-air gravity correction is approximately __________ mGal, where h is the station height in metres.","options":["0.3086 h","0.1119 h","0.0673 h²","0.0419 ρh"],"correct":0,"explanation":"Gravity generally weakens with elevation. Reducing an observation down to the reference level adds approximately 0.3086h mGal as the free-air correction, with h in metres.","examTip":"Link this question to AGeE0305: Gravimetry and Earth’s Gravity Field.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":151,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Gravimetry and Earth’s Gravity Field","chapterCode":"AGeE0305","topic":"Gravimetry and Earth’s Gravity Field","question":"For a station at 1350 m elevation, the free-air correction is approximately __________.","options":["41.7 mGal","151.0 mGal","416.6 mGal","308.6 mGal"],"correct":2,"explanation":"Free-air correction = 0.3086 × 1350 = 416.61 mGal. This is the height correction magnitude, not the station's total gravity.","examTip":"Link this question to AGeE0305: Gravimetry and Earth’s Gravity Field.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":152,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Gravimetry and Earth’s Gravity Field","chapterCode":"AGeE0305","topic":"Gravimetry and Earth’s Gravity Field","question":"The Bouguer plate correction is given by __________ mGal.","options":["0.3086 h","0.0419 ρh","0.0673 D²","0.0112 D²"],"correct":1,"explanation":"For an ideal infinite slab, attraction is 2πGρh. With density in g/cm³ and height in metres, the practical coefficient becomes about 0.0419, giving mGal.","examTip":"Link this question to AGeE0305: Gravimetry and Earth’s Gravity Field.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":153,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Gravimetry and Earth’s Gravity Field","chapterCode":"AGeE0305","topic":"Gravimetry and Earth’s Gravity Field","question":"For h = 1350 m and ρ = 2.67 g/cm³, the Bouguer correction is approximately __________.","options":["151.0 mGal","41.7 mGal","0.11 mGal","416.6 mGal"],"correct":0,"explanation":"Bouguer slab attraction = 0.0419 × 2.67 × 1350 = 151.03 mGal. This slab term is normally subtracted in a simple Bouguer reduction.","examTip":"Link this question to AGeE0305: Gravimetry and Earth’s Gravity Field.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":154,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Gravimetry and Earth’s Gravity Field","chapterCode":"AGeE0305","topic":"Gravimetry and Earth’s Gravity Field","question":"The Airy–Heiskanen isostatic model assumes constant crustal __________ and variable crustal thickness.","options":["temperature","density","age","magnetism"],"correct":1,"explanation":"Airy–Heiskanen compensation keeps crustal density approximately constant but varies crustal thickness. High mountains are supported by deeper low-density crustal roots.","examTip":"Link this question to AGeE0305: Gravimetry and Earth’s Gravity Field.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":155,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Gravimetry and Earth’s Gravity Field","chapterCode":"AGeE0305","topic":"Gravimetry and Earth’s Gravity Field","question":"The Pratt–Hayford isostatic model assumes variable crustal density and a constant __________.","options":["mountain height","gravity anomaly","flattening","depth of compensation"],"correct":3,"explanation":"Pratt–Hayford compensation holds the compensation depth fixed and varies column density. Higher columns must have lower average density to balance equal-pressure columns below.","examTip":"Link this question to AGeE0305: Gravimetry and Earth’s Gravity Field.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":156,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Gravimetry and Earth’s Gravity Field","chapterCode":"AGeE0305","topic":"Gravimetry and Earth’s Gravity Field","question":"Outside the attracting masses, the gravitational potential satisfies Laplace's equation __________.","options":["∇V = 0","∇²V = 4πGρ","∇²V = 0","∇ × V = 0"],"correct":2,"explanation":"In a region without attracting mass, the gravitational potential is harmonic: ∇²V = 0. Inside mass, Poisson's equation includes a density term instead.","examTip":"Link this question to AGeE0305: Gravimetry and Earth’s Gravity Field.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":157,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Gravimetry and Earth’s Gravity Field","chapterCode":"AGeE0305","topic":"Gravimetry and Earth’s Gravity Field","question":"The C₂₀ term of the geopotential spherical-harmonic expansion describes the Earth's __________.","options":["atmosphere","polar flattening","magnetic field","ocean tides"],"correct":1,"explanation":"The degree-two zonal coefficient C₂₀ represents the dominant oblateness-related variation of Earth's gravity field. It is connected with polar flattening rather than local terrain detail.","examTip":"Link this question to AGeE0305: Gravimetry and Earth’s Gravity Field.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":158,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"One mean solar day is approximately __________ sidereal days.","options":["1.0416667","1.0000000","0.9972696","1.0027379"],"correct":3,"explanation":"Earth rotates slightly more than once relative to the stars while advancing along its orbit during one solar day. Thus one mean solar day contains about 1.0027379 sidereal days.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":159,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"Longitude–time equivalence gives 15° of longitude equal to __________.","options":["1 minute","4 seconds","1 hour","4 minutes"],"correct":2,"explanation":"Earth turns 360° in 24 hours, so 360/24 = 15° corresponds to one hour. This gives the longitude-to-time conversion.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":160,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"One degree of longitude corresponds to a time difference of __________.","options":["4 minutes","15 minutes","1 hour","1 minute"],"correct":0,"explanation":"One hour is 60 minutes for 15°, so one degree corresponds to 60/15 = 4 minutes of time. Angular minutes and time minutes are different units.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":161,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"Nepal Standard Time is __________.","options":["UTC+5:45","UTC+5:00","UTC+5:30","UTC+6:00"],"correct":0,"explanation":"The supplied study convention for Nepal Standard Time is UTC plus 5 hours 45 minutes. To convert Nepal clock time to UTC, subtract that offset.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":162,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"An observer at longitude 85°20′ E records local mean time 10h 00m. The corresponding Greenwich Mean Time is __________.","options":["10h 00m 00s","15h 41m 20s","05h 41m 20s","04h 18m 40s"],"correct":3,"explanation":"85°20′ east corresponds to 5h 41m 20s ahead of Greenwich. Subtract from 10h 00m: GMT = 04h 18m 40s.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":163,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"A sidereal day is approximately __________ of mean solar time.","options":["24h 00m 00s","23h 56m 04s","23h 00m 00s","24h 04m 00s"],"correct":1,"explanation":"A sidereal day measures rotation relative to distant stars. It is about 3m 56s shorter than a mean solar day because Earth also advances along its orbit.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":164,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"Precession of the Earth's axis has a period of about __________ years.","options":["26","18.6","25 800","365.25"],"correct":2,"explanation":"Precession is the slow conical change in Earth's rotation-axis direction under external torques. The notes round its cycle to about 25 800 years; it is not the daily rotation.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":165,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"The main period of nutation is about __________ years.","options":["18.6","25 800","1.2","1"],"correct":0,"explanation":"The principal nutation term has an approximately 18.6-year period linked to the lunar orbital-node cycle. Nutation is a shorter oscillation superimposed on precession.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":166,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"Annual aberration of starlight is approximately __________.","options":["34′","20.5″","9″","50″ per year"],"correct":1,"explanation":"Earth's orbital velocity changes the apparent direction of incoming starlight. The annual aberration constant is about 20.5 arcseconds, distinct from atmospheric refraction.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":167,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"Astronomical refraction at the horizon is about __________.","options":["0″","20.5″","9″","34′"],"correct":3,"explanation":"Near the horizon, atmospheric refraction can lift an apparent star position by roughly 34 arcminutes under standard conditions. The actual value depends strongly on the atmosphere.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":168,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Gravimetry and Earth’s Gravity Field","chapterCode":"AGeE0305","topic":"Gravimetry and Earth’s Gravity Field","question":"Absolute gravimeters measure g by __________.","options":["spring extension only","spirit levelling","free-fall or atomic-interferometer methods","magnetic declination"],"correct":2,"explanation":"Absolute instruments determine acceleration from motion or atomic phase measurements with calibrated time and length. Relative gravimeters instead measure differences from a reference value.","examTip":"Link this question to AGeE0305: Gravimetry and Earth’s Gravity Field.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":169,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Gravimetry and Earth’s Gravity Field","chapterCode":"AGeE0305","topic":"Gravimetry and Earth’s Gravity Field","question":"Somigliana's formula is used to compute __________.","options":["map scale factor","geoid undulation","magnetic declination","normal gravity"],"correct":3,"explanation":"Somigliana's formula models normal gravity as a function of geodetic latitude on a reference ellipsoid. It does not directly supply terrain-induced local gravity anomalies.","examTip":"Link this question to AGeE0305: Gravimetry and Earth’s Gravity Field.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":170,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Datum, Coordinate Systems and Projections","chapterCode":"AGeE0303","topic":"Datum, Coordinate Systems and Projections","question":"ECEF stands for __________.","options":["Equatorial Celestial Ephemeris Frame","European Conventional Earth Figure","Earth-Centred, Earth-Fixed","Ellipsoidal Coordinate Easting Frame"],"correct":2,"explanation":"ECEF places its origin at Earth's centre and rotates its axes with Earth. Earth-fixed ground points therefore have nearly stable coordinates apart from tectonic and other motion.","examTip":"Link this question to AGeE0303: Datum, Coordinate Systems and Projections.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":171,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Datum, Coordinate Systems and Projections","chapterCode":"AGeE0303","topic":"Datum, Coordinate Systems and Projections","question":"A local topocentric frame is commonly expressed as __________.","options":["east, north, up (ENU)","UTM zone number only","XYZ geocentric only","φ, λ only"],"correct":0,"explanation":"An ENU frame has east, north and up axes anchored at a local point. It is useful for expressing nearby displacements and must not be confused with global ECEF axes.","examTip":"Link this question to AGeE0303: Datum, Coordinate Systems and Projections.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":172,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Datum, Coordinate Systems and Projections","chapterCode":"AGeE0303","topic":"Datum, Coordinate Systems and Projections","question":"Geodetic latitude, longitude and ellipsoidal height are converted to geocentric Cartesian coordinates using the radius of curvature __________.","options":["M only","N (prime vertical)","mean sea level","geoid undulation only"],"correct":1,"explanation":"The standard conversion uses X = (N + h)cosφ cosλ and Y = (N + h)cosφ sinλ. N is the prime-vertical radius of curvature at the point's latitude.","examTip":"Link this question to AGeE0303: Datum, Coordinate Systems and Projections.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":173,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"Polar motion refers to the small wandering of the __________ over the Earth's surface.","options":["magnetic pole only","vernal equinox","Greenwich meridian","rotation pole"],"correct":3,"explanation":"Polar motion is movement of the rotation axis relative to the terrestrial crust. It differs from precession and nutation, which describe orientation relative to space.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":174,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Mathematical and Geometrical Geodesy","chapterCode":"AGeE0302","topic":"Mathematical and Geometrical Geodesy","question":"Using a meridian radius M ≈ 6360 km, the meridional arc between 27°N and 28°N is approximately __________.","options":["185 km","111 km","222 km","100 km"],"correct":1,"explanation":"Arc length ≈ MΔφ with Δφ in radians. Therefore 6360 × π/180 = 111.00 km for a one-degree meridional interval.","examTip":"Link this question to AGeE0302: Mathematical and Geometrical Geodesy.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":175,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Basic Geodesy","chapterCode":"AGeE0301","topic":"Basic Geodesy","question":"Which of the following is a physical (not purely mathematical) surface?","options":["Geoid","Reference ellipsoid","Mean Earth sphere","UTM developable cylinder"],"correct":0,"explanation":"The geoid is determined by Earth's gravity field. An ellipsoid, sphere or projection plane is a mathematical reference geometry rather than an equipotential physical surface.","examTip":"Link this question to AGeE0301: Basic Geodesy.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":176,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Field Astronomy and Time Systems","chapterCode":"AGeE0306","topic":"Field Astronomy and Time Systems","question":"Convert 6h 12m 30s of mean solar time to sidereal time. The result is approximately __________.","options":["6h 11m 29s","6h 24m 15s","6h 13m 31s","6h 12m 30s"],"correct":2,"explanation":"Treat this as a time interval: 6h 12m 30s = 22 350 s. Multiply by 1.0027379 to get 22 411.19 sidereal seconds, or about 6h 13m 31s.","examTip":"Link this question to AGeE0306: Field Astronomy and Time Systems.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":177,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Physical Geodesy","chapterCode":"AGeE0304","topic":"Physical Geodesy","question":"The terrain correction applied in gravity reduction is __________.","options":["zero in mountainous areas","always negative","equal to the free-air correction","always positive"],"correct":3,"explanation":"The standard terrain correction compensates for both missing mass in valleys and excess relief relative to the Bouguer slab. Its contribution to the usual Bouguer anomaly is non-negative.","examTip":"Link this question to AGeE0304: Physical Geodesy.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":178,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Datum, Coordinate Systems and Projections","chapterCode":"AGeE0303","topic":"Datum, Coordinate Systems and Projections","question":"MUTM used in Nepal is a 3-degree Transverse Mercator projection with k₀ = __________.","options":["0.9990","0.9999","0.9996","1.0000"],"correct":1,"explanation":"The supplied Nepal mapping notes specify MUTM central scale 0.9999. This differs from UTM's 0.9996; do not transfer parameters between the two projection definitions.","examTip":"Link this question to AGeE0303: Datum, Coordinate Systems and Projections.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":179,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Datum, Coordinate Systems and Projections","chapterCode":"AGeE0303","topic":"Datum, Coordinate Systems and Projections","question":"If H = 1350.000 m and N = −35.200 m, the ellipsoidal height h is __________.","options":["1314.800 m","1350.000 m","−35.200 m","1385.200 m"],"correct":0,"explanation":"Use h = H + N = 1350.000 + (−35.200) = 1314.800 m. Negative geoid undulation means the geoid lies below the ellipsoid here.","examTip":"Link this question to AGeE0303: Datum, Coordinate Systems and Projections.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":180,"module":"Geodesy and Gravity Field","moduleCode":"AGeE03","moduleId":3,"chapter":"Datum, Coordinate Systems and Projections","chapterCode":"AGeE0303","topic":"Datum, Coordinate Systems and Projections","question":"Dependent coordinate systems are those that __________.","options":["are identical to ITRF","do not require a datum","depend on a locally adopted origin and orientation","are inertial and star-fixed"],"correct":2,"explanation":"A locally dependent grid takes its origin and orientation from adopted local control. Its coordinates cannot be combined directly with a national or global frame without a defined relationship.","examTip":"Link this question to AGeE0303: Datum, Coordinate Systems and Projections.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":181,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"A cadastre is a systematic, __________-based register of land information.","options":["contour","pixel","parcel","satellite"],"correct":2,"explanation":"The parcel is the basic unit joining mapped boundaries with information about land rights. A cadastre is therefore parcel-based rather than just a list of owners or isolated survey points.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":182,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"The Napoleonic cadastre of the early 1800s is regarded as a model of the modern __________ cadastre.","options":["parcel-based","deed-less","unmapped","fiscal-only"],"correct":0,"explanation":"The Napoleonic system systematically mapped and recorded individual land parcels, particularly for taxation. It became an influential model for modern parcel-based cadastral records.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":183,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"Every cadastral parcel should have a unique __________.","options":["flying height","identifier","contour interval","DOP value"],"correct":1,"explanation":"A unique parcel identifier distinguishes one land unit from every other and links its map geometry with textual records. Owner names alone are not stable or necessarily unique.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":184,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"The three essential components of a cadastre are the map, the register and the __________.","options":["flight plan","gravity model","orthophoto","parcel identifier"],"correct":3,"explanation":"The map shows where a parcel is; the register describes its rights and attributes. A shared parcel identifier is the key connecting those two records reliably.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":185,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"Analog cadastral surveying typically used chain, plane table and __________.","options":["LiDAR","theodolite","GNSS","UAV"],"correct":1,"explanation":"A theodolite measures angles used with chains or tapes in conventional cadastral surveys. GNSS and digital total stations belong to newer electronic measurement workflows.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":186,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"Nepal's national mapping and cadastral framework uses the __________ ellipsoid.","options":["GRS80 only","WGS84 only","Clarke 1880","Everest 1830"],"correct":3,"explanation":"The supplied notes describe the legacy Nepal mapping framework as Everest-based. A project's actual datum and epoch must be confirmed; not every modern Nepal dataset uses that legacy reference.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":187,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"MUTM zones in Nepal have central meridians at __________.","options":["81°E, 84°E and 87°E","84°E only","80°E, 86°E and 92°E","78°E, 84°E and 90°E"],"correct":0,"explanation":"The notes specify 3° MUTM zones centred on 81°E, 84°E and 87°E. Selecting the correct central meridian matters when converting cadastral grid coordinates.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":188,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"The common cadastral map scale used in urban areas of Nepal is __________.","options":["1:50 000","1:250 000","1:500","1:25 000"],"correct":2,"explanation":"A 1:500 map allocates 1 cm to just 5 m of ground, making small urban parcels legible. This is the notes' common urban example, not a universal scale for all cadastral projects.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":189,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"Cadastral surveys in Nepal are conducted by the __________.","options":["Civil Aviation Authority","Department of Roads","Survey Department (Napi Bibhag)","Nepal Rastra Bank"],"correct":2,"explanation":"The supplied materials associate cadastral measurement and mapping with the Survey Department/Napi offices. Mapping boundaries is distinct from maintaining land-registration transactions.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":190,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"Land registration (ownership records) in Nepal is maintained by the __________.","options":["Land Revenue (Malpot) Offices","Survey Department only","Central Bureau of Statistics","Nepal Army"],"correct":0,"explanation":"The notes assign land-ownership registration records to Land Revenue or Malpot offices. Survey records supply geometry, while registration records document rights and transactions.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":191,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"The land-ownership certificate issued in Nepal is commonly called the __________.","options":["blue book","green card","red line","lalpurja"],"correct":3,"explanation":"Lalpurja is the commonly used name for the land-ownership certificate in the supplied Nepal material. It is a rights document, not itself a substitute for all boundary-survey evidence.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":192,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"A general cadastral survey covers __________, whereas a sporadic survey covers a single parcel.","options":["only one building","an entire designated area","only government land","only forest land"],"correct":1,"explanation":"A general or systematic survey covers a designated area as a coordinated programme. A sporadic survey responds to an individual parcel or transaction rather than covering every parcel together.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":193,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"Updating of cadastral records after sale, inheritance or subdivision is called __________.","options":["triangulation","mutation","resection","rectification"],"correct":1,"explanation":"Mutation updates the record after a change such as sale, inheritance or subdivision. Without this maintenance, even an initially accurate cadastre becomes outdated.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":194,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"In the hill system of land measure, 1 ropani equals __________ aana.","options":["16","64","20","4"],"correct":0,"explanation":"The customary hierarchy is 1 ropani = 16 aana, with further subdivisions into paisa and daam. Keep these area units separate from the Terai bigha–kattha system.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":195,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"A rectangular parcel of 20 m × 25 m has an area of approximately __________ ropani.","options":["9.83","1.97","0.98","0.49"],"correct":2,"explanation":"Area = 20 × 25 = 500 m². Divide by 508.72 m² per ropani: 500/508.72 ≈ 0.983 ropani, rounded to 0.98.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":196,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Administration","chapterCode":"AGeE0402","topic":"Land Administration","question":"Land administration comprises the functions of land tenure, land value, land use and __________.","options":["cartography only","photogrammetry","gravimetry","land development"],"correct":3,"explanation":"Land administration integrates tenure, valuation, use and development. Development covers changes and improvements to land, connecting records with implementation of planning decisions.","examTip":"Link this question to AGeE0402: Land Administration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":197,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Administration","chapterCode":"AGeE0402","topic":"Land Administration","question":"The Land Reform Act of Nepal that introduced ceilings and tenancy rights is dated __________.","options":["2019 BS (1962 AD)","2076 BS (2019 AD)","2021 BS (1964 AD)","2055 BS (1999 AD)"],"correct":2,"explanation":"The supplied historical notes date Nepal's Land Act to 2021 BS (1964 AD) and associate it with ceilings and tenancy reform. This answer is a historical study reference, not a statement of current amended provisions.","examTip":"Link this question to AGeE0402: Land Administration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":198,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Administration","chapterCode":"AGeE0402","topic":"Land Administration","question":"Raikar land in Nepal is state-owned land held under __________ with transferable rights.","options":["communal forest tenure","religious trust only","military occupation","private tenancy"],"correct":3,"explanation":"The supplied notes describe Raikar as state-recognized taxable land with transferable private holding rights. The phrase private tenancy is a historical classification here, not an ordinary short-term rental contract.","examTip":"Link this question to AGeE0402: Land Administration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":199,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Administration","chapterCode":"AGeE0402","topic":"Land Administration","question":"Kipat, the older customary communal tenure of Nepal, was abolished in __________.","options":["1964","1951","1990","2015"],"correct":0,"explanation":"The notes associate abolition of Kipat with the 1964 reform period. Historical implementation and later changes need separate checking; this question tests the supplied chronology, not a current legal entitlement.","examTip":"Link this question to AGeE0402: Land Administration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":200,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Administration","chapterCode":"AGeE0402","topic":"Land Administration","question":"Guthi land is __________ land held for religious or charitable trusts.","options":["military","endowment","freehold private","forest-only"],"correct":1,"explanation":"Guthi is associated with land endowed to support religious, charitable or social purposes. Its defining feature is that endowment purpose, not merely its rural location or parcel size.","examTip":"Link this question to AGeE0402: Land Administration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":201,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Tenure and Land Registration","chapterCode":"AGeE0403","topic":"Land Tenure and Land Registration","question":"In registration of deeds, the state __________.","options":["issues only orthophotos","guarantees an indefeasible title","registers the transfer document but does not guarantee title","abolishes all private rights"],"correct":2,"explanation":"Deeds registration records documents showing transactions. It does not by itself guarantee that the transferor held an unchallengeable title, so examination of the chain of documents may still be needed.","examTip":"Link this question to AGeE0403: Land Tenure and Land Registration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":202,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Tenure and Land Registration","chapterCode":"AGeE0403","topic":"Land Tenure and Land Registration","question":"The Torrens system is a system of registration of __________.","options":["title with state guarantee","magnetic bearings","deeds only","gravity anomalies"],"correct":0,"explanation":"Torrens-style title registration centres on the registered title and a state-backed assurance framework. This differs conceptually from recording transaction deeds without equivalent title assurance.","examTip":"Link this question to AGeE0403: Land Tenure and Land Registration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":203,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Information System","chapterCode":"AGeE0404","topic":"Land Information System","question":"A Land Information System (LIS) is essentially a GIS applied to __________.","options":["weather forecasting","land records and land administration","hydrographic charting only","satellite orbit determination"],"correct":1,"explanation":"An LIS applies spatial information management to parcels, rights, land use and administration. It connects land geometry with administrative records rather than serving only as an image viewer.","examTip":"Link this question to AGeE0404: Land Information System.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":204,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Use and Land Valuation","chapterCode":"AGeE0405","topic":"Land Use and Land Valuation","question":"Land consolidation is primarily used to improve __________ efficiency by re-shaping fragmented holdings.","options":["cadastral taxation only","urban","military","agricultural"],"correct":3,"explanation":"Fragmented agricultural plots increase access and cultivation costs. Consolidation rearranges holdings to make them more coherent and usable, aiming to improve agricultural efficiency.","examTip":"Link this question to AGeE0405: Land Use and Land Valuation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":205,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Use and Land Valuation","chapterCode":"AGeE0405","topic":"Land Use and Land Valuation","question":"Land pooling (land readjustment) is widely used in Nepal for __________.","options":["hydrographic charting","forest nationalization","planned urban development","rural farm amalgamation only"],"correct":2,"explanation":"Land pooling combines and replans participating land, allocates infrastructure space, then returns reconfigured serviced plots. It is a land-readjustment approach to planned urban development.","examTip":"Link this question to AGeE0405: Land Use and Land Valuation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":206,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Use and Land Valuation","chapterCode":"AGeE0405","topic":"Land Use and Land Valuation","question":"In a land-pooling project that takes 30% of land for roads and public facilities, an owner who contributed 500 m² receives __________ of serviced land.","options":["150 m²","500 m²","650 m²","350 m²"],"correct":3,"explanation":"The retained share is 100% − 30% = 70%. Returned area = 500 × 0.70 = 350 m², assuming the stated uniform area deduction.","examTip":"Link this question to AGeE0405: Land Use and Land Valuation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":207,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Use and Land Valuation","chapterCode":"AGeE0405","topic":"Land Use and Land Valuation","question":"The comparison (market) approach to valuation estimates value from __________.","options":["recent comparable sales","construction cost only","residual development profit only","capitalized income only"],"correct":0,"explanation":"The market comparison approach estimates value from similar recent transactions, adjusted for differences such as location, size and access. Replacement cost and income capitalization are different methods.","examTip":"Link this question to AGeE0405: Land Use and Land Valuation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":208,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Policies, Acts and Regulations","chapterCode":"AGeE0406","topic":"Land Policies, Acts and Regulations","question":"An Act (Ain) is primary legislation enacted by __________.","options":["a ward committee","Parliament","a ministry circular","a survey office"],"correct":1,"explanation":"An Act is primary legislation enacted by the legislature. Rules imp
