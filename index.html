onents, georeferencing, topology and lineage."],"commonMistakes":["A visually aligned layer may still use the wrong reference system or have weak positional accuracy."],"quickRecap":["Explain GIS components, georeferencing, topology and lineage.","Procedures specify how people collect, validate, manage and analyse data using GIS hardware and software.","The supplied notes emphasize data because collecting and maintaining reliable geographic information is costly and central to results.","CGIS was an early operational geographic information system developed for Canadian land inventory work."],"comparison":[],"relatedQuestionIds":[356,357,358,359,360,361,362,394,395,543,544,545,548,587,589],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"8.1","page":103,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0802","title":"Data Sources and Spatial Data Models","introduction":"Choose a data model to match the phenomenon. Discrete objects have identities and boundaries; fields vary across space. Raster cells and TIN triangles approximate surfaces in different ways.","objective":"Compare vector objects, raster fields and TIN terrain models.","concepts":[{"heading":"A field-based spatial model represents continuously varying phenomena and is typically implemented as raster or TIN","body":"A field assigns a value throughout space, such as elevation or temperature. Raster grids and triangulated surfaces approximate that continuous variation.","sourceQuestionId":363},{"heading":"An object-based model represents discrete entities with boundaries and is typically implemented as vector","body":"Object models represent identifiable entities such as parcels, roads and wells. Vector geometries provide boundaries or locations linked to each object's attributes.","sourceQuestionId":364},{"heading":"A TIN is a network of irregular triangles built from mass points and breaklines","body":"TIN vertices sample elevations, while breaklines constrain important terrain discontinuities. Triangles should respect those lines so interpolation does not smooth across a ridge or channel incorrectly.","sourceQuestionId":365}],"formulas":[],"workedExamples":[],"examTips":["Compare vector objects, raster fields and TIN terrain models."],"commonMistakes":["A raster grid is a representation, not proof that the phenomenon varies uniformly within each cell."],"quickRecap":["Compare vector objects, raster fields and TIN terrain models.","A field assigns a value throughout space, such as elevation or temperature.","Object models represent identifiable entities such as parcels, roads and wells.","TIN vertices sample elevations, while breaklines constrain important terrain discontinuities."],"comparison":[["Vector","Identifiable objects as points, lines or polygons."],["Raster","Values in a regular grid of cells."]],"relatedQuestionIds":[363,364,365,546,588,590],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"8.2","page":104,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0803","title":"Transformation and Geospatial Analysis","introduction":"Spatial analysis combines location and attributes through transforms, overlay, buffering, map algebra and networks. Establish a consistent coordinate reference and clear question before selecting an operation.","objective":"Choose an overlay, buffer, transform or network method for a task.","concepts":[{"heading":"A two-dimensional affine transformation has 6 parameters","body":"A 2D affine model uses x′ = a + bx + cy and y′ = d + ex + fy. The six coefficients allow translation, rotation, scaling and shear.","sourceQuestionId":366},{"heading":"The quality of an affine fit from control points is commonly expressed by the RMS error of residuals","body":"RMS residual summarizes disagreement between transformed and control coordinates. Small fitted residuals do not guarantee accuracy at independent check points or outside the control extent.","sourceQuestionId":367},{"heading":"Rubber sheeting is a non-rigid local geometric correction","body":"Rubber sheeting locally deforms a map to fit control points. Because distortion can vary across the map, it is non-rigid rather than one global similarity transform.","sourceQuestionId":368},{"heading":"Vector overlay operations include union, intersection, clip and erase","body":"Erase removes portions overlapped by another feature. Union retains combined areas; intersection keeps common areas; clip extracts content within a boundary.","sourceQuestionId":369},{"heading":"Map algebra refers to cell-by-cell operations performed on raster layers","body":"Map algebra combines raster values through local, neighbourhood or broader operations. The simplest case applies a formula to corresponding cells in aligned grids.","sourceQuestionId":370},{"heading":"The classic algorithm for shortest-path network analysis is Dijkstra","body":"Dijkstra's algorithm finds shortest paths with non-negative edge weights. The weight can represent distance, travel time or another cost, so shortest need not mean geometrically nearest.","sourceQuestionId":371},{"heading":"Buffer analysis creates a zone of specified distance around a feature","body":"A buffer constructs all locations within a specified distance of a feature. The CRS and units matter: a numeric distance in degrees is not automatically a distance in metres.","sourceQuestionId":396},{"heading":"A combined GIS query uses both attribute and spatial conditions","body":"A combined query might select parcels larger than 500 m² that intersect a flood zone. The area condition is attribute-based and the intersection condition is spatial.","sourceQuestionId":399}],"formulas":[],"workedExamples":[],"examTips":["Choose an overlay, buffer, transform or network method for a task."],"commonMistakes":["A small fitted transformation residual does not guarantee independent positional accuracy."],"quickRecap":["Choose an overlay, buffer, transform or network method for a task.","A 2D affine model uses x′ = a + bx + cy and y′ = d + ex + fy.","RMS residual summarizes disagreement between transformed and control coordinates.","Rubber sheeting locally deforms a map to fit control points."],"comparison":[],"relatedQuestionIds":[366,367,368,369,370,371,396,399,612],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"8.3","page":105,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0804","title":"Surface Modelling","introduction":"A terrain surface supports slope, aspect, shading, visibility and drainage analysis. Each derivative answers a different question and depends on the surface resolution and conditioning choices.","objective":"Calculate slope and interpret aspect, viewshed and flow accumulation.","concepts":[{"heading":"Slope of a surface is the magnitude of the elevation gradient","body":"The gradient describes rate and direction of elevation change. Its magnitude gives steepness, from which percent slope or slope angle can be calculated.","sourceQuestionId":372},{"heading":"Aspect is the compass direction of steepest descent","body":"Aspect points downhill in the direction of greatest elevation decrease. It is undefined or conventionally coded specially on a perfectly flat surface.","sourceQuestionId":373},{"heading":"Hillshade simulates illumination of a DEM using a sun azimuth and altitude","body":"Hillshade combines terrain slope/aspect with a chosen illumination azimuth and altitude. It is a simulated visual aid, not an additional measured elevation surface.","sourceQuestionId":376},{"heading":"Viewshed analysis determines cells visible from one or more observer points","body":"A viewshed checks whether terrain blocks lines of sight from an observer. Results depend on observer height, terrain resolution and whether buildings or vegetation are included.","sourceQuestionId":377},{"heading":"A typical watershed-delineation sequence is: fill sinks → flow direction → flow accumulation → basin/stream extraction","body":"A typical terrain workflow conditions problematic depressions, computes drainage directions and accumulation, then extracts streams and basins. Real depressions should not be removed blindly.","sourceQuestionId":378},{"heading":"The D8 algorithm is used to compute flow direction on a DEM","body":"D8 sends flow from each cell to one of its eight neighbours, usually the steepest downslope one. This discretizes flow direction into eight possible directions.","sourceQuestionId":379},{"heading":"Profile curvature is curvature along the direction of maximum slope","body":"Profile curvature follows the direction of steepest slope and describes how that slope changes. Plan curvature instead examines curvature across the slope and relates to flow convergence.","sourceQuestionId":397}],"formulas":[{"title":"Terrain slope","expression":"Slope % = Δh / D × 100; θ = arctan(Δh / D)","variables":"Δh: height difference; D: horizontal distance.","spoken":"Percent slope equals rise divided by horizontal run times one hundred. The angle is the inverse tangent of rise over run."}],"workedExamples":[{"problem":"Two points 300 m apart horizontally differ in elevation by 60 m. The percent slope is ?.","given":"Two points 300 m apart horizontally differ in elevation by 60 m. The percent slope ","formula":"Slope % = Δh / D × 100; θ = arctan(Δh / D)","calculation":"Percent slope = rise/horizontal run × 100 = 60/300 × 100 = 20%. It is not an angle of 20 degrees.","answer":"20%"},{"problem":"Two points 300 m apart horizontally differ in elevation by 60 m. The slope angle is approximately ?.","given":"Two points 300 m apart horizontally differ in elevation by 60 m. The slope angle ","formula":"Slope % = Δh / D × 100; θ = arctan(Δh / D)","calculation":"Slope angle = arctan(60/300) = arctan(0.2) ≈ 11.31°. Use horizontal run, not the sloping distance, in this ratio.","answer":"11.3°"}],"examTips":["Calculate slope and interpret aspect, viewshed and flow accumulation."],"commonMistakes":["Filling every depression can remove real landforms; terrain conditioning needs a purpose."],"quickRecap":["Calculate slope and interpret aspect, viewshed and flow accumulation.","The gradient describes rate and direction of elevation change.","Aspect points downhill in the direction of greatest elevation decrease.","Hillshade combines terrain slope/aspect with a chosen illumination azimuth and altitude."],"comparison":[],"relatedQuestionIds":[372,373,374,375,376,377,378,379,397,610],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"8.4","page":106,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0805","title":"Spatial Interpolation and DTM","introduction":"Interpolation estimates between samples using an explicit model of distance or spatial dependence. Compare IDW with kriging, read a variogram, and validate predictions using withheld observations.","objective":"Interpret nugget, sill and range and explain interpolation assumptions.","concepts":[{"heading":"Interpolation estimates values at unsampled locations from known samples","body":"Interpolation predicts values inside the sampled spatial domain using nearby observations and a model. Prediction beyond that domain is extrapolation and often less reliable.","sourceQuestionId":380},{"heading":"Resampling recomputes cell values when a raster changes resolution or orientation","body":"When a raster is moved, rotated or resized, its new cells rarely coincide with original centres. Resampling assigns their values using a chosen method such as nearest neighbour or bilinear interpolation.","sourceQuestionId":381},{"heading":"The semivariogram quantifies spatial dependence (dissimilarity) as a function of lag distance","body":"A semivariogram summarizes half the expected squared difference between values separated by a lag. Increasing semivariance generally indicates decreasing similarity over distance.","sourceQuestionId":382},{"heading":"In a semivariogram, the nugget represents variance at lag approaching zero","body":"The nugget is a nonzero limiting discontinuity near zero separation, often reflecting measurement error or variation below the sampling scale. It is not the range distance.","sourceQuestionId":383},{"heading":"The sill of a semivariogram is the plateau (total) variance reached at large lags","body":"The sill is the plateau reached by a bounded variogram model, commonly the total variance. Some models do not reach a finite sill, so the interpretation is model-dependent.","sourceQuestionId":384},{"heading":"The range of a semivariogram is the distance beyond which data are essentially uncorrelated","body":"The range marks where a bounded variogram reaches its sill and spatial correlation becomes negligible under that model. It is not the maximum distance between any two samples.","sourceQuestionId":385},{"heading":"Kriging is described as a best linear unbiased (BLUE) estimator","body":"Given its covariance/variogram assumptions, kriging minimizes prediction variance among linear unbiased estimators. The label BLUE does not mean it outperforms every method for every dataset.","sourceQuestionId":386},{"heading":"Ordinary kriging assumes an unknown but locally constant mean","body":"Ordinary kriging estimates with an unknown constant local mean. A systematic spatial trend violates that simple assumption and may require detrending or a different model.","sourceQuestionId":387},{"heading":"Universal kriging models a deterministic trend (drift) plus a residual","body":"Universal kriging adds a deterministic spatial trend to a correlated residual model. Ordinary kriging instead uses a locally constant unknown mean.","sourceQuestionId":388},{"heading":"IDW interpolation assigns weights inversely proportional to a power of distance","body":"IDW assigns weights proportional to 1/dᵖ, then normalizes them to sum to one. A larger power increases the influence of nearby samples relative to distant ones.","sourceQuestionId":389},{"heading":"Breaklines in a DTM are linear features of abrupt slope change that triangles must not cross","body":"A breakline forces triangle edges to follow an abrupt terrain change. Allowing triangles to cross it can interpolate unrealistic elevations across a ridge, bank or drainage channel.","sourceQuestionId":390}],"formulas":[{"title":"Inverse-distance weights","expression":"wi ∝ 1 / diᵖ; normalize so Σwi = 1","variables":"di: distance to sample i; p: positive power. Handle an exact sample location separately.","spoken":"Inverse distance weighting gives nearby observations more influence, then normalizes all weights to sum to one."}],"workedExamples":[{"problem":"A semivariogram with nugget 0.2, sill 1.0 and range 800 m implies that beyond 800 m the expected dissimilarity is about ?.","given":"A semivariogram with nugget 0.2, sill 1.0 and range 800 m implies that beyond 800 m the expected dissimilarity is about __________.","formula":"wi ∝ 1 / diᵖ; normalize so Σwi = 1","calculation":"Once separation exceeds the 800 m range, the bounded model approaches its sill of 1.0. The nugget 0.2 concerns near-zero separation, not long-distance dissimilarity.","answer":"1.0"}],"examTips":["Interpret nugget, sill and range and explain interpolation assumptions."],"commonMistakes":["Kriging's optimality is conditional on its model assumptions; it is not automatically best for every dataset."],"quickRecap":["Interpret nugget, sill and range and explain interpolation assumptions.","Interpolation predicts values inside the sampled spatial domain using nearby observations and a model.","When a raster is moved, rotated or resized, its new cells rarely coincide with original centres.","A semivariogram summarizes half the expected squared difference between values separated by a lag."],"comparison":[],"relatedQuestionIds":[380,381,382,383,384,385,386,387,388,389,390,398,547],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"8.5","page":106,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0806","title":"Open GIS","introduction":"Open GIS combines accessible software with interoperable data and services. A desktop client, publishing server and style specification have distinct roles in the same workflow.","objective":"Explain QGIS, GeoServer, service interfaces and layer styling.","concepts":[{"heading":"QGIS is an example of an open-source desktop GIS","body":"QGIS is a desktop application for viewing, editing and analysing geospatial data. Open source concerns its software licence, not a guarantee that every dataset used with it is freely licensed.","sourceQuestionId":391},{"heading":"GeoServer is used primarily to publish spatial data as OGC web services","body":"GeoServer publishes geospatial layers through web-service interfaces such as WMS and WFS. It plays a server role rather than replacing every desktop analysis workflow.","sourceQuestionId":392},{"heading":"SLD (Styled Layer Descriptor) is an OGC standard that describes symbolization/rendering of a layer","body":"SLD defines how spatial features should be portrayed, such as colours, line widths and rules. It styles data but does not change the underlying feature geometry.","sourceQuestionId":393},{"heading":"Distinguishing the alternatives","body":"A proprietary hardware dongle is not a required element of an open-source GIS architecture. The defining components concern software, data and interoperable services, not a mandatory vendor lock.","sourceQuestionId":400}],"formulas":[],"workedExamples":[],"examTips":["Explain QGIS, GeoServer, service interfaces and layer styling."],"commonMistakes":["Open-source software does not make every dataset you load into it openly licensed."],"quickRecap":["Explain QGIS, GeoServer, service interfaces and layer styling.","QGIS is a desktop application for viewing, editing and analysing geospatial data.","GeoServer publishes geospatial layers through web-service interfaces such as WMS and WFS.","SLD defines how spatial features should be portrayed, such as colours, line widths and rules."],"comparison":[],"relatedQuestionIds":[391,392,393,400],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"8.6","page":108,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}}]},{"moduleId":9,"code":"AGeE09","title":"Engineering Survey","overview":"Apply survey control to routes, water, tunnels, curves, setting out and quantities. Keep design formulas separate from contractual standards.","learningObjectives":["Distinguish preliminary, setting-out and as-built surveys.","Compute sounding depth and discharge and identify hydropower components.","Explain shaft plumbing, gyro orientation and breakthrough error.","Compute tangent, chord, arc length and transition shift.","Explain polar stakeout and the difference between a design location and a checked site mark.","Apply end-area and prismoidal formulas and read cut/fill trends."],"sections":[{"code":"AGeE0901","title":"Engineering Survey Fundamentals","introduction":"Engineering surveying connects planning, design, construction and verification. Preliminary surveys compare options, setting out transfers design to the site, and as-built surveys measure the finished work.","objective":"Distinguish preliminary, setting-out and as-built surveys.","concepts":[{"heading":"The first stage of an engineering survey, used to compare route or site options, is the preliminary (reconnaissance) survey","body":"Reconnaissance and preliminary surveys explore alternatives and constraints before detailed design measurements. They establish where and how to investigate further, rather than recording completed construction.","sourceQuestionId":401},{"heading":"Transfer of a design to the ground by marking alignments and levels is called setting out (stakeout)","body":"Setting out translates design coordinates, alignments and levels into physical site marks. An as-built survey performs the reverse comparison by measuring what was constructed.","sourceQuestionId":402},{"heading":"An as-built survey records the actual constructed geometry","body":"An as-built survey records actual completed positions and dimensions. Comparing them with design identifies deviations; copying design coordinates does not constitute an as-built survey.","sourceQuestionId":403}],"formulas":[],"workedExamples":[],"examTips":["Distinguish preliminary, setting-out and as-built surveys."],"commonMistakes":["Copying design coordinates into a final drawing is not an as-built survey."],"quickRecap":["Distinguish preliminary, setting-out and as-built surveys.","Reconnaissance and preliminary surveys explore alternatives and constraints before detailed design measurements.","Setting out translates design coordinates, alignments and levels into physical site marks.","An as-built survey records actual completed positions and dimensions."],"comparison":[],"relatedQuestionIds":[401,402,403,549,554,594],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"9.1","page":111,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0902","title":"Hydrographic, Hydropower and Irrigation Survey","introduction":"Water projects require depth, water level, flow and structure geometry. Soundings use acoustic travel time; discharge combines cross-section and velocity; hydropower layouts connect intake, conveyance and return flow.","objective":"Compute sounding depth and discharge and identify hydropower components.","concepts":[{"heading":"An echo sounder computes depth from two-way travel time of an acoustic pulse","body":"An echo sounder sends a sound pulse and measures its return time from the bed. Depth calculation must account for two-way travel and the instrument's depth below the reference water surface.","sourceQuestionId":404},{"heading":"The echo-sounder formula is d = vt/2, where v is sound velocity and t is two-way travel time","body":"The pulse travels down and back, so the total path vt is twice the transducer-to-bed distance. Dividing by two gives d = vt/2.","sourceQuestionId":405},{"heading":"Sound velocity in water is approximately 1500 m/s","body":"About 1500 m/s is a useful water sound-speed approximation. Temperature, salinity and pressure change the actual value, so hydrographic work needs appropriate calibration or profiles.","sourceQuestionId":406},{"heading":"Discharge in a river is computed as A × V","body":"Discharge is flow area times mean velocity: Q = A V. More generally, integrate velocity across the section when it varies spatially.","sourceQuestionId":408},{"heading":"With a current meter, a common single-point mean-velocity observation is made at a depth of 0.6 d","body":"A measurement at 0.6 of total depth below the surface approximates mean velocity in a vertical under typical conditions. It is not 0.6 depth above the riverbed.","sourceQuestionId":410},{"heading":"The two-point current-meter method averages velocities at 0.2 d and 0.8 d","body":"The average of velocities at 0.2d and 0.8d below the surface approximates the vertical mean. Multiple verticals are still needed to represent the whole cross-section.","sourceQuestionId":411},{"heading":"A stage–discharge rating curve relates gauge height (stage) to discharge","body":"A rating curve empirically links observed water level with discharge at a gauging station. Channel changes can alter this relationship, so it requires calibration and maintenance.","sourceQuestionId":412},{"heading":"The pressure conduit that delivers water to a hydropower turbine is the penstock","body":"A penstock conveys water under pressure to the turbine. The tailrace carries water away after energy extraction, so the two occupy different parts of the scheme.","sourceQuestionId":413},{"heading":"Water leaving a hydropower powerhouse is returned to the river through the tailrace","body":"The tailrace returns water from the turbine/powerhouse to the downstream channel. It is downstream of generation, unlike the intake, headrace and penstock.","sourceQuestionId":414},{"heading":"A weir is a low-head diversion or overflow structure","body":"A weir is generally a relatively low barrier used to raise, divert or measure flow. It differs from a high storage dam even though both obstruct a channel.","sourceQuestionId":449},{"heading":"Lead line and sounding pole are traditional instruments for measuring water depth","body":"A lead line or sounding pole directly measures water depth at sampled positions. Echo sounding measures the same quantity indirectly from acoustic travel time.","sourceQuestionId":454}],"formulas":[{"title":"Echo-sounder range","expression":"d = v × t / 2","variables":"v: sound speed in water; t: round-trip time. Add datum and draft corrections separately.","spoken":"Depth below the transducer equals sound speed times two-way travel time divided by two."}],"workedExamples":[{"problem":"An echo sounder records a two-way travel time of 0.12 s. Taking v = 1500 m/s, the water depth is ?.","given":"An echo sounder records a two-way travel time of 0.12 s. Taking v = 1500 m/s, the water depth ","formula":"d = v × t / 2","calculation":"Depth below the transducer = 1500 × 0.12/2 = 90 m. Draft, water-level and other corrections are needed to reference the sounding to a survey datum.","answer":"90 m"},{"problem":"A river cross-section of area 84 m² with mean velocity 1.6 m/s has a discharge of ?.","given":"A river cross-section of area 84 m² with mean velocity 1.6 m/s has a discharge of __________.","formula":"d = v × t / 2","calculation":"Q = 84 m² × 1.6 m/s = 134.4 m³/s. Area multiplied by velocity produces volume per unit time.","answer":"134.4 m³/s"}],"examTips":["Compute sounding depth and discharge and identify hydropower components."],"commonMistakes":["Echo-sounder range below the transducer needs draft and water-level corrections to reach a datum depth."],"quickRecap":["Compute sounding depth and discharge and identify hydropower components.","An echo sounder sends a sound pulse and measures its return time from the bed.","The pulse travels down and back, so the total path vt is twice the transducer-to-bed distance.","About 1500 m/s is a useful water sound-speed approximation."],"comparison":[],"relatedQuestionIds":[404,405,406,407,408,409,410,411,412,413,414,449,454,550,553,561,562,592],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"9.2","page":111,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0903","title":"Underground and Geophysical Surveying","introduction":"Underground surveys carry surface position and direction into places with limited sight and no GNSS. Redundant control and deformation monitoring protect alignment and track ground response.","objective":"Explain shaft plumbing, gyro orientation and breakthrough error.","concepts":[{"heading":"Surface-to-underground orientation through a vertical shaft is commonly achieved by shaft plumbing (two plumb wires)","body":"Two suspended plumb wires transfer a surface alignment through a shaft. Their positions below allow the underground network to inherit a reference direction.","sourceQuestionId":415},{"heading":"A gyro-theodolite is used underground to determine true azimuth","body":"A gyro-theodolite determines a north-referenced azimuth without needing magnetic north or a view of the stars. This is valuable in underground control networks.","sourceQuestionId":416},{"heading":"Breakthrough error in tunnelling is the misclosure when two excavation drives meet","body":"When excavation advances from opposite ends, the drives may meet with horizontal or vertical offset. That misclosure is breakthrough error and reflects accumulated control and setting-out uncertainty.","sourceQuestionId":417},{"heading":"Electrical Resistivity Tomography (ERT) images the subsurface by measuring apparent resistivity","body":"ERT injects current and measures potential differences to infer apparent resistivity. Inversion interprets subsurface electrical variation; it does not directly photograph geological layers.","sourceQuestionId":418},{"heading":"Tunnel invert refers to the floor of the tunnel section","body":"The invert is the lowest internal portion or floor of a tunnel. The crown is the top, so these terms identify opposite parts of the section.","sourceQuestionId":448},{"heading":"Convergence monitoring in tunnels measures changes in the cross-section to detect deformation","body":"Convergence observations track distances or displacements across the tunnel section over time. Changes indicate deformation rather than the absolute length of the tunnel route.","sourceQuestionId":453}],"formulas":[],"workedExamples":[],"examTips":["Explain shaft plumbing, gyro orientation and breakthrough error."],"commonMistakes":["A tunnel's crown is the top; its invert is the floor."],"quickRecap":["Explain shaft plumbing, gyro orientation and breakthrough error.","Two suspended plumb wires transfer a surface alignment through a shaft.","A gyro-theodolite determines a north-referenced azimuth without needing magnetic north or a view of the stars.","When excavation advances from opposite ends, the drives may meet with horizontal or vertical offset."],"comparison":[],"relatedQuestionIds":[415,416,417,418,448,453,551],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"9.3","page":112,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0904","title":"Route Surveying","introduction":"Route geometry joins tangents with horizontal and vertical curves. Learn the simple circular geometry first, then use transitions and grade changes to understand comfortable, controlled movement.","objective":"Compute tangent, chord, arc length and transition shift.","concepts":[{"heading":"Horizontal route curves include simple circular, compound, reverse and transition (spiral) curves","body":"A transition curve gradually changes curvature between a straight and a circular arc. This avoids an abrupt change in lateral acceleration at the join.","sourceQuestionId":419},{"heading":"For a simple circular curve, the tangent length is R tan(Δ/2)","body":"The radius to the tangent point is perpendicular to the tangent. The resulting right triangle gives tangent length T = R tan(Δ/2).","sourceQuestionId":420},{"heading":"The length of a circular curve is π R Δ° / 180°","body":"Arc length equals radius times central angle in radians. Converting Δ degrees to radians gives L = πRΔ/180.","sourceQuestionId":421},{"heading":"The long chord of a circular curve is 2 R sin(Δ/2)","body":"The long chord joins the two tangent points. Splitting the isosceles radius triangle in half gives LC = 2R sin(Δ/2).","sourceQuestionId":422},{"heading":"The external distance E of a circular curve is R (sec(Δ/2) − 1)","body":"The intersection-to-centre distance is R sec(Δ/2). Subtracting R gives the external distance E = R[sec(Δ/2) − 1].","sourceQuestionId":423},{"heading":"The mid-ordinate M of a circular curve is R (1 − cos(Δ/2))","body":"The chord-to-arc separation at the midpoint is the radius minus its projection: M = R − R cos(Δ/2). This differs from the external distance measured from the tangent intersection.","sourceQuestionId":424},{"heading":"The degree of curve for a 30 m arc is given by D = 1718.87 / R","body":"For a 30 m arc, D radians = 30/R. Converting to degrees gives D = 30 × 180/(πR) ≈ 1718.87/R.","sourceQuestionId":427},{"heading":"Rankine's deflection angle for a chord c, expressed in minutes, is δ = 1718.87 c / R","body":"The small-chord tangential deflection is approximately c/(2R) radians. Multiplying by 180 × 60/π gives δ ≈ 1718.87c/R arcminutes.","sourceQuestionId":429},{"heading":"The approximate offset from the tangent at a distance x is y = x² / (2R)","body":"The exact circular offset is R − √(R² − x²). For x much smaller than R, expansion gives y ≈ x²/(2R).","sourceQuestionId":431},{"heading":"The shift of a transition curve is S = L² / 24R","body":"For the usual spiral approximation, inserting a transition requires a circular-arc shift S ≈ L²/(24R). This is not the curve's tangent length or total lateral displacement.","sourceQuestionId":432},{"heading":"Superelevation and side friction on a horizontal curve are related by e + f = V² / (127 R), with V in km/h","body":"Balancing lateral acceleration with road banking and friction gives e + f = V²/(127R) for V in km/h and R in metres. The coefficient changes with units.","sourceQuestionId":434},{"heading":"Vertical curves used in route design are generally parabolic","body":"A parabola provides a constant rate of grade change along the horizontal distance. This makes it convenient for joining two road grades smoothly.","sourceQuestionId":436},{"heading":"The rate of change of grade on a vertical curve is r = (g₂ − g₁)/L","body":"The total grade change g2 − g1 is spread over length L, so r = (g2 − g1)/L. Use grades consistently as decimals or percentages.","sourceQuestionId":437},{"heading":"Compound curves consist of two or more circular arcs of different radius turning in the same direction","body":"A compound curve joins circular arcs of different radii turning the same way. A single-radius arc is simple, while opposite turning directions form a reverse curve.","sourceQuestionId":450},{"heading":"A reverse curve consists of two circular arcs turning in opposite directions","body":"Reverse curves contain arcs curving in opposite directions. Their join needs careful design for transition and superelevation rather than an abrupt uncontrolled reversal.","sourceQuestionId":451},{"heading":"The length of a transition curve may be taken as L = V³ / (C R)","body":"The dimensional relationship is L = v³/(CR) when v is in m/s and C is permissible rate of change of lateral acceleration. A conversion factor is needed if speed is given in km/h.","sourceQuestionId":452},{"heading":"Distinguishing the alternatives","body":"Geoid undulation concerns the separation of height-reference surfaces. Circular-curve elements instead include radius, tangent, arc length, chord, external distance and mid-ordinate.","sourceQuestionId":455}],"formulas":[{"title":"Circular curve","expression":"T = R tan(Δ/2); L = πRΔ / 180","variables":"R: radius; Δ: central angle in degrees; T: tangent length; L: arc length.","spoken":"Tangent length equals radius times tangent of half the angle. Arc length equals pi times radius times the angle in degrees divided by one hundred eighty."}],"workedExamples":[{"problem":"Two tangents intersect at Δ = 48°. For R = 250 m, the tangent length is approximately ?.","given":"Two tangents intersect at Δ = 48°. For R = 250 m, the tangent length ","formula":"T = R tan(Δ/2); L = πRΔ / 180","calculation":"T = 250 tan(48°/2) = 250 tan 24° ≈ 111.31 m. Use half the intersection angle, not the full 48°.","answer":"111.3 m"},{"problem":"For a circular curve with R = 250 m and Δ = 48°, the curve length is approximately ?.","given":"For a circular curve with R = 250 m and Δ = 48°, the curve length ","formula":"T = R tan(Δ/2); L = πRΔ / 180","calculation":"L = π × 250 × 48/180 ≈ 209.44 m. This is arc length, which is slightly longer than the long chord.","answer":"209.4 m"}],"examTips":["Compute tangent, chord, arc length and transition shift."],"commonMistakes":["Keep degree and radian formulas separate, and check speed units before using transition or banking equations."],"quickRecap":["Compute tangent, chord, arc length and transition shift.","A transition curve gradually changes curvature between a straight and a circular arc.","The radius to the tangent point is perpendicular to the tangent.","Arc length equals radius times central angle in radians."],"comparison":[],"relatedQuestionIds":[419,420,421,422,423,424,425,426,427,428,429,430,431,432,433,434,435,436,437,450,451,452,455,552,591,605],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"9.4","page":113,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0905","title":"Basic Civil Engineering and Stakeout","introduction":"Construction needs stable control, clear dimensions and independent setting-out checks. Basic structural terminology helps the surveyor communicate which point, face or level a drawing requires.","objective":"Explain polar stakeout and the difference between a design location and a checked site mark.","concepts":[{"heading":"Control before stakeout","body":"Verify the station, backsight, reference system, instrument setup and design revision. An independent check from another control point is stronger than repeating the same unchecked setup."},{"heading":"Communicating construction geometry","body":"Identify the exact design feature: centreline, edge, face, formation level or offset mark. Record marks and checks so the contractor can distinguish permanent design points from temporary survey offsets."},{"heading":"Horizontal setting out from a control point using bearing and distance is the polar method","body":"The polar method sets a point using a direction and distance from known control. A total station commonly implements this directly from design coordinates.","sourceQuestionId":447}],"formulas":[],"workedExamples":[],"examTips":["Explain polar stakeout and the difference between a design location and a checked site mark."],"commonMistakes":["A correctly calculated coordinate can still be set out incorrectly from the wrong station or backsight."],"quickRecap":["Explain polar stakeout and the difference between a design location and a checked site mark.","Verify the station, backsight, reference system, instrument setup and design revision.","Identify the exact design feature: centreline, edge, face, formation level or offset mark.","The polar method sets a point using a direction and distance from known control."],"comparison":[],"relatedQuestionIds":[447],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"9.5","page":115,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0906","title":"Quantity Survey","introduction":"Quantity surveying converts measured sections into areas, volumes and earthwork movement. Select the integration rule from spacing and shape, then use a mass-haul diagram to understand balance and transport.","objective":"Apply end-area and prismoidal formulas and read cut/fill trends.","concepts":[{"heading":"Simpson's 1/3 rule for area requires an odd number of offsets, including the end offsets","body":"Simpson's one-third rule groups intervals in pairs, requiring an even number of intervals and therefore an odd number of offsets. Equal spacing is also required for the simple formula.","sourceQuestionId":438},{"heading":"The mean-end-area volume formula is V = (L/2)(A₁ + A₂)","body":"The mean-end-area method treats the section area as varying linearly over length L. Volume is therefore average end area times length: L(A1 + A2)/2.","sourceQuestionId":439},{"heading":"The prismoidal formula is V = (L/6)(A₁ + 4Am + A₂)","body":"The prismoidal rule includes the mid-section with weight four: V = L(A1 + 4Am + A2)/6. The midpoint area is not generally just the average of the end areas.","sourceQuestionId":440},{"heading":"On a mass-haul diagram, a rising curve indicates cut (excavation)","body":"With excavation taken as positive cumulative volume, a rising mass-haul curve indicates cut. Always check the adopted sign convention and bulking/shrinkage treatment.","sourceQuestionId":443},{"heading":"A falling curve on a mass-haul diagram indicates fill","body":"Fill consumes the accumulated excavation volume, so the mass-haul curve falls under the usual sign convention. Its slope reflects net earthwork per unit distance.","sourceQuestionId":444},{"heading":"A balance point on a mass-haul diagram occurs where the curve crosses the baseline","body":"Returning to the chosen baseline indicates cumulative cut and fill balance from that reference. More generally, two points with the same mass ordinate bound a balanced section.","sourceQuestionId":445},{"heading":"Overhaul is haulage beyond the freehaul distance","body":"Freehaul is the included transport distance in the adopted payment arrangement. Haul beyond it is overhaul; actual measurement and payment depend on contract definitions.","sourceQuestionId":446}],"formulas":[{"title":"Prismoidal volume","expression":"V = L(A1 + 4Am + A2) / 6","variables":"L: separation; A1/A2: end areas; Am: actual midpoint area.","spoken":"Volume equals length divided by six, times the first area plus four times the midpoint area plus the last area."}],"workedExamples":[{"problem":"Cross-section areas of 20, 32, 40, 28 and 16 m² at 50 m spacing give a trapezoidal volume of ?.","given":"Cross-section areas of 20, 32, 40, 28 and 16 m² at 50 m spacing give a trapezoidal volume of __________.","formula":"V = L(A1 + 4Am + A2) / 6","calculation":"V = 50[(20 + 16)/2 + 32 + 40 + 28] = 50 × 118 = 5900 m³. The end sections get half weight.","answer":"5900 m³"},{"problem":"For the same five cross-sections at 50 m spacing, the prismoidal (Simpson) volume is approximately ?.","given":"For the same five cross-sections at 50 m spacing, the prismoidal (Simpson) volume ","formula":"V = L(A1 + 4Am + A2) / 6","calculation":"V = (50/3)[20 + 16 + 4(32 + 28) + 2(40)] = 5933.33 m³. Simpson weights alternate 4 and 2 between the end sections.","answer":"5933 m³"}],"examTips":["Apply end-area and prismoidal formulas and read cut/fill trends."],"commonMistakes":["Simpson's rule needs equal spacing and an even number of intervals."],"quickRecap":["Apply end-area and prismoidal formulas and read cut/fill trends.","Simpson's one-third rule groups intervals in pairs, requiring an even number of intervals and therefore an odd number of offsets.","The mean-end-area method treats the section area as varying linearly over length L.","The prismoidal rule includes the mid-section with weight four: V = L(A1 + 4Am + A2)/6."],"comparison":[],"relatedQuestionIds":[438,439,440,441,442,443,444,445,446,593],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"9.6","page":115,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}}]},{"moduleId":10,"code":"AALL10","title":"Project Planning, Design and Implementation","overview":"Integrate drawings, engineering economics, scheduling, risk, procurement, ethics and regulation into a professional project workflow.","learningObjectives":["Distinguish orthographic conventions and isometric drawing from projection.","Calculate compound value, depreciation and NPV and interpret IRR.","Calculate float and PERT estimates and distinguish levelling from smoothing.","Explain risk responses and the sequence from tender to contract.","Apply public-safety-first ethics and distinguish professional association from regulator.","Explain why registration, recognition and professional conduct are regulated."],"sections":[{"code":"AALL1001","title":"Engineering Drawings","introduction":"Engineering drawings communicate geometry through standardized views, lines and dimensions. Always identify the projection convention, units and scale before interpreting an object's size or shape.","objective":"Distinguish orthographic conventions and isometric drawing from projection.","concepts":[{"heading":"The ISO A0 drawing sheet measures approximately 841 × 1189 mm","body":"A0 has nominal area 1 m² and sides in the ratio √2, giving rounded dimensions 841 × 1189 mm. Successive A sizes are produced by halving the longer dimension.","sourceQuestionId":456},{"heading":"An A4 sheet measures 210 × 297 mm","body":"A4 is 210 × 297 mm in the ISO A-series. Rotate the sheet for landscape orientation; its standardized dimensions do not change.","sourceQuestionId":457},{"heading":"Dimensions on an engineering drawing record the true size, not the drawn size","body":"A dimension states the intended real object size regardless of the drawing's plotted scale. Measuring an enlarged or reduced print cannot replace the written dimension.","sourceQuestionId":458},{"heading":"A hidden edge is conventionally drawn as a dashed line","body":"Dashed lines conventionally indicate edges hidden behind visible surfaces. Continuous lines represent visible outlines, while centre lines use a different chain pattern.","sourceQuestionId":459},{"heading":"A centre line is conventionally a long–short dashed line","body":"A centre line uses alternating long and short marks to identify axes or symmetry. It should remain distinguishable from hidden-edge dashed lines.","sourceQuestionId":460},{"heading":"Orthographic projection uses projectors that are perpendicular to the projection plane","body":"Orthographic projection uses parallel projectors perpendicular to the drawing plane. Perspective projectors converge to a viewpoint instead.","sourceQuestionId":461},{"heading":"Isometric axes are equally inclined and appear at 120° to each other","body":"The three equally inclined isometric axes project at 120° to one another. The familiar two receding axes are each drawn at 30° to a horizontal baseline.","sourceQuestionId":462},{"heading":"In true isometric projection, axial lengths are foreshortened by approximately 0.816","body":"True isometric projection shortens axial lengths by √(2/3) ≈ 0.816. This foreshortening differs from an isometric drawing using full dimensions along the axes.","sourceQuestionId":463},{"heading":"An isometric view (drawing) plots true lengths along the axes, without foreshortening","body":"An isometric drawing usually uses actual lengths along its three axes for convenience. A true isometric projection applies the 0.816 scale factor instead.","sourceQuestionId":464},{"heading":"Section lining (hatching) is commonly drawn at 45°","body":"Section hatching often uses thin parallel lines at 45° to distinguish cut material. The angle may be adjusted to avoid confusion with an object's dominant outline.","sourceQuestionId":465},{"heading":"First-angle and third-angle are the two standard conventions of orthographic projection","body":"First- and third-angle conventions arrange orthographic views differently around the main view. The projection symbol tells the reader which arrangement is being used.","sourceQuestionId":497}],"formulas":[],"workedExamples":[],"examTips":["Distinguish orthographic conventions and isometric drawing from projection."],"commonMistakes":["Written dimensions specify real size, even when a print has been resized."],"quickRecap":["Distinguish orthographic conventions and isometric drawing from projection.","A0 has nominal area 1 m² and sides in the ratio √2, giving rounded dimensions 841 × 1189 mm.","A4 is 210 × 297 mm in the ISO A-series.","A dimension states the intended real object size regardless of the drawing's plotted scale."],"comparison":[],"relatedQuestionIds":[456,457,458,459,460,461,462,463,464,465,497,555,558,595],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"10.1","page":121,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AALL1002","title":"Engineering Economics","introduction":"Engineering economics compares cash flows at a common date. Compounding moves money forward, discounting moves it back, and NPV evaluates whether returns meet a stated hurdle rate.","objective":"Calculate compound value, depreciation and NPV and interpret IRR.","concepts":[{"heading":"The single-payment compound-amount relation is expressed by F = P(1 + i)n","body":"Compound interest multiplies the balance by 1 + i each period. After n periods, F = P(1 + i)ⁿ, with rate and number of periods expressed consistently.","sourceQuestionId":466},{"heading":"The present worth of a future amount is P = F / (1 + i)n","body":"Discounting reverses compounding: divide the future amount by (1 + i)ⁿ. This expresses a future cash flow in equivalent present-time value.","sourceQuestionId":468},{"heading":"Straight-line annual depreciation is D = (P − S) / n","body":"Straight-line depreciation spreads depreciable cost P − S equally across n years. Salvage value is retained rather than depreciated away.","sourceQuestionId":469},{"heading":"NPV is the sum of discounted cash flows. A project is acceptable if NPV is greater than zero","body":"Positive NPV means discounted benefits exceed discounted costs at the chosen required return. It is a financial appraisal result under the stated assumptions, not a guarantee of project success.","sourceQuestionId":471},{"heading":"IRR is the discount rate at which NPV equals zero","body":"IRR is a rate that sets the discounted net cash-flow sum to zero. Unusual cash-flow patterns may produce multiple IRRs or none, so interpretation needs care.","sourceQuestionId":472},{"heading":"A project is acceptable by the IRR criterion if IRR > MARR","body":"For conventional cash flows, an IRR above the required MARR passes this screening criterion. Mutually exclusive projects and nonconventional flows may require NPV-based comparison instead.","sourceQuestionId":473},{"heading":"MARR stands for Minimum Acceptable Rate of Return","body":"MARR is the minimum return required to justify investment under the decision assumptions. It acts as a hurdle or discount rate, not the project's automatically achieved return.","sourceQuestionId":474},{"heading":"Nepal's value-added tax (VAT) rate, as given in the study notes, is 13%","body":"The question explicitly tests the supplied notes' VAT figure of 13%. It is not current tax guidance: rates, exemptions and rules must be checked against authoritative current provisions.","sourceQuestionId":475}],"formulas":[{"title":"Time value of money","expression":"F = P(1 + i)ⁿ; P = F / (1 + i)ⁿ","variables":"P/F: present/future value; i: rate per period; n: periods.","spoken":"Future value equals present value times one plus the interest rate raised to the number of periods."}],"workedExamples":[{"problem":"The future value of NPR 500 000 invested for 4 years at 8% compound interest is approximately ?.","given":"The future value of NPR 500 000 invested for 4 years at 8% compound interest ","formula":"F = P(1 + i)ⁿ; P = F / (1 + i)ⁿ","calculation":"F = 500 000 × 1.08⁴ = 680 244.48 NPR. Interest compounds on previous interest, so simple-interest multiplication gives a different result.","answer":"NPR 680 244"},{"problem":"A machine costs NPR 800 000 and has a salvage value of NPR 80 000 after 8 years. Annual straight-line depreciation is ?.","given":"A machine costs NPR 800 000 and has a salvage value of NPR 80 000 after 8 years. Annual straight-line depreciation ","formula":"F = P(1 + i)ⁿ; P = F / (1 + i)ⁿ","calculation":"Annual depreciation = (800 000 − 80 000)/8 = 90 000 NPR. Dividing the full cost by eight would incorrectly ignore salvage value.","answer":"NPR 90 000"}],"examTips":["Calculate compound value, depreciation and NPV and interpret IRR."],"commonMistakes":["Match interest rate and period length; monthly and annual rates cannot be substituted without conversion."],"quickRecap":["Calculate compound value, depreciation and NPV and interpret IRR.","Compound interest multiplies the balance by 1 + i each period.","Discounting reverses compounding: divide the future amount by (1 + i)ⁿ.","Straight-line depreciation spreads depreciable cost P − S equally across n years."],"comparison":[],"relatedQuestionIds":[466,467,468,469,470,471,472,473,474,475,498,556],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"10.2","page":122,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AALL1003","title":"Project Planning and Scheduling","introduction":"Scheduling connects activities through dependencies and available resources. CPM identifies controlling paths; PERT adds a simple uncertainty model; levelling and smoothing address resource demand differently.","objective":"Calculate float and PERT estimates and distinguish levelling from smoothing.","concepts":[{"heading":"A bar (Gantt) chart shows activities against time but does not show logical dependencies","body":"A basic bar chart shows when activities occur but does not inherently encode dependencies. Modern Gantt software can add dependency links, so the statement concerns the simple chart.","sourceQuestionId":476},{"heading":"In CPM, float (slack) is equal to LS − ES","body":"Total float = latest start − earliest start, equivalently latest finish − earliest finish. It measures allowable delay without extending the adopted project finish.","sourceQuestionId":477},{"heading":"The critical path is the longest-duration path through the network and has zero float","body":"The longest-duration dependency path determines the earliest project finish. Under the usual unconstrained CPM setup it has zero total float; it is not the path with the most activities.","sourceQuestionId":478},{"heading":"PERT expected activity time is te = (a + 4m + b)/6","body":"PERT gives the most likely duration four times the weight of the optimistic and pessimistic values: te = (a + 4m + b)/6.","sourceQuestionId":479},{"heading":"PERT activity variance is [(b − a)/6]²","body":"PERT approximates standard deviation as (b − a)/6. Squaring gives variance, whose units are time squared rather than time.","sourceQuestionId":480},{"heading":"Resource levelling adjusts the schedule so that resource demand does not exceed availability and may extend the project duration","body":"Resource levelling respects resource availability even if activities must be delayed beyond their original float. It can therefore extend the completion date.","sourceQuestionId":483},{"heading":"Resource smoothing evens resource peaks without changing the project duration","body":"Resource smoothing moves activities within available float to reduce peaks while retaining the planned finish. It may not remove every overload when float is insufficient.","sourceQuestionId":484},{"heading":"WBS in project planning stands for Work Breakdown Structure","body":"A WBS decomposes project scope into manageable deliverables and work packages. It organizes what must be done before detailed scheduling assigns when it happens.","sourceQuestionId":495},{"heading":"The project life cycle generally follows: conception → feasibility/design → implementation → operation → closure/evaluation","body":"Closure and evaluation review outcomes, hand over completed work and capture lessons. Actual project lifecycles may organize operation separately, so the sequence is a general study model.","sourceQuestionId":496},{"heading":"CPM uses deterministic (single) activity durations, whereas PERT uses probabilistic three-time estimates","body":"Classical CPM uses a single estimated duration for each activity. PERT uses optimistic, most likely and pessimistic estimates to model timing uncertainty approximately.","sourceQuestionId":499}],"formulas":[{"title":"PERT expected duration","expression":"te = (a + 4m + b) / 6","variables":"a: optimistic; m: most likely; b: pessimistic duration.","spoken":"Expected duration equals optimistic plus four times most likely plus pessimistic, all divided by six."}],"workedExamples":[{"problem":"A PERT activity has a = 4, m = 7 and b = 12 days. The expected time te is ?.","given":"A PERT activity has a = 4, m = 7 and b = 12 days. The expected time te ","formula":"te = (a + 4m + b) / 6","calculation":"te = (4 + 4 × 7 + 12)/6 = 44/6 = 7.333 days. The most likely estimate 7 receives weight four.","answer":"7.33 days"},{"problem":"For a PERT activity with a = 4 and b = 12 days, the variance is ?.","given":"For a PERT activity with a = 4 and b = 12 days, the variance ","formula":"te = (a + 4m + b) / 6","calculation":"Variance = [(12 − 4)/6]² = (8/6)² = 1.7778 days². The standard deviation itself is 1.333 days.","answer":"1.78"}],"examTips":["Calculate float and PERT estimates and distinguish levelling from smoothing."],"commonMistakes":["The critical path is longest in duration, not necessarily the one with most activities."],"quickRecap":["Calculate float and PERT estimates and distinguish levelling from smoothing.","A basic bar chart shows when activities occur but does not inherently encode dependencies.","Total float = latest start − earliest start, equivalently latest finish − earliest finish.","The longest-duration dependency path determines the earliest project finish."],"comparison":[["Levelling","Respects resource limits; can extend completion."],["Smoothing","Uses available float; keeps the planned finish."]],"relatedQuestionIds":[476,477,478,479,480,481,482,483,484,494,495,496,499,557],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"10.3","page":123,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AALL1004","title":"Project Management","introduction":"Project management coordinates scope, resources, risk, finance and contracts. Risk responses allocate action and responsibility, while procurement and contract records make obligations clear.","objective":"Explain risk responses and the sequence from tender to contract.","concepts":[{"heading":"Risk responses commonly include avoidance, mitigation, transfer and acceptance","body":"Acceptance retains a risk consciously, often with contingency planning. Avoidance removes exposure, mitigation reduces it, and transfer allocates defined consequences elsewhere.","sourceQuestionId":485},{"heading":"Transfer of risk is commonly achieved by insurance or contractual allocation","body":"Insurance or contract terms can shift specified financial consequences to another party. They do not automatically remove the underlying hazard or all professional responsibilities.","sourceQuestionId":486},{"heading":"The usual tender process includes advertisement, bid submission, evaluation, award and contract signing","body":"After evaluation and award, a formal contract records scope, price, obligations and conditions. Actual procurement steps depend on the applicable rules and contract type.","sourceQuestionId":487}],"formulas":[],"workedExamples":[],"examTips":["Explain risk responses and the sequence from tender to contract."],"commonMistakes":["Risk transfer allocates defined consequences; it does not make the physical hazard disappear."],"quickRecap":["Explain risk responses and the sequence from tender to contract.","Acceptance retains a risk consciously, often with contingency planning.","Insurance or contract terms can shift specified financial consequences to another party.","After evaluation and award, a formal contract records scope, price, obligations and conditions."],"comparison":[],"relatedQuestionIds":[485,486,487],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"10.4","page":124,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AALL1005","title":"Engineering Professional Practice","introduction":"Professional practice combines technical competence with honest communication and public responsibility. Survey work also requires safe field procedures, awareness of environmental effects and respect for affected people.","objective":"Apply public-safety-first ethics and distinguish professional association from regulator.","concepts":[{"heading":"The paramount ethical duty of an engineer is to hold public safety, health and welfare first","body":"Engineering decisions can affect people beyond the client. Protecting public safety, health and welfare therefore takes precedence over convenience, profit or instructions to conceal a hazard.","sourceQuestionId":488},{"heading":"The Nepal Engineers' Association (NEA) was established in 2019 BS / 1962 AD","body":"The supplied history gives NEA's establishment as 2019 BS/1962 AD. NEA is a professional association, which must be distinguished from the statutory council.","sourceQuestionId":489},{"heading":"NEA is a professional association, whereas NEC is a statutory regulatory body","body":"NEC exercises statutory regulatory functions under legislation. NEA represents and supports the profession as an association; membership and regulatory registration are not the same thing.","sourceQuestionId":492},{"heading":"Occupational health and safety (OHS) on survey sites requires hazard identification, PPE, training and compliance with labour/safety law","body":"Site safety combines identifying hazards, planning controls, training and suitable protective equipment with applicable requirements. PPE alone is not a complete safety system.","sourceQuestionId":493}],"formulas":[],"workedExamples":[],"examTips":["Apply public-safety-first ethics and distinguish professional association from regulator."],"commonMistakes":["Client pressure is not a reason to conceal uncertainty or certify work beyond your competence."],"quickRecap":["Apply public-safety-first ethics and distinguish professional association from regulator.","Engineering decisions can affect people beyond the client.","The supplied history gives NEA's establishment as 2019 BS/1962 AD.","NEC exercises statutory regulatory functions under legislation."],"comparison":[],"relatedQuestionIds":[488,489,492,493,559,597,598],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"10.5","page":125,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AALL1006","title":"Engineering Regulatory Body","introduction":"Engineering regulation establishes entry and conduct requirements to protect the public. The supplied syllabus names the NEC Act and council functions; current category-specific requirements need authoritative verification.","objective":"Explain why registration, recognition and professional conduct are regulated.","concepts":[{"heading":"Council and association","body":"The supplied notes distinguish the NEC regulatory role from the NEA professional-association role. Association membership and statutory registration serve different purposes."},{"heading":"Reading regulatory material","body":"Identify the official Act, applicable amendments and the particular registration category before using a requirement. The source question about professional registration is flagged because its wording conflates categories."},{"heading":"The Nepal Engineering Council (NEC) is the statutory regulator established by the NEC Act of 2055 BS (1999/2000 AD)","body":"The authoritative identifier tested here is the NEC Act, 2055 BS. Calendar conversions in the supplied notes are approximate; use the Act's official title and amended text for legal reference.","sourceQuestionId":490},{"heading":"Professional engineer registration with the NEC requires experience and passing the NEC licence examination","body":"This source item conflates general registration and professional-engineer categories. It is withheld from new scored tests until the category-specific requirements are checked against authoritative NEC rules.","sourceQuestionId":491},{"heading":"Distinguishing the alternatives","body":"The supplied materials identify engineer registration and licensing examinations among NEC's regulatory functions. The council is not a land-survey office or a general construction contractor.","sourceQuestionId":500}],"formulas":[],"workedExamples":[],"examTips":["Explain why registration, recognition and professional conduct are regulated."],"commonMistakes":["Do not treat general registration and professional-engineer categories as interchangeable."],"quickRecap":["Explain why registration, recognition and professional conduct are regulated.","The supplied notes distinguish the NEC regulatory role from the NEA     function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

    function questionStat(id){return progress.questions[id]||{attempts:0,correct:0,lastCorrect:null}}
    function overallStats(){const values=Object.values(progress.questions);const attempts=values.reduce((s,x)=>s+(x.attempts||0),0);const correct=values.reduce((s,x)=>s+(x.correct||0),0);return{attempted:values.filter(x=>x.attempts>0).length,attempts,correct,incorrect:attempts-correct,accuracy:pct(correct,attempts),tests:progress.history.length,bookmarks:progress.bookmarks.length}}
    function moduleStats(id){const ids=questionBank.filter(q=>q.moduleId===id).map(q=>q.id);let attempts=0,correct=0,attempted=0;ids.forEach(id=>{const s=questionStat(id);attempts+=s.attempts;correct+=s.correct;if(s.attempts)attempted++});return{attempts,correct,attempted,accuracy:pct(correct,attempts)}}

    function recordAttempt(qid,isCorrect){const s=questionStat(qid);progress.questions[qid]={attempts:s.attempts+1,correct:s.correct+(isCorrect?1:0),lastCorrect:isCorrect};if(isCorrect){if(progress.wrong[qid]){progress.wrong[qid].recoveries=(progress.wrong[qid].recoveries||0)+1;if(progress.wrong[qid].recoveries>=2)delete progress.wrong[qid]}}else{progress.wrong[qid]={misses:(progress.wrong[qid]?.misses||0)+1,recoveries:0}}}
    function strongestWeakest(){const rows=syllabus.map(m=>({m,...moduleStats(m.id)})).filter(x=>x.attempts);rows.sort((a,b)=>b.accuracy-a.accuracy);return{strong:rows[0]?.m.title||'—',weak:rows.at(-1)?.m.title||'—'}}

    function render(){if(appState.view==='session'&&appState.session)return renderSession();const map={dashboard:renderDashboard,study:renderStudy,practice:renderPractice,mock:renderMockIntro,bank:renderBank,progress:renderProgress,result:renderResult,review:renderReview};(map[appState.view]||renderDashboard)()}
    function renderDashboard(){const s=overallStats(),sw=strongestWeakest();const active=appState.session;app.innerHTML=`
      <section class="hero"><div class="hero-main"><p class="eyebrow">Study → Practice → Mock → Review</p><h1>${Object.keys(progress.studySections).length?'Continue where you left off.':'Start with the concepts, then test yourself.'}</h1><p>${Object.keys(progress.studySections).length?`${esc(progress.lastStudyCode)} · ${esc(allStudySections().find(x=>x.section.code===progress.lastStudyCode)?.section.title||'Study Guide')}`:'Work through the 60 syllabus lessons, practise each topic and use your results to guide the next revision.'}</p><div class="hero-actions"><button class="btn btn-primary" data-action="openStudyCode" data-code="${esc(progress.lastStudyCode||'AGeE0101')}">${Object.keys(progress.studySections).length?'Continue Studying':'Start Chapter 1'}</button><button class="btn btn-ghost" data-action="studyHome">Study by Chapter</button>${active?'<button class="btn btn-ghost" data-action="resume">Continue current test</button>':''}</div></div>

      <section class="stats-grid"><div class="stat-card"><span>Question bank</span><strong>${questionBank.length}</strong></div><div class="stat-card"><span>Unique attempted</span><strong>${s.attempted}</strong></div><div class="stat-card"><span>Tests completed</span><strong>${s.tests}</strong></div><div class="stat-card"><span>Bookmarked</span><strong>${s.bookmarks}</strong></div></section>

    function renderStudy(){const m=syllabus[appState.guide-1],g=guides[appState.guide-1],done=progress.studyCompleted.includes(m.id);progress.lastGuide=m.id;save();app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Chapter-by-chapter learning</p><h1>Study Guide</h1><p class="subhead">Read the core ideas, follow a worked example, listen aloud, then practise the chapter.</p></div><span class="pill">${progress.studyCompleted.length}/10 chapters reviewed</span></div><section class="study-grid"><nav class="card study-nav" aria-label="Study chapters">${syllabus.map(x=>`<button class="study-link ${x.id===m.id?'active':''}" data-action="guide" data-id="${x.id}"><b>${progress.studyCompleted.includes(x.id)?'✓':x.id}</b><span>${esc(x.title)}</span></button>`).join('')}</nav><article class="card study-content" id="studyArticle"><p class="eyebrow">Chapter ${m.id} · ${m.code}</p><h2>${esc(m.title)}</h2><p>${esc(g.focus)}</p><div class="study-actions"><button class="btn btn-primary" data-action="speakGuide">▶ Read this chapter aloud</button><button class="btn btn-secondary" data-action="stopSpeak">■ Stop audio</button><button class="btn btn-secondary" data-action="completeGuide">${done?'✓ Reviewed':'Mark chapter reviewed'}</button></div><h3>What to understand</h3><ul class="concept-list">${g.points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="worked"><p class="eyebrow">Formula & worked example</p><h3>${esc(g.formula)}</h3><p>${esc(g.example)}</p></div><h3>Six syllabus lessons</h3><div class="lesson-list">${m.sections.map((s,i)=>`<div class="lesson"><small>Lesson ${m.id}.${i+1} · ${s[0]}</small><strong>${esc(s[1])}</strong><div style="margin-top:8px"><button class="size-btn" data-action="startSection" data-code="${s[0]}" data-size="10">Practise lesson</button></div></div>`).join('')}</div><div class="notice"><strong>Common mistake:</strong> ${esc(g.pitfall)}</div><div class="study-actions"><button class="btn btn-secondary" data-action="guide" data-id="${Math.ma     function renderMockIntro(){const dist=syllabus.map(m=>`<span class="pill">${m.code}: ${mockDistribution[m.id]}</span>`).join('');app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Exam simulation</p><h1>Full Mock Examination</h1><p class="subhead">A 100-question session balanced to the chapter pattern in the supplied NEC model paper.</p></div><button class="btn btn-secondary" data-view="dashboard">Back to dashboard</button></div><section class="mock-intro"><div class="card"><h2>Before you begin</h2><ul class="instruction-list"><li><span class="checkmark">✓</span><span><strong>100 questions.</strong> Every mock avoids duplicate questions and draws from all 10 official chapters.</span></li><li><span class="checkmark">✓</span><span><strong>Answers stay hidden.</strong> Correct answers and explanations appear only after final submission.</span></li><li><span class="checkmark">✓</span><span><strong>Move freely.</strong> Use the palette, Previous/Next buttons and Mark for Review.</span></li><li><span class="checkmark">✓</span><span><strong>Auto-submit.</strong> A timed practice session submits when its selected practice timer ends.</span></li></ul><div class="notice"><strong>Official-score caution:</strong> The supplied documents confirm 100 × 1-mark model questions, but do not verify an official duration, negative marking rule or pass mark. The timer and performance bands here are study settings, not official NEC rules.</div><div class="question-meta">${dist}</div></div><aside class="card config-card"><p class="eyebrow">Session setup</p><h2>Mock configuration</h2><div class="field"><label for="mockTimer">Practice timer</label><select id="mockTimer"><option value="7200">120 minutes</option><option value="5400">90 minutes</option><option value="3600">60 minutes</option><option value="0">Untimed</option></select></div><div class="field"><label>Question selection</label><input value="Syllabus-balanced · randomized" disabled></div><button class="btn btn-primary     function renderPractice(mode='chapters'){const s=overallStats();const cards=syllabus.map(m=>{const q=questionBank.filter(x=>x.moduleId===m.id),st=moduleStats(m.id);return `<article class="card chapter-card"><div class="chapter-top"><span class="chapter-no">${m.id}</span><div><span class="chapter-code">${m.code}</span><h3>${esc(m.title)}</h3></div></div><div class="card-meta"><span>${q.length} questions</span><span>${st.attempted} attempted</span><span>${st.accuracy}% accuracy</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct(st.attempted,q.length)}%"></div></div><div class="card-actions">${[10,20,30].map(n=>`<button class="size-btn" data-action="startModule" data-id="${m.id}" data-size="${n}">${n}</button>`).join('')}<button class="size-btn" data-action="startModule" data-id="${m.id}" data-size="all">All</button></div></article>`}).join('');app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Focused learning</p><h1>Chapter Practice</h1><p class="subhead">Choose an official syllabus chapter, answer at your pace and check each explanation immediately.</p></div><button class="btn btn-secondary" data-action="showModules">Browse coded modules</button></div><section class="stats-grid"><div class="stat-card"><span>Available</span><strong>${questionBank.length}</strong></div><div class="stat-card"><span>Attempted</span><strong>${s.attempted}</strong></div><div class="stat-card"><span>Accuracy</span><strong>${s.accuracy}%</strong></div><div class="stat-card"><span>Wrong notebook</span><strong>${Object.keys(progress.wrong).length}</strong></div></section><section class="chapter-grid">${cards}</section>`}
    function renderModules(){appState.view='practice';app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Official syllabus codes</p><h1>Module Practice</h1><p class="subhead">Target one of the 60 official syllabus sections from AGeE0101 to AALL1006.</p></div><button class="btn btn-secondary" data-action="showChapters">View chapters</button></div>${syllabus.map(m=>`<details class="card module-group" ${m.id===1?'open':''}><summary><span class="chapter-no">${m.id}</span><span>${esc(m.title)} <small class="chapter-code">${m.code}</small></span></summary><div class="section-list">${m.sections.map(sec=>{const qs=questionBank.filter(q=>q.chapterCode===sec[0]),st=chapterStats(sec[0]);return `<div class="section-row"><div><small>${sec[0]} · ${qs.length} questions</small><strong>${esc(sec[1])}</strong><small>${st.attempted} attempted · ${st.accuracy}% accuracy</small></div><div class="card-actions"><button class="size-btn" data-action="startSection" data-code="${sec[0]}" data-size="10">10</button><button class="size-btn" data-action="startSection" data-code="${sec[0]}" data-size="all">All</button></div></div>`}).join('')}</div></details>`).join('')}`;setActiveNav()}
    function renderQuick(){appState.view='practice';app.innerHTML=`<div class="page-head"><div><p class="eyebrow">10-question sessions</p><h1>Quick 10</h1><p class="subhead">Each curated set includes one question from every official chapter. Random Quick 10 uses the same balance.</p></div><button class="btn btn-primary" data-action="randomQuick">Random Quick 10</button></div><section class="quick-grid">${Object.keys(curatedQuickTests).map(n=>`<article class="card quick-card"><span class="chapter-code">CURATED SET</span><h3>Quick Test ${String(n).padStart(2,'0')}</h3><p>10 source-based questions · all syllabus chapters</p><button class="btn btn-secondary btn-block" data-action="startQuick" data-id="${n}">Start test</button></article>`).join('')}</section>`;setActiveNav()}

    function balancedMock(){let chosen=[];for(const [id,count] of Object.entries(mockDistribution)){const pool=questionBank.filter(q=>q.moduleId===Number(id)&&!q.isPastQuestion&&!q.unscored);chosen.push(...sample(pool,count))}return shuffle(chosen)}
    function startSession(qs,{mode='practice',kind='Practice',duration=0}={}){if(!qs.length)return emptyCollection('No questions are available for this selection.');appState.session={id:Date.now(),mode,kind,questionIds:qs.map(q=>q.id),answers:{},checked:{},marked:[],visited:[qs[0].id],current:0,startedAt:Date.now(),duration,totalDuration:duration,recorded:{}};appState.result=null;save();go('session')}
    function startCollection(type){let pool=[],title='Practice';if(type==='past'){pool=questionBank.filter(q=>q.isPastQuestion||q.isModelQuestion);title='Past & Model Questions'}if(type==='wrong'){pool=questionBank.filter(q=>progress.wrong[q.id]);title='Wrong Answer Notebook'}if(type==='bookmarks'){pool=questionBank.filter(q=>progress.bookmarks.includes(q.id));title='Bookmarked Questions'}if(type==='weak'){pool=weakPool();title='Weak Topic Practice'}if(!pool.length)return emptyCollection(type==='weak'?'Complete a few questions first so weak topics can be calculated.':`Your ${title.toLowerCase()} collection is empty.`);startSession(sample(pool,Math.min(30,pool.length)),{kind:title})}
    function weakPool(){const rows=syllabus.flatMap(m=>m.sections.map(sec=>({code:sec[0],...chapterStats(sec[0])}))).filter(x=>x.attempts).sort((a,b)=>a.accuracy-b.accuracy||b.attempts-a.attempts);const codes=rows.slice(0,5).map(x=>x.code);return questionBank.filter(q=>codes.includes(q.chapterCode))}
