tem gives the same legal guarantees.","objective":"Distinguish deeds registration, title registration and tenure security.","concepts":[{"heading":"In registration of deeds, the state registers the transfer document but does not guarantee title","body":"Deeds registration records documents showing transactions. It does not by itself guarantee that the transferor held an unchallengeable title, so examination of the chain of documents may still be needed.","sourceQuestionId":201},{"heading":"The Torrens system is a system of registration of title with state guarantee","body":"Torrens-style title registration centres on the registered title and a state-backed assurance framework. This differs conceptually from recording transaction deeds without equivalent title assurance.","sourceQuestionId":202},{"heading":"Tenure security is the degree of confidence that land rights will be recognized and protected against eviction or challenge","body":"Tenure security means confidence that recognized land rights can be exercised and protected against arbitrary challenge. It is not simply possession of a map or the absence of all disputes.","sourceQuestionId":214},{"heading":"Customary tenure is based primarily on tradition and community recognition","body":"Customary tenure draws authority from community-recognized traditions and practices. It is conceptually distinct from rights created solely by an individual lease contract.","sourceQuestionId":217},{"heading":"Leasehold tenure means that rights are held for a term under a lease","body":"A lease grants specified rights for an agreed term, subject to its conditions. This limited duration distinguishes leasehold from an unrestricted permanent ownership interest.","sourceQuestionId":218},{"heading":"Systematic registration means first registration of all parcels in an area","body":"Systematic first registration addresses all parcels in a defined area together. Sporadic registration proceeds case by case, usually in response to an individual application or transaction.","sourceQuestionId":226}],"formulas":[],"workedExamples":[],"examTips":["Distinguish deeds registration, title registration and tenure security."],"commonMistakes":["Registration of a transfer document is not identical to a state guarantee of title."],"quickRecap":["Distinguish deeds registration, title registration and tenure security.","Deeds registration records documents showing transactions.","Torrens-style title registration centres on the registered title and a state-backed assurance framework.","Tenure security means confidence that recognized land rights can be exercised and protected against arbitrary challenge."],"comparison":[["Deeds registration","Records transaction documents."],["Title registration","Centres on a registered title and its assurance framework."]],"relatedQuestionIds":[201,202,214,217,218,226,521,600],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"4.3","page":67,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0404","title":"Land Information System","introduction":"A land information system joins parcel geometry with ownership, restrictions, value and change history. Its purpose is to support decisions and maintain consistent records across organizations.","objective":"Explain how parcel identifiers link maps and registers in an LIS.","concepts":[{"heading":"A linked parcel record","body":"Use one stable parcel identifier to join boundary geometry with rights, restrictions and valuation records. A subdivision must update both the map and register so that retired and new parcels can be traced."},{"heading":"Maintenance and access","body":"Validation checks geometry, identifiers and attribute consistency. Access rules, backups and change history protect records and explain who changed them and why."},{"heading":"A Land Information System (LIS) is essentially a GIS applied to land records and land administration","body":"An LIS applies spatial information management to parcels, rights, land use and administration. It connects land geometry with administrative records rather than serving only as an image viewer.","sourceQuestionId":203}],"formulas":[],"workedExamples":[],"examTips":["Explain how parcel identifiers link maps and registers in an LIS."],"commonMistakes":["An LIS is more than scanning paper maps: records need validated links and update procedures."],"quickRecap":["Explain how parcel identifiers link maps and registers in an LIS.","Use one stable parcel identifier to join boundary geometry with rights, restrictions and valuation records.","Validation checks geometry, identifiers and attribute consistency.","An LIS applies spatial information management to parcels, rights, land use and administration."],"comparison":[],"relatedQuestionIds":[203,522],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"4.4","page":69,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0405","title":"Land Use and Land Valuation","introduction":"Land-use planning changes how land is allocated and serviced. Consolidation, pooling and valuation use different tools: one improves fragmented holdings, another replans serviced plots, and valuation estimates economic worth.","objective":"Compare land consolidation, pooling and the three valuation approaches.","concepts":[{"heading":"Land consolidation is primarily used to improve agricultural efficiency by re-shaping fragmented holdings","body":"Fragmented agricultural plots increase access and cultivation costs. Consolidation rearranges holdings to make them more coherent and usable, aiming to improve agricultural efficiency.","sourceQuestionId":204},{"heading":"Land pooling (land readjustment) is widely used in Nepal for planned urban development","body":"Land pooling combines and replans participating land, allocates infrastructure space, then returns reconfigured serviced plots. It is a land-readjustment approach to planned urban development.","sourceQuestionId":205},{"heading":"The comparison (market) approach to valuation estimates value from recent comparable sales","body":"The market comparison approach estimates value from similar recent transactions, adjusted for differences such as location, size and access. Replacement cost and income capitalization are different methods.","sourceQuestionId":207},{"heading":"The income (capitalization) approach to valuation is based on the present worth of expected income","body":"An income-producing property is valued through the present worth of expected future net income. Future income must be discounted or capitalized rather than simply added without regard to time.","sourceQuestionId":220},{"heading":"The cost approach to valuation estimates value from cost of replacement less depreciation","body":"The cost approach estimates an equivalent replacement and deducts depreciation for age, condition or obsolescence. Land value may be assessed separately rather than depreciated like a building.","sourceQuestionId":227}],"formulas":[{"title":"Land pooling share","expression":"Returned area = A × (1 − r)","variables":"A: contributed area; r: deduction fraction, for example 0.30 for 30%.","spoken":"Returned area equals the contributed area times one minus the contribution fraction."}],"workedExamples":[{"problem":"In a land-pooling project that takes 30% of land for roads and public facilities, an owner who contributed 500 m² receives ? of serviced land.","given":"In a land-pooling project that takes 30% of land for roads and public facilities, an owner who contributed 500 m² receives __________ of serviced land.","formula":"Returned area = A × (1 − r)","calculation":"The retained share is 100% − 30% = 70%. Returned area = 500 × 0.70 = 350 m², assuming the stated uniform area deduction.","answer":"350 m²"},{"problem":"Using the coordinate method, a rectangle with vertices (0, 0), (30, 0), (30, 20) and (0, 20) has an area of ?.","given":"Using the coordinate method, a rectangle with vertices (0, 0), (30, 0), (30, 20) and (0, 20) has an area of __________.","formula":"Returned area = A × (1 − r)","calculation":"The vertices form a 30 m by 20 m rectangle, so area = 600 m². The shoelace coordinate formula gives the same result and applies to less regular polygons too.","answer":"600 m²"}],"examTips":["Compare land consolidation, pooling and the three valuation approaches."],"commonMistakes":["Market value, taxable value and replacement cost need not be the same amount."],"quickRecap":["Compare land consolidation, pooling and the three valuation approaches.","Fragmented agricultural plots increase access and cultivation costs.","Land pooling combines and replans participating land, allocates infrastructure space, then returns reconfigured serviced plots.","The market comparison approach estimates value from similar recent transactions, adjusted for differences such as location, size and access."],"comparison":[],"relatedQuestionIds":[204,205,206,207,216,220,227,523,524],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"4.5","page":69,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0406","title":"Land Policies, Acts and Regulations","introduction":"Use the supplied chronology to distinguish policies, Acts and implementing rules. Policies set direction; legislation supplies legal authority. For professional decisions, consult authoritative amended texts.","objective":"Distinguish legal instruments and identify the laws named in the supplied syllabus.","concepts":[{"heading":"An Act (Ain) is primary legislation enacted by Parliament","body":"An Act is primary legislation enacted by the legislature. Rules implement powers delegated by an Act, while policies generally guide decisions rather than having the same legal status.","sourceQuestionId":208},{"heading":"In the legal hierarchy, a Policy is directional guidance, not directly enforceable like an Act","body":"A policy sets direction and objectives. It should not be treated as equivalent to a directly enforceable Act; legal effect depends on applicable legislation and implementation instruments.","sourceQuestionId":209},{"heading":"The Land (Survey and Measurement) Act, which underpins cadastral surveying in Nepal, is dated 2019 BS (1962/63 AD)","body":"The supplied syllabus notes identify the Land (Survey and Measurement) Act by 2019 BS. Treat the AD conversion as approximate and consult the authoritative amended text for legal use.","sourceQuestionId":210},{"heading":"The Land Use Act of Nepal that created the Land Use Council is dated 2076 BS (2019 AD)","body":"The supplied material dates the Land Use Act to 2076 BS (2019 AD). This is a historical identification question; current procedures and council powers require checking the amended legislation.","sourceQuestionId":211},{"heading":"The National Land Use Policy of Nepal is dated 2072 BS (2015 AD)","body":"The supplied notes identify National Land Use Policy as 2072 BS (2015 AD). Distinguish a policy date from the later Land Use Act's date.","sourceQuestionId":212},{"heading":"The National Land Policy of Nepal is dated 2075 BS (2019 AD)","body":"The supplied notes identify National Land Policy as 2075 BS, corresponding to the 2018/2019 period. This is separate from the 2072 land-use policy and 2076 land-use legislation.","sourceQuestionId":213}],"formulas":[],"workedExamples":[{"problem":"A 1:2500 cadastral map shows a line of 4.8 cm. The corresponding ground length is ?.","given":"A 1:2500 cadastral map shows a line of 4.8 cm. The corresponding ground length ","formula":"Use the relationship shown in the calculation.","calculation":"Ground distance = 4.8 cm × 2500 = 12 000 cm = 120 m. Convert units after applying the representative fraction.","answer":"120.0 m"}],"examTips":["Distinguish legal instruments and identify the laws named in the supplied syllabus."],"commonMistakes":["A historical study date does not establish the current wording of an amended provision."],"quickRecap":["Distinguish legal instruments and identify the laws named in the supplied syllabus.","An Act is primary legislation enacted by the legislature.","A policy sets direction and objectives.","The supplied syllabus notes identify the Land (Survey and Measurement) Act by 2019 BS."],"comparison":[],"relatedQuestionIds":[208,209,210,211,212,213,215],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"4.6","page":71,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}}]},{"moduleId":5,"code":"AGeE05","title":"Global Navigation Satellite System (GNSS)","overview":"Follow the measurement model from satellite range to position, then learn differencing, atmosphere, DOP, precise methods and GNSS/INS integration.","learningObjectives":["Explain four unknowns, code pseudorange and carrier ambiguity.","Identify the geometric and error terms in a range equation.","Match single, double and triple differences to their purpose.","Calculate PDOP and use DOP with a stated range-error estimate.","Compare static, RTK, DGPS and PPP by workflow and conditions.","Explain inertial drift and loose versus tight GNSS coupling."],"sections":[{"code":"AGeE0501","title":"GNSS Fundamentals and Principles","introduction":"GNSS combines ranges from satellites with known positions to estimate a receiver's coordinates and time offset. Code and carrier phase observe the same geometry with different precision and ambiguity issues.","objective":"Explain four unknowns, code pseudorange and carrier ambiguity.","concepts":[{"heading":"GNSS is a generic term covering GPS, GLONASS, Galileo and BeiDou","body":"GNSS is the umbrella term; GPS is one constellation within it. BeiDou joins GPS, GLONASS and Galileo among global satellite navigation systems.","sourceQuestionId":231},{"heading":"Absolute GNSS positioning requires at least four satellites to solve for three-dimensional position and receiver clock offset","body":"The usual standalone solution has four unknowns: X, Y, Z and receiver clock offset. At least four independent satellite pseudoranges are therefore needed, assuming suitable geometry.","sourceQuestionId":232},{"heading":"GPS satellites orbit at an altitude of approximately 20 200 km","body":"GPS uses medium Earth orbit at roughly 20 200 km above Earth. This altitude must not be confused with distance from Earth's centre, which includes Earth's radius.","sourceQuestionId":233},{"heading":"The GPS L1 carrier frequency is 1575.42 MHz","body":"GPS L1 is 1575.42 MHz. Frequency identifies the carrier band; it is not the chip rate or the satellite's orbital frequency.","sourceQuestionId":234},{"heading":"The GNSS observable based on the travel time of a coded signal is called pseudorange","body":"Code travel time multiplied by light speed gives pseudorange. It is only a pseudo range because clocks, atmosphere and other effects contaminate the geometric distance.","sourceQuestionId":236},{"heading":"In the carrier-phase observation equation, N denotes the integer ambiguity","body":"Carrier tracking measures fractional phase but initially cannot count all complete cycles between satellite and receiver. The unknown whole-cycle count is the integer ambiguity N.","sourceQuestionId":237},{"heading":"The ionospheric term is positive; negative for the code observable and positive; negative for the carrier-phase observable","body":"The ionosphere delays code group propagation but advances carrier phase relative to vacuum. Thus the first-order ionospheric terms have opposite signs in the two range-form equations.","sourceQuestionId":238},{"heading":"Ionospheric delay is approximately proportional to 1/f²","body":"First-order ionospheric range delay depends on electron content and varies approximately as 1/f². This frequency dependence makes dual-frequency correction possible.","sourceQuestionId":239},{"heading":"GNSS signals are right-hand circularly (RHCP) polarized","body":"GNSS signals use right-hand circular polarization to reduce sensitivity to antenna orientation. Reflections can alter polarization, which helps explain some antenna-based multipath rejection.","sourceQuestionId":240},{"heading":"The antenna phase centre is the effective point of signal reception and must be calibrated for precise work","body":"The effective phase reception point can differ from the antenna's physical reference mark and vary with signal direction. Calibration and correct antenna-height measurement matter for precise positioning.","sourceQuestionId":269}],"formulas":[{"title":"Carrier wavelength","expression":"λ = c / f","variables":"c: speed of light; f: carrier frequency in hertz; λ in metres.","spoken":"Wavelength equals the speed of light divided by frequency."}],"workedExamples":[{"problem":"The wavelength of the GPS L1 carrier is approximately ?.","given":"The wavelength of the GPS L1 carrier ","formula":"λ = c / f","calculation":"Wavelength = c/f ≈ 299 792 458/(1575.42 × 10⁶) ≈ 0.1903 m, or 19.0 cm. Higher frequencies have shorter wavelengths.","answer":"19.0 cm"}],"examTips":["Explain four unknowns, code pseudorange and carrier ambiguity."],"commonMistakes":["Four satellites are the minimum for the usual unconstrained solution, not a guarantee of good accuracy."],"quickRecap":["Explain four unknowns, code pseudorange and carrier ambiguity.","GNSS is the umbrella term; GPS is one constellation within it.","The usual standalone solution has four unknowns: X, Y, Z and receiver clock offset.","GPS uses medium Earth orbit at roughly 20 200 km above Earth."],"comparison":[],"relatedQuestionIds":[231,232,233,234,235,236,237,238,239,240,269,525,527,528,529,576,577,606],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"5.1","page":75,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0502","title":"GNSS Mathematical Models","introduction":"A GNSS observation model separates geometric range from clocks, atmosphere and noise. Orbit models locate the satellite; linearized equations then connect observed ranges to receiver coordinate corrections.","objective":"Identify the geometric and error terms in a range equation.","concepts":[{"heading":"Code observation model","body":"In range units, a code observation contains geometric range, receiver-minus-satellite clock error multiplied by light speed, ionospheric delay, tropospheric delay and residual noise or multipath. Estimate or correct these terms before interpreting the result as distance."},{"heading":"Carrier observation model","body":"Carrier phase adds a wavelength-times-integer-ambiguity term and has the opposite first-order ionospheric sign to code. Consistent units and sign conventions are essential when combining observations."},{"heading":"Broadcast GNSS orbits are described by six Keplerian elements plus perturbation corrections","body":"A Keplerian orbit is described by six parameters for size, shape and orientation/phase. Broadcast navigation models supplement them with corrections for departures from ideal two-body motion.","sourceQuestionId":270},{"heading":"The geometric range from a receiver at (X, Y, Z) to satellite i is the Euclidean distance between the two positions","body":"Geometric range is √[(Xi − X)² + (Yi − Y)² + (Zi − Z)²], with positions in a consistent frame and epoch. Pseudorange additionally contains clock and propagation effects.","sourceQuestionId":279}],"formulas":[{"title":"Range geometry","expression":"ρ = √[(Xs − Xr)² + (Ys − Yr)² + (Zs − Zr)²]","variables":"s: satellite; r: receiver. Use a consistent coordinate frame and epoch.","spoken":"Geometric range is the square root of the sum of squared coordinate differences between receiver and satellite."}],"workedExamples":[],"examTips":["Identify the geometric and error terms in a range equation."],"commonMistakes":["Pseudorange is not simply the Euclidean receiver-to-satellite distance."],"quickRecap":["Identify the geometric and error terms in a range equation.","In range units, a code observation contains geometric range, receiver-minus-satellite clock error multiplied by light speed, ionospheric delay, tropospheric delay and residual noise or multipath.","Carrier phase adds a wavelength-times-integer-ambiguity term and has the opposite first-order ionospheric sign to code.","A Keplerian orbit is described by six parameters for size, shape and orientation/phase."],"comparison":[],"relatedQuestionIds":[270,279],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"5.2","page":76,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0503","title":"GNSS Signals and Processing","introduction":"Signal processing uses differences and frequency combinations to reduce specific errors. Each operation has a purpose and a cost: clocks may cancel while noise grows and local multipath remains.","objective":"Match single, double and triple differences to their purpose.","concepts":[{"heading":"Single differencing between two receivers observing the same satellite removes the satellite clock error","body":"Subtracting simultaneous observations of the same satellite at two receivers cancels the common satellite-clock term. Receiver clocks remain until another difference is formed.","sourceQuestionId":241},{"heading":"Double differencing removes both receiver and satellite clock errors","body":"A double difference combines receiver and satellite differencing, cancelling both clock terms. Atmospheric residuals, measurement noise and local multipath do not all disappear.","sourceQuestionId":242},{"heading":"Triple differencing is particularly useful for cycle-slip detection","body":"Taking a further difference across epochs removes unchanged ambiguities. A discontinuity then helps detect cycle slips, although extra differencing also increases observation noise.","sourceQuestionId":243},{"heading":"The wide-lane combination has a wavelength of about 86.2 cm and therefore eases ambiguity resolution","body":"For GPS L1/L2, wide-lane wavelength c/(f1 − f2) is about 0.862 m. Its longer cycles make resolving the integer count easier than on either original carrier alone.","sourceQuestionId":244},{"heading":"The ionosphere-free linear combination is used mainly to remove first-order ionospheric delay","body":"A frequency-weighted combination exploits the 1/f² dependence to cancel first-order ionospheric delay. It does not eliminate all atmospheric error and generally amplifies measurement noise.","sourceQuestionId":245},{"heading":"Tropospheric delay is non-dispersive and is therefore not removed by dual-frequency combinations","body":"At GNSS frequencies the neutral atmosphere is effectively non-dispersive. Its delay cannot be separated simply by using two carrier frequencies, so modelling or estimation is required.","sourceQuestionId":246},{"heading":"Multipath error is site-dependent and generally cannot be removed by differencing between stations","body":"Multipath depends on reflectors near each antenna and is not generally common between stations. Differencing cannot cancel an error that differs independently at the two sites.","sourceQuestionId":247},{"heading":"RINEX is a standard format for GNSS observation and navigation data","body":"RINEX exchanges GNSS observation and navigation data independently of receiver manufacturer. It is an exchange format, not a correction algorithm or a coordinate reference system.","sourceQuestionId":271},{"heading":"A cycle slip in carrier-phase tracking is a sudden integer jump in the carrier-phase ambiguity","body":"Loss of uninterrupted carrier tracking can change the whole-cycle count abruptly. This cycle slip must be detected and the ambiguity repaired or reinitialized before precise processing continues.","sourceQuestionId":273},{"heading":"Distinguishing the alternatives","body":"Double differencing cancels shared clock terms, not local reflected-signal paths. Multipath at each antenna therefore remains an important error source even on short baselines.","sourceQuestionId":278}],"formulas":[],"workedExamples":[{"problem":"A 10 km baseline measured with a specification of 3 mm + 0.5 ppm has an expected accuracy of ?.","given":"A 10 km baseline measured with a specification of 3 mm + 0.5 ppm has an expected accuracy of __________.","formula":"Use the relationship shown in the calculation.","calculation":"0.5 ppm of 10 km = 0.5 × 10⁻⁶ × 10 000 m = 5 mm. Add the 3 mm constant term to obtain 8 mm under the stated specification.","answer":"8.0 mm"}],"examTips":["Match single, double and triple differences to their purpose."],"commonMistakes":["Dual-frequency combinations remove first-order ionosphere, not non-dispersive tropospheric delay."],"quickRecap":["Match single, double and triple differences to their purpose.","Subtracting simultaneous observations of the same satellite at two receivers cancels the common satellite-clock term.","A double difference combines receiver and satellite differencing, cancelling both clock terms.","Taking a further difference across epochs removes unchanged ambiguities."],"comparison":[],"relatedQuestionIds":[241,242,243,244,245,246,247,271,272,273,278,526,578,617],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"5.3","page":77,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0504","title":"Satellite Geometry and DOP","introduction":"Satellite geometry controls how range uncertainty becomes position uncertainty. DOP separates this geometric effect from the quality of the ranges, making it useful for survey planning and quality checks.","objective":"Calculate PDOP and use DOP with a stated range-error estimate.","concepts":[{"heading":"Dilution of Precision (DOP) describes the effect of satellite geometry on positioning accuracy","body":"DOP describes how satellite geometry amplifies range uncertainty into position or time uncertainty. Widely distributed satellites generally provide stronger geometry than a tight cluster.","sourceQuestionId":248},{"heading":"The relationship among the DOP factors is PDOP² = HDOP² + VDOP²","body":"PDOP combines the three spatial components. Since HDOP already combines the two horizontal components, PDOP² = HDOP² + VDOP² rather than their unsquared sum.","sourceQuestionId":249},{"heading":"GDOP² is equal to PDOP² + TDOP²","body":"GDOP includes position and receiver-time uncertainty. Their squared contributions combine as GDOP² = PDOP² + TDOP².","sourceQuestionId":250},{"heading":"In general, VDOP is larger than HDOP, so vertical GNSS accuracy is weaker than horizontal accuracy","body":"Ground receivers see satellites mainly above the horizon, giving weaker vertical geometry than a surrounding horizontal distribution. VDOP is therefore commonly larger, though the exact ratio varies.","sourceQuestionId":253},{"heading":"Position error may be estimated as DOP × UERE","body":"The simplified estimate multiplies a geometry factor by user-equivalent range error. DOP is dimensionless and UERE is in metres, so the estimated position error is also in metres.","sourceQuestionId":254},{"heading":"A good GNSS survey plan typically aims to keep PDOP below about 4–6","body":"The notes suggest PDOP below roughly 4–6 as a planning guideline. Actual acceptance thresholds depend on survey specifications, observation quality and the required confidence level.","sourceQuestionId":256},{"heading":"The elevation mask angle in GNSS surveying is commonly set at about 10°–15°","body":"Low-elevation signals travel through more atmosphere and often suffer stronger multipath. A 10°–15° mask is a common notes-based compromise, not a universal setting.","sourceQuestionId":274},{"heading":"Quality control (QC) in a GNSS survey includes computed indicators such as loop closures and ambiguity-resolution success and residuals","body":"Residuals, ambiguity quality and independent closures help reveal inconsistent observations or false fixes. A small reported coordinate standard deviation alone is not complete quality control.","sourceQuestionId":275}],"formulas":[{"title":"Dilution of precision","expression":"PDOP² = HDOP² + VDOP²","variables":"PDOP: 3D position; HDOP: horizontal; VDOP: vertical. All are dimensionless.","spoken":"Position D O P squared equals horizontal D O P squared plus vertical D O P squared."}],"workedExamples":[{"problem":"If HDOP = 1.5 and VDOP = 2.0, then PDOP is ?.","given":"If HDOP = 1.5 and VDOP = 2.0, then PDOP ","formula":"PDOP² = HDOP² + VDOP²","calculation":"PDOP = √(1.5² + 2.0²) = √6.25 = 2.5. DOP values are dimensionless geometry factors.","answer":"2.5"},{"problem":"If PDOP = 2.5 and TDOP = 1.0, then GDOP is approximately ?.","given":"If PDOP = 2.5 and TDOP = 1.0, then GDOP ","formula":"PDOP² = HDOP² + VDOP²","calculation":"GDOP = √(2.5² + 1.0²) = √7.25 ≈ 2.693, rounded to 2.7. Add squares before taking the square root.","answer":"2.7"}],"examTips":["Calculate PDOP and use DOP with a stated range-error estimate."],"commonMistakes":["Low DOP cannot rescue measurements corrupted by strong multipath or a false ambiguity fix."],"quickRecap":["Calculate PDOP and use DOP with a stated range-error estimate.","DOP describes how satellite geometry amplifies range uncertainty into position or time uncertainty.","PDOP combines the three spatial components.","GDOP includes position and receiver-time uncertainty."],"comparison":[],"relatedQuestionIds":[248,249,250,251,252,253,254,255,256,274,275,280],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"5.4","page":78,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0505","title":"Static and Kinematic Positioning","introduction":"Choose positioning mode from the required accuracy, available reference services and occupation time. Static processing, RTK, differential code and PPP have different observing and correction requirements.","objective":"Compare static, RTK, DGPS and PPP by workflow and conditions.","concepts":[{"heading":"Static GNSS positioning with ambiguity resolution typically achieves millimetre to centimetre accuracy on baselines","body":"Resolved carrier-phase ambiguities and adequate observing conditions enable millimetre-to-centimetre baseline precision. This is a technique capability, not a guarantee for every baseline or environment.","sourceQuestionId":257},{"heading":"Rapid static GNSS typically uses occupation times of about 5–20 minutes","body":"The notes give about 5–20 minutes for rapid-static occupations under suitable conditions. Baseline length, visibility, receiver capability and specifications can require longer observations.","sourceQuestionId":258},{"heading":"Real-Time Kinematic (RTK) positioning provides centimetre-level positions in real time","body":"RTK uses carrier-phase observations with reference corrections to solve precise positions while the survey is underway. A reliable fixed ambiguity solution and communication link are essential.","sourceQuestionId":259},{"heading":"CORS are Continuously Operating Reference Stations","body":"CORS continuously collect reference GNSS observations. They support post-processing and, where provided, real-time correction services for survey users.","sourceQuestionId":260},{"heading":"Network RTK techniques include VRS, MAC and FKP","body":"FKP models spatially varying correction parameters across a reference network. It is one network-RTK approach, alongside virtual reference stations and master–auxiliary concepts.","sourceQuestionId":261},{"heading":"Precise Point Positioning (PPP) uses precise orbits and clocks to achieve centimetre to decimetre accuracy with a single receiver","body":"PPP uses precise satellite products and a detailed observation model without requiring a nearby user base receiver. High precision depends on convergence, corrections, equipment and observing conditions.","sourceQuestionId":262},{"heading":"Typical stand-alone code (absolute) GNSS accuracy is of the order of 1–10 m","body":"Standalone code positioning is generally metre-level because clock, atmosphere, orbit and measurement errors remain. Differential and carrier-phase methods are used when finer survey accuracy is required.","sourceQuestionId":263},{"heading":"DGPS (code differential) typically improves absolute code accuracy to about 0.5–2 m","body":"Code differential positioning removes some common reference/rover errors, often improving accuracy to roughly metre level. It is generally less precise than fixed carrier-phase RTK.","sourceQuestionId":276},{"heading":"Stop-and-go GNSS is a kinematic variant in which the rover stops briefly at each surveyed point","body":"In stop-and-go surveying the rover pauses briefly at points while maintaining tracking between them. Continuous ambiguity tracking avoids a new full initialization at every point.","sourceQuestionId":277}],"formulas":[],"workedExamples":[],"examTips":["Compare static, RTK, DGPS and PPP by workflow and conditions."],"commonMistakes":["Centimetre capability is conditional on the observing environment and solution quality."],"quickRecap":["Compare static, RTK, DGPS and PPP by workflow and conditions.","Resolved carrier-phase ambiguities and adequate observing conditions enable millimetre-to-centimetre baseline precision.","The notes give about 5–20 minutes for rapid-static occupations under suitable conditions.","RTK uses carrier-phase observations with reference corrections to solve precise positions while the survey is underway."],"comparison":[["Static","Stationary occupations, normally processed with carrier observations."],["RTK","Real-time reference corrections and rover ambiguity solution."]],"relatedQuestionIds":[257,258,259,260,261,262,263,276,277],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"5.5","page":79,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0506","title":"Inertial Navigation System","introduction":"Inertial navigation propagates motion using accelerometers and gyroscopes. Integration provides continuity but also accumulates bias, so GNSS observations help constrain drift.","objective":"Explain inertial drift and loose versus tight GNSS coupling.","concepts":[{"heading":"An INS determines position by integrating measurements of specific force and angular rate","body":"Accelerometers measure specific force and gyroscopes measure angular rate. INS integrates these with orientation and gravity modelling to propagate velocity and position.","sourceQuestionId":264},{"heading":"Standalone INS position error grows with time approximately as t² because of accelerometer bias","body":"A constant accelerometer bias b integrates to velocity error bt and position error approximately bt²/2. This quadratic example explains why unaided inertial navigation drifts.","sourceQuestionId":265},{"heading":"The Kalman filter is a recursive estimator used to fuse INS with aiding sensors such as GNSS","body":"A Kalman filter recursively predicts state and corrects it with new measurements. GNSS can constrain inertial drift while INS bridges short GNSS interruptions.","sourceQuestionId":266},{"heading":"In loosely coupled GNSS/INS integration, the filter is updated with GNSS position and velocity","body":"Loosely coupled integration takes a GNSS receiver's computed position and velocity as filter inputs. It does not directly combine each raw satellite range in the central filter.","sourceQuestionId":267},{"heading":"Tightly coupled integration updates the filter with raw GNSS pseudoranges and/or carrier phases","body":"Tightly coupled integration processes individual GNSS observables with inertial measurements in a shared estimator. This can retain useful partial-satellite information when a standalone GNSS solution is unavailable.","sourceQuestionId":268}],"formulas":[{"title":"Constant accelerometer bias","expression":"Position error ≈ ½ b t²","variables":"b: constant acceleration bias; t: elapsed time. Simplified unaided model.","spoken":"Position error from a constant accelerometer bias grows approximately as one half bias times elapsed time squared."}],"workedExamples":[],"examTips":["Explain inertial drift and loose versus tight GNSS coupling."],"commonMistakes":["An accelerometer bias is integrated twice into position error."],"quickRecap":["Explain inertial drift and loose versus tight GNSS coupling.","Accelerometers measure specific force and gyroscopes measure angular rate.","A constant accelerometer bias b integrates to velocity error bt and position error approximately bt²/2.","A Kalman filter recursively predicts state and corrects it with new measurements."],"comparison":[],"relatedQuestionIds":[264,265,266,267,268,530,611],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"5.6","page":80,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}}]},{"moduleId":6,"code":"AGeE06","title":"Cartography and Geo-Visualization","overview":"Choose projections and visual variables according to map purpose, scale and audience, then apply classification, generalization and web-service concepts.","learningObjectives":["Explain how purpose and scale guide map design.","Compare conformal and equal-area projections and compute scale changes.","Match measurement levels, visual variables and classification methods.","Explain generalization and distinguish RGB from CMYK.","Distinguish DLM, DCM, WMS, WFS and WCS.","Identify essential map elements and explain offset printing."],"sections":[{"code":"AGeE0601","title":"Cartography and Visualization Fundamentals","introduction":"Cartography makes spatial information understandable. Begin with the audience, task and scale, then select content and visual variables so the most useful message is easy to read.","objective":"Explain how purpose and scale guide map design.","concepts":[{"heading":"Design for a purpose","body":"A navigation map emphasizes routes and orientation; a thematic map emphasizes a selected variable. Choose scale, content and symbol hierarchy for the task before styling individual features."},{"heading":"Cartography is the art, science and technology of making and studying maps","body":"Cartography combines scientific representation with design and production of maps. Its goal is to communicate spatial relationships, not merely to collect raw coordinates.","sourceQuestionId":281},{"heading":"A large-scale map is generally considered to have a scale larger than about 1:25 000","body":"The notes use about 1:25 000 as a teaching boundary for large scale. Such classifications vary; the general rule is that a smaller denominator means a larger scale.","sourceQuestionId":282}],"formulas":[],"workedExamples":[],"examTips":["Explain how purpose and scale guide map design."],"commonMistakes":["Adding more symbols can make a map less informative if they compete for attention."],"quickRecap":["Explain how purpose and scale guide map design.","A navigation map emphasizes routes and orientation; a thematic map emphasizes a selected variable.","Cartography combines scientific representation with design and production of maps.","The notes use about 1:25 000 as a teaching boundary for large scale."],"comparison":[],"relatedQuestionIds":[281,282,531,582],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"6.1","page":85,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0602","title":"Map Projection and Sheet Numbering","introduction":"A projection trades one kind of distortion for another. Select it from extent and purpose, read the scale factor correctly, and distinguish UTM from the Nepal MUTM convention in the supplied notes.","objective":"Compare conformal and equal-area projections and compute scale changes.","concepts":[{"heading":"A conformal (orthomorphic) projection preserves local angles (shapes)","body":"Conformal projections preserve local angles and infinitesimal shapes. They do not preserve area everywhere or necessarily the shape of very large regions.","sourceQuestionId":283},{"heading":"An equal-area (equivalent) projection preserves areas","body":"Equal-area projections retain relative and total areas, making them useful for area comparison. They must distort some angles or shapes because the curved surface cannot be flattened perfectly.","sourceQuestionId":284},{"heading":"A map cannot be both conformal and equal-area because the ellipsoid cannot be flattened without distortion","body":"A curved ellipsoid and a plane have different intrinsic geometry. No flat map can preserve all local angles and areas everywhere, so projection selection involves choosing which distortions to control.","sourceQuestionId":285},{"heading":"Tissot's indicatrix visualizes distortion by showing how infinitesimal circles become ellipses","body":"Tissot's indicatrix maps a tiny circle to an ellipse. Its size, axis lengths and orientation reveal local area, scale and angular distortion.","sourceQuestionId":286},{"heading":"The UTM projection uses a central-meridian scale factor k₀ of 0.9996","body":"UTM uses k0 = 0.9996 at its central meridian to balance distortion across the zone. This is not Nepal MUTM's different central-meridian factor.","sourceQuestionId":287},{"heading":"UTM zones are 6° wide in longitude","body":"Standard UTM divides longitude into 60 zones of 6° each. Zone boundaries and special exceptions must be handled when locating a real dataset.","sourceQuestionId":288},{"heading":"Nepal's MUTM projection uses 3° zones","body":"The supplied Nepal MUTM notes use narrower 3° zones. Narrower zones limit distance from the central meridian and thus help control transverse-Mercator distortion.","sourceQuestionId":289},{"heading":"The Mercator projection is conformal and represents rhumb lines as straight lines, making it useful for navigation","body":"Mercator depicts constant-bearing rhumb lines as straight lines. These are useful for navigation but generally are not the shortest great-circle routes.","sourceQuestionId":290},{"heading":"For a large east–west region, a suitable conformal projection is generally the Lambert Conformal Conic","body":"A Lambert conformal conic projection can control distortion over mid-latitude regions extending east–west by selecting suitable standard parallels. Projection choice still depends on location and purpose.","sourceQuestionId":291},{"heading":"For a large north–south region, a suitable projection is generally the Transverse Mercator","body":"Transverse Mercator centres its low-distortion region along a meridian. This suits a north–south extent better than an ordinary equatorial Mercator layout in many mapping situations.","sourceQuestionId":292},{"heading":"Nepal's national topographic base maps are published mainly at scales of 1:25 000 and 1:50 000","body":"The supplied materials identify 1:25 000 and 1:50 000 as principal Nepal topographic base-map scales. A specific sheet's marginal information is the authority for its actual scale.","sourceQuestionId":293},{"heading":"Scale factor k is the ratio of local scale to principal (nominal) scale","body":"A projection scale factor compares local scale with the nominal or principal map scale. A factor of one means no local scale change relative to that nominal value.","sourceQuestionId":314},{"heading":"The International Map of the World (IMW) 1:1 000 000 sheets cover 4° latitude × 6° longitude","body":"Standard IMW million-scale sheets span 4° latitude by 6° longitude in the usual indexing scheme. Geographic extents are angular, so their ground dimensions vary with latitude.","sourceQuestionId":318}],"formulas":[{"title":"Map reduction","expression":"Area factor = (old denominator / new denominator)²","variables":"Linear scale changes once; plotted area changes by the square.","spoken":"The area change factor is the square of the old scale denominator divided by the new denominator."}],"workedExamples":[{"problem":"If a map is reduced from 1:50 000 to 1:250 000, the plotted map area changes by a factor of ?.","given":"If a map is reduced from 1:50 000 to 1:250 000, the plotted map area changes by a factor of __________.","formula":"Area factor = (old denominator / new denominator)²","calculation":"The linear reduction is 50 000/250 000 = 1/5. Area changes by its square, (1/5)² = 1/25, not by the linear factor alone.","answer":"1/25"},{"problem":"A road measures 6.5 cm on a 1:25 000 map. Its ground length is ?.","given":"A road measures 6.5 cm on a 1:25 000 map. Its ground length ","formula":"Area factor = (old denominator / new denominator)²","calculation":"6.5 cm × 25 000 = 162 500 cm = 1625 m = 1.625 km. Keep the map and ground units consistent before converting.","answer":"1.625 km"}],"examTips":["Compare conformal and equal-area projections and compute scale changes."],"commonMistakes":["No flat projection preserves all angles, areas and distances everywhere."],"quickRecap":["Compare conformal and equal-area projections and compute scale changes.","Conformal projections preserve local angles and infinitesimal shapes.","Equal-area projections retain relative and total areas, making them useful for area comparison.","A curved ellipsoid and a plane have different intrinsic geometry."],"comparison":[["UTM","Usually 6° zones; k0 = 0.9996."],["Nepal MUTM in supplied notes","3° zones; k0 = 0.9999."]],"relatedQuestionIds":[283,284,285,286,287,288,289,290,291,292,293,294,295,313,314,318,532,620],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"6.2","page":86,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0603","title":"Cartographic Visualization","introduction":"Choose symbols and classes according to the data's measurement level. Nominal classes need distinct identities, ordered classes need an order, and numerical comparisons need an appropriate visual progression.","objective":"Match measurement levels, visual variables and classification methods.","concepts":[{"heading":"Bertin's visual variables include position, size, shape, hue, value, texture and orientation","body":"Orientation distinguishes symbols by their direction, alongside position, size, shape, hue, value and texture. Different variables suit categorical and ordered information differently.","sourceQuestionId":296},{"heading":"A nominal measurement scale consists of categories without order","body":"Nominal categories such as forest, water and settlement have no inherent ranking. Assigning numbers to them does not make arithmetic averages meaningful.","sourceQuestionId":297},{"heading":"Elevation above a datum is an example of a interval scale of measurement","body":"Elevation relative to an adopted datum has an arbitrary zero, so it is an interval scale: differences are meaningful, but 200 m is not inherently twice as high as 100 m above every datum. Physical length with a true zero is ratio-scale.","sourceQuestionId":298},{"heading":"Jenks natural-breaks classification minimizes within-class variance","body":"Jenks natural breaks seeks compact groups by reducing variation within each class and separating classes. Unlike quantiles, it does not require equal numbers of observations per class.","sourceQuestionId":299},{"heading":"Choropleth maps typically represent statistical data by shading or colouring enumeration areas","body":"A choropleth fills defined areas according to a statistical value. Rates or normalized values usually compare regions more fairly than raw totals influenced by area or population size.","sourceQuestionId":315},{"heading":"Visual hierarchy on a map places the map face (body) at the highest level of importance","body":"The mapped information should dominate the visual hierarchy. Supporting elements such as legend and scale must be legible without overwhelming the map body.","sourceQuestionId":316},{"heading":"Quantile classification places equal numbers of observations in each class","body":"Quantiles allocate approximately equal numbers of observations to each class. Class interval widths can differ substantially, which may exaggerate small value differences near a boundary.","sourceQuestionId":319},{"heading":"Which statement about map enlargement is correct?","body":"Enlargement makes existing symbols and pixels bigger but cannot recover detail absent from the source. New ground information requires better-resolution data, not just a larger print.","sourceQuestionId":320}],"formulas":[],"workedExamples":[],"examTips":["Match measurement levels, visual variables and classification methods."],"commonMistakes":["Raw totals on a choropleth can confuse population size with the intensity of a phenomenon."],"quickRecap":["Match measurement levels, visual variables and classification methods.","Orientation distinguishes symbols by their direction, alongside position, size, shape, hue, value and texture.","Nominal categories such as forest, water and settlement have no inherent ranking.","Elevation relative to an adopted datum has an arbitrary zero, so it is an interval scale: differences are meaningful, but 200 m is not inherently twice as high as 100 m above every datum."],"comparison":[],"relatedQuestionIds":[296,297,298,299,315,316,319,320,533,580],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"6.3","page":87,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0604","title":"Generalization, Typography and Colour","introduction":"Generalization preserves a map's message as space becomes limited. Selection, simplification and displacement work with typography and colour to keep the result readable at its intended scale.","objective":"Explain generalization and distinguish RGB from CMYK.","concepts":[{"heading":"Cartographic generalization is required when map scale becomes smaller so that remaining detail stays legible","body":"At smaller scale, the same ground features occupy less page space. Generalization selects and simplifies detail so symbols remain distinguishable and important relationships survive.","sourceQuestionId":300},{"heading":"Selection, simplification, smoothing, aggregation and displacement are generalization operators","body":"These operators reduce or reorganize detail for a target scale. Displacement moves conflicting symbols for legibility; simplification reduces vertices; aggregation combines related features.","sourceQuestionId":301},{"heading":"Toponymy is the study and standardization of place names","body":"Toponymy concerns geographic names, including their origin, usage and standardization. Consistent place names support clear communication and reliable map interpretation.","sourceQuestionId":302},{"heading":"RGB is an additive colour model used for screens","body":"Screens emit red, green and blue light. Adding the channels moves toward white, so RGB is additive rather than an ink-mixing system.","sourceQuestionId":303},{"heading":"CMYK is a subtractive colour model used for printing","body":"Printing inks absorb parts of incident light. Cyan, magenta, yellow and black therefore form a subtractive model; combining inks reduces reflected light.","sourceQuestionId":304},{"heading":"Italic lettering on topographic maps is conventionally used for water features","body":"Italic labels are a conventional way to distinguish water features on many topographic maps. Typography is a design convention, so a specific map series' legend and standards take precedence.","sourceQuestionId":317}],"formulas":[],"workedExamples":[],"examTips":["Explain generalization and distinguish RGB from CMYK."],"commonMistakes":["Graphic displacement improves legibility but must not be mistaken for a new measured coordinate."],"quickRecap":["Explain generalization and distinguish RGB from CMYK.","At smaller scale, the same ground features occupy less page space.","These operators reduce or reorganize detail for a target scale.","Toponymy concerns geographic names, including their origin, usage and standardization."],"comparison":[],"relatedQuestionIds":[300,301,302,303,304,317,534,564,581],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"6.4","page":88,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0605","title":"Digital and Web Cartography","introduction":"Digital cartography separates stored landscape data from its symbolized presentation. Web services then deliver images, features or coverage values according to what the client needs.","objective":"Distinguish DLM, DCM, WMS, WFS and WCS.","concepts":[{"heading":"A Digital Landscape Model (DLM) is scale-independent and stores objects with geometry and attributes","body":"A DLM stores landscape objects and attributes independently of one specific symbolized map design. Its data still have finite resolution and accuracy; scale-independent does not mean infinitely detailed.","sourceQuestionId":305},{"heading":"A Digital Cartographic Model (DCM) is the symbolized graphic representation of the DLM for a specific map","body":"A DCM applies selection, generalization and symbolization for a particular map scale and purpose. It is the cartographic presentation derived from a landscape data model.","sourceQuestionId":306},{"heading":"WMS (Web Map Service) returns rendered map images","body":"WMS returns rendered map images for display. The image is not equivalent to downloading the original vector features or numerical coverage values.","sourceQuestionId":307},{"heading":"WFS (Web Feature Service) returns vector features","body":"WFS exposes feature geometries and attributes, enabling vector-data use beyond an image display. This distinguishes it from WMS rendering and WCS coverage access.","sourceQuestionId":308},{"heading":"WCS (Web Coverage Service) returns raster/coverage data with raw values","body":"WCS provides coverages and their values, such as an elevation grid, for analysis. A coloured map image alone may not retain those underlying numerical values.","sourceQuestionId":309},{"heading":"Dynamic visual variables include moment, duration, frequency, order, rate of change and synchronization","body":"Synchronization coordinates changes in multiple animated map elements or views. Along with duration, order and rate, it controls how time-dependent information is perceived.","sourceQuestionId":310}],"formulas":[],"workedExamples":[],"examTips":["Distinguish DLM, DCM, WMS, WFS and WCS."],"commonMistakes":["A rendered map image is not equivalent to the underlying numerical or vector dataset."],"quickRecap":["Distinguish DLM, DCM, WMS, WFS and WCS.","A DLM stores landscape objects and attributes independently of one specific symbolized map design.","A DCM applies selection, generalization and symbolization for a particular map scale and purpose.","WMS returns rendered map images for display."],"comparison":[],"relatedQuestionIds":[305,306,307,308,309,310,535,618],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"6.5","page":89,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0606","title":"Map Elements and Reproduction","introduction":"Map production combines clear marginal information with a suitable reproduction method. The title, legend, scale, coordinate reference and source let readers interpret the map correctly.","objective":"Identify essential map elements and explain offset printing.","concepts":[{"heading":"Map elements","body":"A title establishes subject and extent; a legend explains symbols; scale relates map and ground; coordinate-reference information supports positioning. Sources and dates help readers judge suitability and currency."},{"heading":"Reproduction checks","body":"Check line weight, label legibility and colour in the intended medium. A map designed for an illuminated screen may lose contrast when printed."},{"heading":"Lithography is a planographic (flat-bed) printing process based on water–ink repulsion","body":"Lithography uses areas on essentially the same plane that accept ink or water differently. It is planographic, unlike raised relief or recessed intaglio printing.","sourceQuestionId":311},{"heading":"In rotary offset printing, the inked image is transferred from plate to a rubber blanket and then to paper","body":"Offset printing first transfers the plate image to a rubber blanket and then to paper. The intermediate transfer is why it is called offset rather than direct plate-to-paper printing.","sourceQuestionId":312}],"formulas":[],"workedExamples":[],"examTips":["Identify essential map elements and explain offset printing."],"commonMistakes":["A resized numeric scale becomes wrong unless recalculated; a bar scale resizes with the map."],"quickRecap":["Identify essential map elements and explain offset printing.","A title establishes subject and extent; a legend explains symbols; scale relates map and ground; coordinate-reference information supports positioning.","Check line weight, label legibility and colour in the intended medium.","Lithography uses areas on essentially the same plane that accept ink or water differently."],"comparison":[],"relatedQuestionIds":[311,312],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"6.6","page":90,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}}]},{"moduleId":7,"code":"AGeE07","title":"Spatial Data Management and Spatial Data Infrastructure","overview":"Design reliable spatial databases using keys, constraints, geometry types and indexes, then understand how standards, metadata and governance enable an SDI.","learningObjectives":["Explain spatial extensions and the four ACID properties.","Explain metadata, interoperability and SDI components.","Explain data models, candidate keys and conceptual design.","Distinguish WHERE from HAVING and primary from foreign keys.","Explain SRID, spatial joins and bounding-box indexes.","Explain how a national geoportal connects data producers and users."],"sections":[{"code":"AGeE0701","title":"Fundamentals of SDBMS","introduction":"A spatial DBMS adds geometry, spatial operations and indexing to reliable database storage. Transactions and constraints keep related edits consistent even when multiple users or failures are involved.","objective":"Explain spatial extensions and the four ACID properties.","concepts":[{"heading":"A DBMS is software for defining, storing, querying and managing data","body":"A DBMS manages structured data and provides controlled operations for defining, storing, updating and querying it. It is software, not the dataset itself.","sourceQuestionId":321},{"heading":"An SDBMS is a DBMS extended to store and query spatial (geometric) data types","body":"Spatial extensions add geometry types, spatial predicates and indexing to database management. This lets the system ask location-based questions rather than treating coordinates as unrelated numbers.","sourceQuestionId":322},{"heading":"The ACID properties of database transactions include Atomicity, Consistency, Isolation and Durability","body":"Durability means a committed transaction survives subsequent failures under the database's guarantees. Atomicity handles all-or-nothing execution; isolation separates concurrent operations; consistency preserves declared rules.","sourceQuestionId":323}],"formulas":[],"workedExamples":[],"examTips":["Explain spatial extensions and the four ACID properties."],"commonMistakes":["Keeping coordinates in a table does not alone provide spatial indexing or correct spatial operations."],"quickRecap":["Explain spatial extensions and the four ACID properties.","A DBMS manages structured data and provides controlled operations for defining, storing, updating and querying it.","Spatial extensions add geometry types, spatial predicates and indexing to database management.","Durability means a committed transaction survives subsequent failures under the database's guarantees."],"comparison":[],"relatedQuestionIds":[321,322,323,537,539,541,584,585],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"7.1","page":95,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0702","title":"Spatial Data Infrastructure","introduction":"An SDI enables organizations to discover, understand and reuse geospatial information. Metadata and services work only when standards, licensing and institutional responsibilities are also clear.","objective":"Explain metadata, interoperability and SDI components.","concepts":[{"heading":"An SDI is the framework of technologies, policies, standards and institutional arrangements for sharing and using geospatial data","body":"An SDI combines governance, standards, people and technology so geospatial information can be found and reused. A server or dataset alone is not an infrastructure.","sourceQuestionId":334},{"heading":"Metadata is commonly described as data about data","body":"Metadata describes a dataset's meaning, coverage, reference system, quality, provenance and access conditions. It helps a user judge whether the data fit a purpose.","sourceQuestionId":335},{"heading":"The ISO standard commonly cited for geographic metadata is ISO 19115","body":"ISO 19115 defines geographic-information metadata concepts. Do not confuse the conceptual metadata standard with specific XML encoding implementations.","sourceQuestionId":336},{"heading":"Interoperability is the ability of different systems to exchange and use data","body":"Interoperability requires both exchanging information and interpreting/using it correctly. Moving a file is not enough if units, coordinate systems or meanings remain incompatible.","sourceQuestionId":337},{"heading":"A national SDI clearinghouse is typically implemented as a geoportal for discovery and access","body":"A geoportal provides discovery and access to datasets and services, often through metadata catalogues. It need not physically store every dataset it describes.","sourceQuestionId":345},{"heading":"CSW in an SDI context is a service for catalogue / metadata search","body":"Catalogue Service for the Web supports discovery through metadata queries. It identifies suitable resources rather than directly performing map rendering or spatial analysis.","sourceQuestionId":351},{"heading":"Accessibility of SDI data requires that datasets are discoverable, obtainable and legally accessible (licensed)","body":"A discoverable dataset may still have licence or access restrictions. Practical accessibility includes a lawful way to obtain and use it, not just knowing that it exists.","sourceQuestionId":352},{"heading":"Distinguishing the alternatives","body":"Ionospheric scintillation is a GNSS propagation phenomenon. SDI components concern data, metadata, standards, access technology, people and institutional coordination.","sourceQuestionId":355}],"formulas":[],"workedExamples":[],"examTips":["Explain metadata, interoperability and SDI components."],"commonMistakes":["Discoverable data are not necessarily downloadable or legally reusable."],"quickRecap":["Explain metadata, interoperability and SDI components.","An SDI combines governance, standards, people and technology so geospatial information can be found and reused.","Metadata describes a dataset's meaning, coverage, reference system, quality, provenance and access conditions.","ISO 19115 defines geographic-information metadata concepts."],"comparison":[],"relatedQuestionIds":[334,335,336,337,345,351,352,355,538],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"7.2","page":95,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0703","title":"Data Models","introduction":"A data model defines entities and relationships before implementation. Compare relational, hierarchical, network and object approaches, then use keys and conceptual diagrams to make relationships explicit.","objective":"Explain data models, candidate keys and conceptual design.","concepts":[{"heading":"The relational data model was proposed by E. F. Codd in 1970","body":"Codd's 1970 relational model organized information using relations rather than navigational storage links. This became the theoretical foundation of relational database systems.","sourceQuestionId":331},{"heading":"The hierarchical data model organizes data as a tree (parent–child)","body":"A hierarchical model arranges records in a parent–child tree. A child normally has one parent, unlike network models that can represent more complex links.","sourceQuestionId":332},{"heading":"An Entity–Relationship (E–R) model is used mainly at the conceptual design stage","body":"An ER model identifies entities, attributes and relationships before choosing physical storage details. It is therefore a conceptual database-design tool.","sourceQuestionId":333},{"heading":"UML class diagrams are widely used for object-oriented design of spatial databases","body":"UML class diagrams describe classes, attributes and relationships. They help express object-oriented conceptual schemas before implementing spatial database tables and constraints.","sourceQuestionId":346},{"heading":"A candidate key is any column, or set of columns, that could serve as a primary key","body":"A candidate key is a minimal set of attributes uniquely identifying a row. One is selected as the primary key; the other candidates remain possible unique identifiers.","sourceQuestionId":353},{"heading":"The network data model represents data as a graph (sets) allowing many-to-many links","body":"The network model allows records to participate in multiple linked sets, forming graph-like relationships. This is more flexible than a single-parent hierarchy.","sourceQuestionId":354}],"formulas":[],"workedExamples":[],"examTips":["Explain data models, candidate keys and conceptual design."],"commonMistakes":["A field used as an identifier must be reliably unique, not merely look distinctive in a small sample."],"quickRecap":["Explain data models, candidate keys and conceptual design.","Codd's 1970 relational model organized information using relations rather than navigational storage links.","A hierarchical model arranges records in a parent–child tree.","An ER model identifies entities, attributes and relationships before choosing physical storage details."],"comparison":[],"relatedQuestionIds":[331,332,333,346,353,354],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"7.3","page":96,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0704","title":"Structured Query Language","introduction":"SQL expresses queries and manages schema, data, access and transactions. Trace a query from row filtering to grouping and aggregate filtering, and use constraints to enforce valid records.","objective":"Distinguish WHERE from HAVING and primary from foreign keys.","concepts":[{"heading":"SQL is the standard access/query language of relational databases","body":"SQL provides declarative operations for relational data: users state what results they want rather than every access step. It also includes schema and transaction commands.","sourceQuestionId":324},{"heading":"CREATE TABLE is an example of a DDL statement","body":"CREATE TABLE defines database structure, so it is data definition language. Inserting rows changes the table's data rather than defining the table itself.","sourceQuestionId":325},{"heading":"SELECT is primarily a DQL statement","body":"SELECT retrieves results and is commonly classified as data query language. Some classifications include querying within DML, so the terminology depends on the convention used.","sourceQuestionId":326},{"heading":"GRANT and REVOKE belong to DCL","body":"GRANT gives privileges and REVOKE removes them. Because they control access rather than data values, they are grouped as data control language.","sourceQuestionId":327},{"heading":"COMMIT and ROLLBACK belong to TCL","body":"COMMIT makes a transaction permanent; ROLLBACK undoes uncommitted work. These manage transaction boundaries, so they are transaction control commands.","sourceQuestionId":328},{"heading":"A primary key uniquely identifies each row in a table","body":"A primary key uniquely identifies a row and cannot be null. It may consist of one column or several columns together.","sourceQuestionId":329},{"heading":"A foreign key enforces referential integrity between tables","body":"A foreign key requires referenced values to correspond to valid parent-table keys, subject to null rules. This prevents orphan references and enforces referential integrity.","sourceQuestionId":330},{"heading":"NOT NULL, UNIQUE, CHECK and DEFAULT are examples of database constraints","body":"NOT NULL, UNIQUE and CHECK constrain allowed data. DEFAULT supplies an initial value rather than validating one, so it is often discussed alongside constraints but is not a constraint in every SQL system.","sourceQuestionId":347},{"heading":"A composite key is a key composed of multiple columns","body":"A composite key uses the combination of multiple columns for uniqueness. Individual component values may repeat even though the complete combination cannot.","sourceQuestionId":348},{"heading":"Which SQL clause filters groups after aggregation?","body":"WHERE filters rows before grouping; HAVING filters aggregated groups. For example, HAVING COUNT(*) > 5 selects groups with more than five members.","sourceQuestionId":350}],"formulas":[],"workedExamples":[],"examTips":["Distinguish WHERE from HAVING and primary from foreign keys."],"commonMistakes":["DEFAULT supplies a value; it is not a substitute for a CHECK constraint validating that value."],"quickRecap":["Distinguish WHERE from HAVING and primary from foreign keys.","SQL provides declarative operations for relational data: users state what results they want rather than every access step.","CREATE TABLE defines database structure, so it is data definition language.","SELECT retrieves results and is commonly classified as data query language."],"comparison":[],"relatedQuestionIds":[324,325,326,327,328,329,330,347,348,350,540,613],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"7.4","page":97,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0705","title":"Spatial Database Technology","introduction":"Spatial databases combine geometric types, reference systems, indexes and exact predicates. Indexes reduce the search set, while spatial functions calculate or test the required relationship.","objective":"Explain SRID, spatial joins and bounding-box indexes.","concepts":[{"heading":"The OGC Simple Features model includes Point, LineString, Polygon and their Multi* (collection) types","body":"Simple Features includes basic geometries and collections such as MultiPoint, MultiLineString and MultiPolygon. These represent multiple components of the same broad geometry type.","sourceQuestionId":338},{"heading":"SRID in a spatial database encodes the spatial reference system","body":"An SRID identifies a spatial reference system known to the database. Assigning an SRID label does not itself transform coordinates into that system.","sourceQuestionId":339},{"heading":"A spatial join combines tables using a spatial predicate rather than an attribute key","body":"A spatial join links records through relationships such as within, intersects or nearest. An attribute join instead matches stored key values.","sourceQuestionId":340},{"heading":"The standard spatial index used in PostGIS (GiST) is the R-tree","body":"PostGIS commonly uses R-tree-style bounding-box indexing implemented through GiST. Bounding boxes narrow candidates; exact geometry tests can then refine the result.","sourceQuestionId":341},{"heading":"PostGIS is a spatial extension of the open-source RDBMS PostgreSQL","body":"PostGIS extends PostgreSQL with spatial types, indexes and functions. PostgreSQL supplies the relational database engine and transaction support.","sourceQuestionId":342},{"heading":"ST_Area, ST_Buffer and ST_Intersects are examples of PostGIS/OGC spatial functions","body":"These functions calculate area, construct distance zones and test intersection. They operate on geometries rather than only on scalar attributes like names or prices.","sourceQuestionId":343},{"heading":"An ORDBMS is a relational DBMS extended with object (user-defined types and functions) features","body":"Object-relational systems retain relational tables while supporting richer user-defined types and behaviour. This makes geometry types and associated operations natural database extensions.","sourceQuestionId":344}],"formulas":[],"workedExamples":[],"examTips":["Explain SRID, spatial joins and bounding-box indexes."],"commonMistakes":["A bounding-box candidate can still fail an exact geometry intersection test."],"quickRecap":["Explain SRID, spatial joins and bounding-box indexes.","Simple Features includes basic geometries and collections such as MultiPoint, MultiLineString and MultiPolygon.","An SRID identifies a spatial reference system known to the database.","A spatial join links records through relationships such as within, intersects or nearest."],"comparison":[],"relatedQuestionIds":[338,339,340,341,342,343,344,614],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"7.5","page":98,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}},{"code":"AGeE0706","title":"National Spatial Data Infrastructure","introduction":"A national SDI coordinates datasets and responsibilities across institutions. Common references, catalogue discovery, access arrangements and long-term maintenance make national information usable across projects.","objective":"Explain how a national geoportal connects data producers and users.","concepts":[{"heading":"National coordination","body":"An NSDI links data custodians through shared standards and agreements. Custodians retain responsibilities for accuracy and updates while a catalogue supports discovery across organizations."},{"heading":"Geoportal and metadata","body":"A geoportal gives users a route to datasets and services. Metadata should describe coverage, reference system, lineage, quality, responsible organization and conditions of use."},{"heading":"Sustainable maintenance","body":"Interoperability depends on both technical compatibility and shared meanings. Funding, skilled people and update responsibilities matter as much as the first release of a portal."}],"formulas":[],"workedExamples":[{"problem":"Four parcels of 508.72 m² each have a combined area of ? hectares.","given":"Four parcels of 508.72 m² each have a combined area of __________ hectares.","formula":"Use the relationship shown in the calculation.","calculation":"Total area = 4 × 508.72 = 2034.88 m². Since 1 ha = 10 000 m², the result is 0.203488 ha, approximately 0.2035 ha.","answer":"0.2035 ha"}],"examTips":["Explain how a national geoportal connects data producers and users."],"commonMistakes":["An NSDI is a coordinated framework, not a single map website or one central dataset."],"quickRecap":["Explain how a national geoportal connects data producers and users.","An NSDI links data custodians through shared standards and agreements.","A geoportal gives users a route to datasets and services.","Interoperability depends on both technical compatibility and shared meanings."],"comparison":[],"relatedQuestionIds":[349,604],"source":{"name":"NEC GEOMATICS_NOTE.pdf","section":"7.6","page":99,"method":"Teaching paraphrases and examples; aligned to the supplied syllabus and study-question key."}}]},{"moduleId":8,"code":"AGeE08","title":"Geographic Information System","overview":"Move from GIS data models and georeferencing to overlay, terrain analysis, hydrology and interpolation, with quality and lineage throughout.","learningObjectives":["Explain GIS components, georeferencing, topology and lineage.","Compare vector objects, raster fields and TIN terrain models.","Choose an overlay, buffer, transform or network method for a task.","Calculate slope and interpret aspect, viewshed and flow accumulation.","Interpret nugget, sill and range and explain interpolation assumptions.","Explain QGIS, GeoServer, service interfaces and layer styling."],"sections":[{"code":"AGeE0801","title":"GIS Fundamentals","introduction":"GIS joins location with attributes to answer spatial questions. Hardware and software support the workflow, but data quality, people and clear procedures determine whether the result is useful.","objective":"Explain GIS components, georeferencing, topology and lineage.","concepts":[{"heading":"A GIS is an integrated system of hardware, software, data, people and procedures (methods) for managing spatially referenced data","body":"Procedures specify how people collect, validate, manage and analyse data using GIS hardware and software. Technology alone does not produce a dependable information system.","sourceQuestionId":356},{"heading":"Among GIS components, data is generally considered the most valuable","body":"The supplied notes emphasize data because collecting and maintaining reliable geographic information is costly and central to results. This is a teaching emphasis, not a universal ranking above skilled people.","sourceQuestionId":357},{"heading":"The first true GIS is commonly identified as the 1960s Canada Geographic Information System (CGIS)","body":"CGIS was an early operational geographic information system developed for Canadian land inventory work. Its importance lies in computer-based storage and analysis, not simply digital map drawing.","sourceQuestionId":358},{"heading":"Georeferencing assigns real-world coordinates to spatial data","body":"Georeferencing ties an image or dataset to known real-world coordinates. It requires control and a coordinate reference system, rather than merely naming the file after a place.","sourceQuestionId":359},{"heading":"Shapefile, GeoJSON, KML and GeoPackage are examples of vector data formats","body":"These formats can store vector features such as points, lines and polygons. Some, particularly GeoPackage, can also contain other data types, so vector is not an exclusive capability claim.","sourceQuestionId":360},{"heading":"GeoTIFF is a widely used raster format","body":"GeoTIFF embeds geographic referencing information in TIFF raster imagery. Raster data represent a grid of cells, unlike separate vector feature geometries.","sourceQuestionId":361},{"heading":"Topology describes spatial relationships that are invariant under continuous deformation, namely connectivity, adjacency and containment","body":"Topology concerns relationships such as connection, shared boundaries and containment. These can remain unchanged when shapes stretch, unlike exact lengths or angles.","sourceQuestionId":362},{"heading":"Data quality elements include positional accuracy, attribute accuracy, logical consistency, completeness, temporal accuracy and lineage","body":"Lineage explains data origin and processing and supports quality assessment. Formal standards may organize lineage separately from measured quality elements, so this list is a study summary rather than a strict schema.","sourceQuestionId":394},{"heading":"Lineage of a GIS dataset documents its history of compilation and processing","body":"Lineage records sources, transformations, edits and processing history. This helps users trace errors and judge whether a dataset is suitable for a new application.","sourceQuestionId":395}],"formulas":[],"workedExamples":[],"examTips":["Explain GIS comp
