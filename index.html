lement powers delegated by an Act, while policies generally guide decisions rather than having the same legal status.","examTip":"Link this question to AGeE0406: Land Policies, Acts and Regulations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":209,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Policies, Acts and Regulations","chapterCode":"AGeE0406","topic":"Land Policies, Acts and Regulations","question":"In the legal hierarchy, a Policy is __________.","options":["a court judgment","superior to an Act","directional guidance, not directly enforceable like an Act","identical to a Regulation"],"correct":2,"explanation":"A policy sets direction and objectives. It should not be treated as equivalent to a directly enforceable Act; legal effect depends on applicable legislation and implementation instruments.","examTip":"Link this question to AGeE0406: Land Policies, Acts and Regulations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":210,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Policies, Acts and Regulations","chapterCode":"AGeE0406","topic":"Land Policies, Acts and Regulations","question":"The Land (Survey and Measurement) Act, which underpins cadastral surveying in Nepal, is dated __________.","options":["2019 BS (1962/63 AD)","2055 BS (1999 AD)","2021 BS (1964 AD)","2076 BS (2019 AD)"],"correct":0,"explanation":"The supplied syllabus notes identify the Land (Survey and Measurement) Act by 2019 BS. Treat the AD conversion as approximate and consult the authoritative amended text for legal use.","examTip":"Link this question to AGeE0406: Land Policies, Acts and Regulations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":211,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Policies, Acts and Regulations","chapterCode":"AGeE0406","topic":"Land Policies, Acts and Regulations","question":"The Land Use Act of Nepal that created the Land Use Council is dated __________.","options":["2019 BS","2076 BS (2019 AD)","2072 BS","2021 BS"],"correct":1,"explanation":"The supplied material dates the Land Use Act to 2076 BS (2019 AD). This is a historical identification question; current procedures and council powers require checking the amended legislation.","examTip":"Link this question to AGeE0406: Land Policies, Acts and Regulations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":212,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Policies, Acts and Regulations","chapterCode":"AGeE0406","topic":"Land Policies, Acts and Regulations","question":"The National Land Use Policy of Nepal is dated __________.","options":["2076 BS","2055 BS","2021 BS","2072 BS (2015 AD)"],"correct":3,"explanation":"The supplied notes identify National Land Use Policy as 2072 BS (2015 AD). Distinguish a policy date from the later Land Use Act's date.","examTip":"Link this question to AGeE0406: Land Policies, Acts and Regulations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":213,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Policies, Acts and Regulations","chapterCode":"AGeE0406","topic":"Land Policies, Acts and Regulations","question":"The National Land Policy of Nepal is dated __________.","options":["2019 BS","2072 BS","2021 BS","2075 BS (2019 AD)"],"correct":3,"explanation":"The supplied notes identify National Land Policy as 2075 BS, corresponding to the 2018/2019 period. This is separate from the 2072 land-use policy and 2076 land-use legislation.","examTip":"Link this question to AGeE0406: Land Policies, Acts and Regulations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":214,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Tenure and Land Registration","chapterCode":"AGeE0403","topic":"Land Tenure and Land Registration","question":"Tenure security is the degree of confidence that land rights will be __________ against eviction or challenge.","options":["surveyed only","ignored","recognized and protected","taxed only"],"correct":2,"explanation":"Tenure security means confidence that recognized land rights can be exercised and protected against arbitrary challenge. It is not simply possession of a map or the absence of all disputes.","examTip":"Link this question to AGeE0403: Land Tenure and Land Registration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":215,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Policies, Acts and Regulations","chapterCode":"AGeE0406","topic":"Land Policies, Acts and Regulations","question":"A 1:2500 cadastral map shows a line of 4.8 cm. The corresponding ground length is __________.","options":["12.0 km","120.0 m","1.20 km","12.0 m"],"correct":1,"explanation":"Ground distance = 4.8 cm × 2500 = 12 000 cm = 120 m. Convert units after applying the representative fraction.","examTip":"Link this question to AGeE0406: Land Policies, Acts and Regulations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":216,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Use and Land Valuation","chapterCode":"AGeE0405","topic":"Land Use and Land Valuation","question":"Using the coordinate method, a rectangle with vertices (0, 0), (30, 0), (30, 20) and (0, 20) has an area of __________.","options":["600 m²","50 m²","300 m²","1200 m²"],"correct":0,"explanation":"The vertices form a 30 m by 20 m rectangle, so area = 600 m². The shoelace coordinate formula gives the same result and applies to less regular polygons too.","examTip":"Link this question to AGeE0405: Land Use and Land Valuation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":217,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Tenure and Land Registration","chapterCode":"AGeE0403","topic":"Land Tenure and Land Registration","question":"Customary tenure is based primarily on __________.","options":["GNSS coordinates only","tradition and community recognition","company shares","Torrens title"],"correct":1,"explanation":"Customary tenure draws authority from community-recognized traditions and practices. It is conceptually distinct from rights created solely by an individual lease contract.","examTip":"Link this question to AGeE0403: Land Tenure and Land Registration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":218,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Tenure and Land Registration","chapterCode":"AGeE0403","topic":"Land Tenure and Land Registration","question":"Leasehold tenure means that rights are held __________.","options":["in perpetuity without conditions","only by the state","for a term under a lease","only by a guthi"],"correct":2,"explanation":"A lease grants specified rights for an agreed term, subject to its conditions. This limited duration distinguishes leasehold from an unrestricted permanent ownership interest.","examTip":"Link this question to AGeE0403: Land Tenure and Land Registration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":219,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Administration","chapterCode":"AGeE0402","topic":"Land Administration","question":"Good land governance requires transparency, accountability, equity and __________.","options":["participation","informal-only records","secrecy","absence of maps"],"correct":0,"explanation":"Participation brings affected people into land decisions, complementing transparency, accountability and equity. A technically accurate record alone does not ensure fair governance.","examTip":"Link this question to AGeE0402: Land Administration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":220,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Use and Land Valuation","chapterCode":"AGeE0405","topic":"Land Use and Land Valuation","question":"The income (capitalization) approach to valuation is based on __________.","options":["comparable sales only","replacement cost only","soil colour","the present worth of expected income"],"correct":3,"explanation":"An income-producing property is valued through the present worth of expected future net income. Future income must be discounted or capitalized rather than simply added without regard to time.","examTip":"Link this question to AGeE0405: Land Use and Land Valuation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":221,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"Cadastral sheet numbering in Nepal is tied to the district, municipality and __________.","options":["river basin","ward (formerly VDC)","contour interval","UTM zone only"],"correct":1,"explanation":"The supplied notes describe local administrative identifiers, including ward information, as part of cadastral sheet referencing. Check the actual map series: administrative restructuring can change naming and indexing.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":222,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"Digital cadastral surveying typically uses total station, GNSS and __________.","options":["plane table only","Gunter's chain only","UAV","magnetic compass only"],"correct":2,"explanation":"UAV imagery can contribute digital mapping alongside GNSS and total-station observations. It does not automatically establish legally accepted boundaries without control, validation and the required cadastral process.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":223,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"Completeness and currency of a cadastre mean that all parcels and rights are recorded and __________.","options":["kept up to date","kept secret","plotted without identifiers","never changed"],"correct":0,"explanation":"Completeness means recording the relevant parcels and rights; currency means maintaining them as changes occur. A complete but stale register fails the second requirement.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":224,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Administration","chapterCode":"AGeE0402","topic":"Land Administration","question":"Land tax (malpot) in Nepal is levied on the basis of land classification, grade and __________.","options":["building colour","magnetic declination","owner's age","area"],"correct":3,"explanation":"The supplied notes list area along with land classification and grade as taxation factors. Actual rates and assessment rules are jurisdiction- and date-dependent and require current verification.","examTip":"Link this question to AGeE0402: Land Administration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":225,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Administration","chapterCode":"AGeE0402","topic":"Land Administration","question":"A well-functioning cadastre supports the land market by reducing __________ and supporting mortgage credit.","options":["transaction risk","contour interval","flying height","DOP"],"correct":0,"explanation":"Clear parcel identity and rights reduce uncertainty in transactions and help assess security for mortgages. A cadastre supports trust but does not eliminate every financial or legal risk.","examTip":"Link this question to AGeE0402: Land Administration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":226,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Tenure and Land Registration","chapterCode":"AGeE0403","topic":"Land Tenure and Land Registration","question":"Systematic registration means first registration of __________ in an area.","options":["only state land","only buildings","all parcels","only disputed parcels"],"correct":2,"explanation":"Systematic first registration addresses all parcels in a defined area together. Sporadic registration proceeds case by case, usually in response to an individual application or transaction.","examTip":"Link this question to AGeE0403: Land Tenure and Land Registration.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":227,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Use and Land Valuation","chapterCode":"AGeE0405","topic":"Land Use and Land Valuation","question":"The cost approach to valuation estimates value from __________.","options":["political preference","map scale","comparable rents only","cost of replacement less depreciation"],"correct":3,"explanation":"The cost approach estimates an equivalent replacement and deducts depreciation for age, condition or obsolescence. Land value may be assessed separately rather than depreciated like a building.","examTip":"Link this question to AGeE0405: Land Use and Land Valuation.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":228,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Land Administration","chapterCode":"AGeE0402","topic":"Land Administration","question":"Which of the following is NOT a core UN/FIG land-administration function?","options":["Land use","Ionospheric modelling","Land tenure","Land value"],"correct":1,"explanation":"Ionospheric modelling corrects satellite signal propagation in GNSS. It is not one of the core land-administration functions of tenure, value, use and development.","examTip":"Link this question to AGeE0402: Land Administration.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":229,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"The linkage between the cadastral map and the textual register is achieved through the __________.","options":["flying height","magnetic meridian","parcel identifier","contour interval"],"correct":2,"explanation":"The parcel identifier acts like a database key shared by geometry and textual rights records. This preserves their relationship even when an owner's name or other attributes change.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":230,"module":"Cadastre, Land Use and Land Management","moduleCode":"AGeE04","moduleId":4,"chapter":"Introduction to Cadastre","chapterCode":"AGeE0401","topic":"Introduction to Cadastre","question":"Land conflicts over boundaries are best supported in resolution by evidence from the __________ and the registers.","options":["star almanac","cadastre","gravity anomaly map","weather forecast"],"correct":1,"explanation":"Cadastral maps, field records and registers supply boundary and rights evidence. They inform resolution alongside applicable procedures; a surveyor should not treat a map alone as an automatic legal judgment.","examTip":"Link this question to AGeE0401: Introduction to Cadastre.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":231,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"GNSS is a generic term covering GPS, GLONASS, Galileo and __________.","options":["BeiDou","Landsat","SPOT","INSAT"],"correct":0,"explanation":"GNSS is the umbrella term; GPS is one constellation within it. BeiDou joins GPS, GLONASS and Galileo among global satellite navigation systems.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":232,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"Absolute GNSS positioning requires at least __________ satellites to solve for three-dimensional position and receiver clock offset.","options":["six","three","five","four"],"correct":3,"explanation":"The usual standalone solution has four unknowns: X, Y, Z and receiver clock offset. At least four independent satellite pseudoranges are therefore needed, assuming suitable geometry.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":233,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"GPS satellites orbit at an altitude of approximately __________.","options":["384 000 km","36 000 km","20 200 km","780 km"],"correct":2,"explanation":"GPS uses medium Earth orbit at roughly 20 200 km above Earth. This altitude must not be confused with distance from Earth's centre, which includes Earth's radius.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":234,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"The GPS L1 carrier frequency is __________.","options":["1227.60 MHz","2491.75 MHz","1176.45 MHz","1575.42 MHz"],"correct":3,"explanation":"GPS L1 is 1575.42 MHz. Frequency identifies the carrier band; it is not the chip rate or the satellite's orbital frequency.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":235,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"The wavelength of the GPS L1 carrier is approximately __________.","options":["24.4 cm","19.0 cm","86.2 cm","10.7 cm"],"correct":1,"explanation":"Wavelength = c/f ≈ 299 792 458/(1575.42 × 10⁶) ≈ 0.1903 m, or 19.0 cm. Higher frequencies have shorter wavelengths.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":236,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"The GNSS observable based on the travel time of a coded signal is called __________.","options":["pseudorange","Doppler shift","ambiguity","carrier phase"],"correct":0,"explanation":"Code travel time multiplied by light speed gives pseudorange. It is only a pseudo range because clocks, atmosphere and other effects contaminate the geometric distance.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":237,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"In the carrier-phase observation equation, N denotes the __________.","options":["number of satellites","integer ambiguity","refractive index","geoid undulation"],"correct":1,"explanation":"Carrier tracking measures fractional phase but initially cannot count all complete cycles between satellite and receiver. The unknown whole-cycle count is the integer ambiguity N.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":238,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"The ionospheric term is __________ for the code observable and __________ for the carrier-phase observable.","options":["positive; negative","zero; zero","negative; positive","positive; positive"],"correct":0,"explanation":"The ionosphere delays code group propagation but advances carrier phase relative to vacuum. Thus the first-order ionospheric terms have opposite signs in the two range-form equations.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":239,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"Ionospheric delay is approximately proportional to __________.","options":["1/f","f","f²","1/f²"],"correct":3,"explanation":"First-order ionospheric range delay depends on electron content and varies approximately as 1/f². This frequency dependence makes dual-frequency correction possible.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":240,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"GNSS signals are __________ polarized.","options":["left-hand circularly","linearly","right-hand circularly (RHCP)","randomly"],"correct":2,"explanation":"GNSS signals use right-hand circular polarization to reduce sensitivity to antenna orientation. Reflections can alter polarization, which helps explain some antenna-based multipath rejection.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":241,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"Single differencing between two receivers observing the same satellite removes the __________ error.","options":["multipath","satellite clock","receiver clock","antenna phase-centre"],"correct":1,"explanation":"Subtracting simultaneous observations of the same satellite at two receivers cancels the common satellite-clock term. Receiver clocks remain until another difference is formed.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":242,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"Double differencing removes both receiver and satellite __________ errors.","options":["clock","tidal","multipath","antenna"],"correct":0,"explanation":"A double difference combines receiver and satellite differencing, cancelling both clock terms. Atmospheric residuals, measurement noise and local multipath do not all disappear.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":243,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"Triple differencing is particularly useful for __________.","options":["absolute point positioning only","ionosphere-free combination","cycle-slip detection","almanac decoding"],"correct":2,"explanation":"Taking a further difference across epochs removes unchanged ambiguities. A discontinuity then helps detect cycle slips, although extra differencing also increases observation noise.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":244,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"The wide-lane combination has a wavelength of about __________ and therefore eases ambiguity resolution.","options":["24.4 cm","19.0 cm","10.7 cm","86.2 cm"],"correct":3,"explanation":"For GPS L1/L2, wide-lane wavelength c/(f1 − f2) is about 0.862 m. Its longer cycles make resolving the integer count easier than on either original carrier alone.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":245,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"The ionosphere-free linear combination is used mainly to remove __________.","options":["multipath","tropospheric delay","first-order ionospheric delay","satellite clock error"],"correct":2,"explanation":"A frequency-weighted combination exploits the 1/f² dependence to cancel first-order ionospheric delay. It does not eliminate all atmospheric error and generally amplifies measurement noise.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":246,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"Tropospheric delay is __________ and is therefore not removed by dual-frequency combinations.","options":["dispersive","zero at the horizon","inversely proportional to f²","non-dispersive"],"correct":3,"explanation":"At GNSS frequencies the neutral atmosphere is effectively non-dispersive. Its delay cannot be separated simply by using two carrier frequencies, so modelling or estimation is required.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":247,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"Multipath error is site-dependent and generally __________ by differencing between stations.","options":["doubled","cannot be removed","completely removed","converted to clock error"],"correct":1,"explanation":"Multipath depends on reflectors near each antenna and is not generally common between stations. Differencing cannot cancel an error that differs independently at the two sites.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":248,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"Dilution of Precision (DOP) describes the effect of __________ on positioning accuracy.","options":["satellite geometry","antenna colour","ionospheric storms only","map projection"],"correct":0,"explanation":"DOP describes how satellite geometry amplifies range uncertainty into position or time uncertainty. Widely distributed satellites generally provide stronger geometry than a tight cluster.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":249,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"The relationship among the DOP factors is PDOP² = __________.","options":["GDOP² − HDOP²","GDOP² + TDOP²","HDOP² − VDOP²","HDOP² + VDOP²"],"correct":3,"explanation":"PDOP combines the three spatial components. Since HDOP already combines the two horizontal components, PDOP² = HDOP² + VDOP² rather than their unsquared sum.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":250,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"GDOP² is equal to __________.","options":["HDOP² + VDOP²","PDOP² − TDOP²","PDOP² + TDOP²","HDOP × VDOP"],"correct":2,"explanation":"GDOP includes position and receiver-time uncertainty. Their squared contributions combine as GDOP² = PDOP² + TDOP².","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":251,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"If HDOP = 1.5 and VDOP = 2.0, then PDOP is __________.","options":["6.25","2.5","3.5","0.5"],"correct":1,"explanation":"PDOP = √(1.5² + 2.0²) = √6.25 = 2.5. DOP values are dimensionless geometry factors.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":252,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"If PDOP = 2.5 and TDOP = 1.0, then GDOP is approximately __________.","options":["2.7","6.25","1.5","3.5"],"correct":0,"explanation":"GDOP = √(2.5² + 1.0²) = √7.25 ≈ 2.693, rounded to 2.7. Add squares before taking the square root.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":253,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"In general, VDOP is __________ HDOP, so vertical GNSS accuracy is weaker than horizontal accuracy.","options":["equal to","unrelated to","larger than","smaller than"],"correct":2,"explanation":"Ground receivers see satellites mainly above the horizon, giving weaker vertical geometry than a surrounding horizontal distribution. VDOP is therefore commonly larger, though the exact ratio varies.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":254,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"Position error may be estimated as __________.","options":["DOP × UERE","DOP + UERE","UERE − DOP","DOP / UERE"],"correct":0,"explanation":"The simplified estimate multiplies a geometry factor by user-equivalent range error. DOP is dimensionless and UERE is in metres, so the estimated position error is also in metres.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":255,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"If UERE = 5 m and HDOP = 1.2, the estimated horizontal accuracy is __________.","options":["4.2 m","3.8 m","6.2 m","6.0 m"],"correct":3,"explanation":"Estimated horizontal error = HDOP × UERE = 1.2 × 5 = 6.0 m. This is a simplified uncertainty estimate, not a guaranteed bound.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":256,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"A good GNSS survey plan typically aims to keep PDOP below about __________.","options":["50","4–6","0.5","20"],"correct":1,"explanation":"The notes suggest PDOP below roughly 4–6 as a planning guideline. Actual acceptance thresholds depend on survey specifications, observation quality and the required confidence level.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":257,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Static and Kinematic Positioning","chapterCode":"AGeE0505","topic":"Static and Kinematic Positioning","question":"Static GNSS positioning with ambiguity resolution typically achieves __________ accuracy on baselines.","options":["degree","kilometre","metre","millimetre to centimetre"],"correct":3,"explanation":"Resolved carrier-phase ambiguities and adequate observing conditions enable millimetre-to-centimetre baseline precision. This is a technique capability, not a guarantee for every baseline or environment.","examTip":"Link this question to AGeE0505: Static and Kinematic Positioning.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":258,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Static and Kinematic Positioning","chapterCode":"AGeE0505","topic":"Static and Kinematic Positioning","question":"Rapid static GNSS typically uses occupation times of about __________.","options":["5–20 minutes","1–2 seconds","1–2 days","1 month"],"correct":0,"explanation":"The notes give about 5–20 minutes for rapid-static occupations under suitable conditions. Baseline length, visibility, receiver capability and specifications can require longer observations.","examTip":"Link this question to AGeE0505: Static and Kinematic Positioning.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":259,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Static and Kinematic Positioning","chapterCode":"AGeE0505","topic":"Static and Kinematic Positioning","question":"Real-Time Kinematic (RTK) positioning provides centimetre-level positions __________.","options":["without any base station","only after office post-processing","in real time","using code observables only"],"correct":2,"explanation":"RTK uses carrier-phase observations with reference corrections to solve precise positions while the survey is underway. A reliable fixed ambiguity solution and communication link are essential.","examTip":"Link this question to AGeE0505: Static and Kinematic Positioning.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":260,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Static and Kinematic Positioning","chapterCode":"AGeE0505","topic":"Static and Kinematic Positioning","question":"CORS are __________.","options":["airborne cameras","Continuously Operating Reference Stations","contour overlay raster systems","cadastral office registers"],"correct":1,"explanation":"CORS continuously collect reference GNSS observations. They support post-processing and, where provided, real-time correction services for survey users.","examTip":"Link this question to AGeE0505: Static and Kinematic Positioning.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":261,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Static and Kinematic Positioning","chapterCode":"AGeE0505","topic":"Static and Kinematic Positioning","question":"Network RTK techniques include VRS, MAC and __________.","options":["FKP","SIFT","NDVI","TIN"],"correct":0,"explanation":"FKP models spatially varying correction parameters across a reference network. It is one network-RTK approach, alongside virtual reference stations and master–auxiliary concepts.","examTip":"Link this question to AGeE0505: Static and Kinematic Positioning.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":262,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Static and Kinematic Positioning","chapterCode":"AGeE0505","topic":"Static and Kinematic Positioning","question":"Precise Point Positioning (PPP) uses precise orbits and clocks to achieve __________ accuracy with a single receiver.","options":["degree","10–20 m","centimetre to decimetre","kilometre"],"correct":2,"explanation":"PPP uses precise satellite products and a detailed observation model without requiring a nearby user base receiver. High precision depends on convergence, corrections, equipment and observing conditions.","examTip":"Link this question to AGeE0505: Static and Kinematic Positioning.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":263,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Static and Kinematic Positioning","chapterCode":"AGeE0505","topic":"Static and Kinematic Positioning","question":"Typical stand-alone code (absolute) GNSS accuracy is of the order of __________.","options":["millimetres","1–10 m","100–200 m","kilometres"],"correct":1,"explanation":"Standalone code positioning is generally metre-level because clock, atmosphere, orbit and measurement errors remain. Differential and carrier-phase methods are used when finer survey accuracy is required.","examTip":"Link this question to AGeE0505: Static and Kinematic Positioning.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":264,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Inertial Navigation System","chapterCode":"AGeE0506","topic":"Inertial Navigation System","question":"An INS determines position by integrating measurements of specific force and __________.","options":["air pressure only","water depth","magnetic declination","angular rate"],"correct":3,"explanation":"Accelerometers measure specific force and gyroscopes measure angular rate. INS integrates these with orientation and gravity modelling to propagate velocity and position.","examTip":"Link this question to AGeE0506: Inertial Navigation System.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":265,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Inertial Navigation System","chapterCode":"AGeE0506","topic":"Inertial Navigation System","question":"Standalone INS position error grows with time approximately as __________ because of accelerometer bias.","options":["a constant","t","1/t","t²"],"correct":3,"explanation":"A constant accelerometer bias b integrates to velocity error bt and position error approximately bt²/2. This quadratic example explains why unaided inertial navigation drifts.","examTip":"Link this question to AGeE0506: Inertial Navigation System.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":266,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Inertial Navigation System","chapterCode":"AGeE0506","topic":"Inertial Navigation System","question":"The Kalman filter is a recursive estimator used to fuse INS with __________.","options":["only barometers","aiding sensors such as GNSS","cadastral registers","only magnetic compasses"],"correct":1,"explanation":"A Kalman filter recursively predicts state and corrects it with new measurements. GNSS can constrain inertial drift while INS bridges short GNSS interruptions.","examTip":"Link this question to AGeE0506: Inertial Navigation System.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":267,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Inertial Navigation System","chapterCode":"AGeE0506","topic":"Inertial Navigation System","question":"In loosely coupled GNSS/INS integration, the filter is updated with GNSS __________.","options":["position and velocity","almanac only","ionospheric maps only","raw pseudoranges only"],"correct":0,"explanation":"Loosely coupled integration takes a GNSS receiver's computed position and velocity as filter inputs. It does not directly combine each raw satellite range in the central filter.","examTip":"Link this question to AGeE0506: Inertial Navigation System.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":268,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Inertial Navigation System","chapterCode":"AGeE0506","topic":"Inertial Navigation System","question":"Tightly coupled integration updates the filter with raw GNSS __________.","options":["cadastral identifiers","map tiles","pseudoranges and/or carrier phases","NMEA positions only"],"correct":2,"explanation":"Tightly coupled integration processes individual GNSS observables with inertial measurements in a shared estimator. This can retain useful partial-satellite information when a standalone GNSS solution is unavailable.","examTip":"Link this question to AGeE0506: Inertial Navigation System.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":269,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Fundamentals and Principles","chapterCode":"AGeE0501","topic":"GNSS Fundamentals and Principles","question":"The antenna phase centre is the effective point of __________ and must be calibrated for precise work.","options":["map projection","signal reception","signal transmission from the satellite only","gravity measurement"],"correct":1,"explanation":"The effective phase reception point can differ from the antenna's physical reference mark and vary with signal direction. Calibration and correct antenna-height measurement matter for precise positioning.","examTip":"Link this question to AGeE0501: GNSS Fundamentals and Principles.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":270,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Mathematical Models","chapterCode":"AGeE0502","topic":"GNSS Mathematical Models","question":"Broadcast GNSS orbits are described by __________ elements plus perturbation corrections.","options":["four DOP","three Cartesian","seven Helmert","six Keplerian"],"correct":3,"explanation":"A Keplerian orbit is described by six parameters for size, shape and orientation/phase. Broadcast navigation models supplement them with corrections for departures from ideal two-body motion.","examTip":"Link this question to AGeE0502: GNSS Mathematical Models.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":271,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"RINEX is a standard format for __________.","options":["GNSS observation and navigation data","map printing","gravity reduction","cadastral mutation"],"correct":0,"explanation":"RINEX exchanges GNSS observation and navigation data independently of receiver manufacturer. It is an exchange format, not a correction algorithm or a coordinate reference system.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":272,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"A 10 km baseline measured with a specification of 3 mm + 0.5 ppm has an expected accuracy of __________.","options":["50.0 mm","5.0 mm","8.0 mm","3.0 mm"],"correct":2,"explanation":"0.5 ppm of 10 km = 0.5 × 10⁻⁶ × 10 000 m = 5 mm. Add the 3 mm constant term to obtain 8 mm under the stated specification.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":273,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"A cycle slip in carrier-phase tracking is a sudden integer jump in __________.","options":["the DOP","the pseudorange code","the almanac","the carrier-phase ambiguity"],"correct":3,"explanation":"Loss of uninterrupted carrier tracking can change the whole-cycle count abruptly. This cycle slip must be detected and the ambiguity repaired or reinitialized before precise processing continues.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":274,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"The elevation mask angle in GNSS surveying is commonly set at about __________.","options":["45°","10°–15°","0°","85°"],"correct":1,"explanation":"Low-elevation signals travel through more atmosphere and often suffer stronger multipath. A 10°–15° mask is a common notes-based compromise, not a universal setting.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":275,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"Quality control (QC) in a GNSS survey includes computed indicators such as loop closures and __________.","options":["sheet number only","map colour","ambiguity-resolution success and residuals","political approval"],"correct":2,"explanation":"Residuals, ambiguity quality and independent closures help reveal inconsistent observations or false fixes. A small reported coordinate standard deviation alone is not complete quality control.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":276,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Static and Kinematic Positioning","chapterCode":"AGeE0505","topic":"Static and Kinematic Positioning","question":"DGPS (code differential) typically improves absolute code accuracy to about __________.","options":["0.5–2 m","100 m","1–2 mm","10–20 m"],"correct":0,"explanation":"Code differential positioning removes some common reference/rover errors, often improving accuracy to roughly metre level. It is generally less precise than fixed carrier-phase RTK.","examTip":"Link this question to AGeE0505: Static and Kinematic Positioning.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":277,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Static and Kinematic Positioning","chapterCode":"AGeE0505","topic":"Static and Kinematic Positioning","question":"Stop-and-go GNSS is a kinematic variant in which the rover __________ at each surveyed point.","options":["stops briefly","is switched off","occupies for many hours","never stops"],"correct":0,"explanation":"In stop-and-go surveying the rover pauses briefly at points while maintaining tracking between them. Continuous ambiguity tracking avoids a new full initialization at every point.","examTip":"Link this question to AGeE0505: Static and Kinematic Positioning.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":278,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Signals and Processing","chapterCode":"AGeE0503","topic":"GNSS Signals and Processing","question":"Which of the following errors is NOT cancelled by double differencing on a short baseline?","options":["Receiver clock","Common atmospheric delay (approximately)","Multipath","Satellite clock"],"correct":2,"explanation":"Double differencing cancels shared clock terms, not local reflected-signal paths. Multipath at each antenna therefore remains an important error source even on short baselines.","examTip":"Link this question to AGeE0503: GNSS Signals and Processing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":279,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"GNSS Mathematical Models","chapterCode":"AGeE0502","topic":"GNSS Mathematical Models","question":"The geometric range from a receiver at (X, Y, Z) to satellite i is __________.","options":["the scalar product of the two position vectors","the sum of the two position vectors","the ratio of the two position vectors","the Euclidean distance between the two positions"],"correct":3,"explanation":"Geometric range is √[(Xi − X)² + (Yi − Y)² + (Zi − Z)²], with positions in a consistent frame and epoch. Pseudorange additionally contains clock and propagation effects.","examTip":"Link this question to AGeE0502: GNSS Mathematical Models.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":280,"module":"Global Navigation Satellite System (GNSS)","moduleCode":"AGeE05","moduleId":5,"chapter":"Satellite Geometry and DOP","chapterCode":"AGeE0504","topic":"Satellite Geometry and DOP","question":"If HDOP = 2.0 and the user-equivalent range error is 4.0 m, the estimated horizontal error is __________.","options":["2.0 m","8.0 m","6.0 m","4.0 m"],"correct":1,"explanation":"Use the simplified horizontal-error estimate HDOP × UERE = 2.0 × 4.0 m = 8.0 m. Better geometry lowers this amplification but does not remove range errors.","examTip":"Link this question to AGeE0504: Satellite Geometry and DOP.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":281,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Cartography and Visualization Fundamentals","chapterCode":"AGeE0601","topic":"Cartography and Visualization Fundamentals","question":"Cartography is the art, science and technology of making and studying __________.","options":["gravity models","satellite clocks","legal deeds","maps"],"correct":3,"explanation":"Cartography combines scientific representation with design and production of maps. Its goal is to communicate spatial relationships, not merely to collect raw coordinates.","examTip":"Link this question to AGeE0601: Cartography and Visualization Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":282,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Cartography and Visualization Fundamentals","chapterCode":"AGeE0601","topic":"Cartography and Visualization Fundamentals","question":"A large-scale map is generally considered to have a scale larger than about __________.","options":["1:250 000","1:25 000","1:10 000 000","1:1 000 000"],"correct":1,"explanation":"The notes use about 1:25 000 as a teaching boundary for large scale. Such classifications vary; the general rule is that a smaller denominator means a larger scale.","examTip":"Link this question to AGeE0601: Cartography and Visualization Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":283,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"A conformal (orthomorphic) projection preserves local __________.","options":["angles (shapes)","all directions from every point","areas","all distances"],"correct":0,"explanation":"Conformal projections preserve local angles and infinitesimal shapes. They do not preserve area everywhere or necessarily the shape of very large regions.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":284,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"An equal-area (equivalent) projection preserves __________.","options":["all distances","local angles","areas","rhumb lines as straight lines"],"correct":2,"explanation":"Equal-area projections retain relative and total areas, making them useful for area comparison. They must distort some angles or shapes because the curved surface cannot be flattened perfectly.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":285,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"A map cannot be both conformal and equal-area because the ellipsoid cannot be flattened without __________.","options":["distortion","a legend","a north arrow","ink"],"correct":0,"explanation":"A curved ellipsoid and a plane have different intrinsic geometry. No flat map can preserve all local angles and areas everywhere, so projection selection involves choosing which distortions to control.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":286,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"Tissot's indicatrix visualizes distortion by showing how infinitesimal circles become __________.","options":["points","triangles","ellipses","squares"],"correct":2,"explanation":"Tissot's indicatrix maps a tiny circle to an ellipse. Its size, axis lengths and orientation reveal local area, scale and angular distortion.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":287,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"The UTM projection uses a central-meridian scale factor k₀ of __________.","options":["1.0000","0.9996","0.9999","0.9990"],"correct":1,"explanation":"UTM uses k0 = 0.9996 at its central meridian to balance distortion across the zone. This is not Nepal MUTM's different central-meridian factor.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":288,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"UTM zones are __________ wide in longitude.","options":["8°","15°","3°","6°"],"correct":3,"explanation":"Standard UTM divides longitude into 60 zones of 6° each. Zone boundaries and special exceptions must be handled when locating a real dataset.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":289,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"Nepal's MUTM projection uses __________ zones.","options":["6°","1°","8°","3°"],"correct":3,"explanation":"The supplied Nepal MUTM notes use narrower 3° zones. Narrower zones limit distance from the central meridian and thus help control transverse-Mercator distortion.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":290,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"The Mercator projection is conformal and represents __________ as straight lines, making it useful for navigation.","options":["great circles","geodesics on the ellipsoid","rhumb lines","contour lines"],"correct":2,"explanation":"Mercator depicts constant-bearing rhumb lines as straight lines. These are useful for navigation but generally are not the shortest great-circle routes.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":291,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"For a large east–west region, a suitable conformal projection is generally the __________.","options":["stereographic only","Lambert Conformal Conic","Transverse Mercator","gnomonic"],"correct":1,"explanation":"A Lambert conformal conic projection can control distortion over mid-latitude regions extending east–west by selecting suitable standard parallels. Projection choice still depends on location and purpose.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":292,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"For a large north–south region, a suitable projection is generally the __________.","options":["Transverse Mercator","Lambert Conformal Conic","Albers only","Bonne"],"correct":0,"explanation":"Transverse Mercator centres its low-distortion region along a meridian. This suits a north–south extent better than an ordinary equatorial Mercator layout in many mapping situations.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":293,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"Nepal's national topographic base maps are published mainly at scales of __________.","options":["1:10 000 000","1:25 000 and 1:50 000","1:500 and 1:1000","1:250 000 and 1:1 000 000"],"correct":1,"explanation":"The supplied materials identify 1:25 000 and 1:50 000 as principal Nepal topographic base-map scales. A specific sheet's marginal information is the authority for its actual scale.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":294,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"If a map is reduced from 1:50 000 to 1:250 000, the plotted map area changes by a factor of __________.","options":["25","5","1/5","1/25"],"correct":3,"explanation":"The linear reduction is 50 000/250 000 = 1/5. Area changes by its square, (1/5)² = 1/25, not by the linear factor alone.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":295,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"A road measures 6.5 cm on a 1:25 000 map. Its ground length is __________.","options":["162.5 m","162.5 km","1.625 km","16.25 km"],"correct":2,"explanation":"6.5 cm × 25 000 = 162 500 cm = 1625 m = 1.625 km. Keep the map and ground units consistent before converting.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":296,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Cartographic Visualization","chapterCode":"AGeE0603","topic":"Cartographic Visualization","question":"Bertin's visual variables include position, size, shape, hue, value, texture and __________.","options":["orientation","datum","ellipsoid","DOP"],"correct":0,"explanation":"Orientation distinguishes symbols by their direction, alongside position, size, shape, hue, value and texture. Different variables suit categorical and ordered information differently.","examTip":"Link this question to AGeE0603: Cartographic Visualization.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":297,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Cartographic Visualization","chapterCode":"AGeE0603","topic":"Cartographic Visualization","question":"A nominal measurement scale consists of __________ without order.","options":["ratios","elevations","temperatures","categories"],"correct":3,"explanation":"Nominal categories such as forest, water and settlement have no inherent ranking. Assigning numbers to them does not make arithmetic averages meaningful.","examTip":"Link this question to AGeE0603: Cartographic Visualization.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":298,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Cartographic Visualization","chapterCode":"AGeE0603","topic":"Cartographic Visualization","question":"Elevation above a datum is an example of a __________ scale of measurement.","options":["nominal","ratio","ordinal","interval"],"correct":3,"explanation":"Elevation relative to an adopted datum has an arbitrary zero, so it is an interval scale: differences are meaningful, but 200 m is not inherently twice as high as 100 m above every datum. Physical length with a true zero is ratio-scale.","examTip":"Link this question to AGeE0603: Cartographic Visualization.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":299,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Cartographic Visualization","chapterCode":"AGeE0603","topic":"Cartographic Visualization","question":"Jenks natural-breaks classification minimizes __________ variance.","options":["within-class","between-class","radiometric","temporal"],"correct":0,"explanation":"Jenks natural breaks seeks compact groups by reducing variation within each class and separating classes. Unlike quantiles, it does not require equal numbers of observations per class.","examTip":"Link this question to AGeE0603: Cartographic Visualization.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":300,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Generalization, Typography and Colour","chapterCode":"AGeE0604","topic":"Generalization, Typography and Colour","question":"Cartographic generalization is required when map scale becomes __________ so that remaining detail stays legible.","options":["larger","infinite","smaller","unchanged"],"correct":2,"explanation":"At smaller scale, the same ground features occupy less page space. Generalization selects and simplifies detail so symbols remain distinguishable and important relationships survive.","examTip":"Link this question to AGeE0604: Generalization, Typography and Colour.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":301,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Generalization, Typography and Colour","chapterCode":"AGeE0604","topic":"Generalization, Typography and Colour","question":"Selection, simplification, smoothing, aggregation and displacement are __________ operators.","options":["geodetic","GNSS","gravity","generalization"],"correct":3,"explanation":"These operators reduce or reorganize detail for a target scale. Displacement moves conflicting symbols for legibility; simplification reduces vertices; aggregation combines related features.","examTip":"Link this question to AGeE0604: Generalization, Typography and Colour.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":302,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Generalization, Typography and Colour","chapterCode":"AGeE0604","topic":"Generalization, Typography and Colour","question":"Toponymy is the study and standardization of __________.","options":["place names","map colours","typeface sizes only","contour intervals"],"correct":0,"explanation":"Toponymy concerns geographic names, including their origin, usage and standardization. Consistent place names support clear communication and reliable map interpretation.","examTip":"Link this question to AGeE0604: Generalization, Typography and Colour.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":303,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Generalization, Typography and Colour","chapterCode":"AGeE0604","topic":"Generalization, Typography and Colour","question":"RGB is an __________ colour model used for screens.","options":["subtractive","additive","conformal","isometric"],"correct":1,"explanation":"Screens emit red, green and blue light. Adding the channels moves toward white, so RGB is additive rather than an ink-mixing system.","examTip":"Link this question to AGeE0604: Generalization, Typography and Colour.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":304,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Generalization, Typography and Colour","chapterCode":"AGeE0604","topic":"Generalization, Typography and Colour","question":"CMYK is a __________ colour model used for printing.","options":["celestial","magnetic","subtractive","additive"],"correct":2,"explanation":"Printing inks absorb parts of incident light. Cyan, magenta, yellow and black therefore form a subtractive model; combining inks reduces reflected light.","examTip":"Link this question to AGeE0604: Generalization, Typography and Colour.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":305,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Digital and Web Cartography","chapterCode":"AGeE0605","topic":"Digital and Web Cartography","question":"A Digital Landscape Model (DLM) is __________ and stores objects with geometry and attributes.","options":["scale-specific","scale-independent","a colour proof","a printed map"],"correct":1,"explanation":"A DLM stores landscape objects and attributes independently of one specific symbolized map design. Its data still have finite resolution and accuracy; scale-independent does not mean infinitely detailed.","examTip":"Link this question to AGeE0605: Digital and Web Cartography.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":306,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Digital and Web Cartography","chapterCode":"AGeE0605","topic":"Digital and Web Cartography","question":"A Digital Cartographic Model (DCM) is the __________ representation of the DLM for a specific map.","options":["raw GNSS","gravity","symbolized graphic","legal deed"],"correct":2,"explanation":"A DCM applies selection, generalization and symbolization for a particular map scale and purpose. It is the cartographic presentation derived from a landscape data model.","examTip":"Link this question to AGeE0605: Digital and Web Cartography.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":307,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Digital and Web Cartography","chapterCode":"AGeE0605","topic":"Digital and Web Cartography","question":"WMS (Web Map Service) returns __________.","options":["rendered map images","raw vector features","raw raster coverages","cadastral deeds"],"correct":0,"explanation":"WMS returns rendered map images for display. The image is not equivalent to downloading the original vector features or numerical coverage values.","examTip":"Link this question to AGeE0605: Digital and Web Cartography.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":308,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Digital and Web Cartography","chapterCode":"AGeE0605","topic":"Digital and Web Cartography","question":"WFS (Web Feature Service) returns __________.","options":["printed plates","rendered images only","gravity anomalies","vector features"],"correct":3,"explanation":"WFS exposes feature geometries and attributes, enabling vector-data use beyond an image display. This distinguishes it from WMS rendering and WCS coverage access.","examTip":"Link this question to AGeE0605: Digital and Web Cartography.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":309,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Digital and Web Cartography","chapterCode":"AGeE0605","topic":"Digital and Web Cartography","question":"WCS (Web Coverage Service) returns __________.","options":["map images only","raster/coverage data with raw values","vector features only","place-name gazetteers"],"correct":1,"explanation":"WCS provides coverages and their values, such as an elevation grid, for analysis. A coloured map image alone may not retain those underlying numerical values.","examTip":"Link this question to AGeE0605: Digital and Web Cartography.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":310,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Digital and Web Cartography","chapterCode":"AGeE0605","topic":"Digital and Web Cartography","question":"Dynamic visual variables include moment, duration, frequency, order, rate of change and __________.","options":["ellipsoid","hue only","datum","synchronization"],"correct":3,"explanation":"Synchronization coordinates changes in multiple animated map elements or views. Along with duration, order and rate, it controls how time-dependent information is perceived.","examTip":"Link this question to AGeE0605: Digital and Web Cartography.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":311,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Elements and Reproduction","chapterCode":"AGeE0606","topic":"Map Elements and Reproduction","question":"Lithography is a __________ printing process based on water–ink repulsion.","options":["planographic (flat-bed)","relief","intaglio","screen"],"correct":0,"explanation":"Lithography uses areas on essentially the same plane that accept ink or water differently. It is planographic, unlike raised relief or recessed intaglio printing.","examTip":"Link this question to AGeE0606: Map Elements and Reproduction.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":312,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Elements and Reproduction","chapterCode":"AGeE0606","topic":"Map Elements and Reproduction","question":"In rotary offset printing, the inked image is transferred from plate to a __________ and then to paper.","options":["copper cylinder only","stone","rubber blanket","glass plate"],"correct":2,"explanation":"Offset printing first transfers the plate image to a rubber blanket and then to paper. The intermediate transfer is why it is called offset rather than direct plate-to-paper printing.","examTip":"Link this question to AGeE0606: Map Elements and Reproduction.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":313,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"A point is 120 km east of a Transverse Mercator central meridian. Taking R = 6371 km, the term E′²/(2R²) is approximately __________.","options":["0.000018","0.00177","0.000177","0.0177"],"correct":2,"explanation":"Keep distances in kilometres: 120²/(2 × 6371²) ≈ 0.00017738. This small dimensionless term approximates part of the transverse-Mercator scale variation.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":314,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"
