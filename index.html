    const syllabus=[{"id":1,"code":"AGeE01","title":"Fundamentals of Surveying","sections":[["AGeE0101","Introduction to Surveying"],["AGeE0102","Traditional Methods of Surveying"],["AGeE0103","Horizontal Control"],["AGeE0104","Vertical Control"],["AGeE0105","Topographical Surveying"],["AGeE0106","Adjustment of Observations"]]},{"id":2,"code":"AGeE02","title":"Photogrammetry, Remote Sensing and Image Processing","sections":[["AGeE0201","Fundamentals of Photogrammetry"],["AGeE0202","Aerial Photogrammetry"],["AGeE0203","Binocular Vision and Digital Photogrammetry"],["AGeE0204","Fundamentals of Remote Sensing"],["AGeE0205","Image Processing and Interpretation"],["AGeE0206","Terrain Models and Ortho Products"]]},{"id":3,"code":"AGeE03","title":"Geodesy and Gravity Field","sections":[["AGeE0301","Basic Geodesy"],["AGeE0302","Mathematical and Geometrical Geodesy"],["AGeE0303","Datum, Coordinate Systems and Projections"],["AGeE0304","Physical Geodesy"],["AGeE0305","Gravimetry and Earth’s Gravity Field"],["AGeE0306","Field Astronomy and Time Systems"]]},{"id":4,"code":"AGeE04","title":"Cadastre, Land Use and Land Management","sections":[["AGeE0401","Introduction to Cadastre"],["AGeE0402","Land Administration"],["AGeE0403","Land Tenure and Land Registration"],["AGeE0404","Land Information System"],["AGeE0405","Land Use and Land Valuation"],["AGeE0406","Land Policies, Acts and Regulations"]]},{"id":5,"code":"AGeE05","title":"Global Navigation Satellite System (GNSS)","sections":[["AGeE0501","GNSS Fundamentals and Principles"],["AGeE0502","GNSS Mathematical Models"],["AGeE0503","GNSS Signals and Processing"],["AGeE0504","Satellite Geometry and DOP"],["AGeE0505","Static and Kinematic Positioning"],["AGeE0506","Inertial Navigation System"]]},{"id":6,"code":"AGeE06","title":"Cartography and Geo-Visualization","sections":[["AGeE0601","Cartography and Visualization Fundamentals"],["AGeE0602","Map Projection and Sheet Numbering"],["AGeE0603","Cartographic Visualization"],["AGeE0604","Generalization, Typography and Colour"],["AGeE0605","Digital and Web Cartography"],["AGeE0606","Map Elements and Reproduction"]]},{"id":7,"code":"AGeE07","title":"Spatial Data Management and Spatial Data Infrastructure","sections":[["AGeE0701","Fundamentals of SDBMS"],["AGeE0702","Spatial Data Infrastructure"],["AGeE0703","Data Models"],["AGeE0704","Structured Query Language"],["AGeE0705","Spatial Database Technology"],["AGeE0706","National Spatial Data Infrastructure"]]},{"id":8,"code":"AGeE08","title":"Geographic Information System","sections":[["AGeE0801","GIS Fundamentals"],["AGeE0802","Data Sources and Spatial Data Models"],["AGeE0803","Transformation and Geospatial Analysis"],["AGeE0804","Surface Modelling"],["AGeE0805","Spatial Interpolation and DTM"],["AGeE0806","Open GIS"]]},{"id":9,"code":"AGeE09","title":"Engineering Survey","sections":[["AGeE0901","Engineering Survey Fundamentals"],["AGeE0902","Hydrographic, Hydropower and Irrigation Survey"],["AGeE0903","Underground and Geophysical Surveying"],["AGeE0904","Route Surveying"],["AGeE0905","Basic Civil Engineering and Stakeout"],["AGeE0906","Quantity Survey"]]},{"id":10,"code":"AALL10","title":"Project Planning, Design and Implementation","sections":[["AALL1001","Engineering Drawings"],["AALL1002","Engineering Economics"],["AALL1003","Project Planning and Scheduling"],["AALL1004","Project Management"],["AALL1005","Engineering Professional Practice"],["AALL1006","Engineering Regulatory Body"]]}];
    const questionBank=[{"id":1,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"The process of determining the relative positions of points on, above, or below the Earth's surface is known as __________.","options":["Navigation","Cartography","Geodesy","Surveying"],"correct":3,"explanation":"Surveying measures angles, distances and heights to locate points relative to one another. It is concerned with position, whether the point is on the ground, underground or above it.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":2,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"The modern discipline that integrates the acquisition, management, analysis and display of spatial data is called __________.","options":["Geomatics Engineering","Photogrammetry","Cartography","Hydrography"],"correct":0,"explanation":"Geomatics covers the full spatial-information lifecycle: acquisition, storage, analysis and presentation. Surveying is one measurement component of this wider discipline.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":3,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"The first fundamental principle of surveying is to work from the __________.","options":["centre to the boundary","part to the whole","whole to the part","boundary to the centre"],"correct":2,"explanation":"Establish a reliable control framework first, then fill in local detail. Working from the whole to the part confines small errors instead of letting them accumulate across the entire survey.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":4,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"A new survey point should be fixed by at least __________ independent measurements.","options":["three","two","four","one"],"correct":1,"explanation":"Two independent measurements constrain a point's position, for example two distances or a distance and a bearing. Extra redundant observations provide checks; two alone do not guarantee error detection.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":5,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"In plane surveying, the Earth's curvature is __________.","options":["applied only to longitudes","applied only to elevations","always taken into account","ignored and the Earth is treated as a plane"],"correct":3,"explanation":"Plane surveying approximates a small portion of the Earth as flat, so plane geometry can be used. Geodetic surveying explicitly accounts for the curved reference surface.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":6,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"Geodetic surveying is generally preferred when the area covered exceeds about __________.","options":["250 km²","100 km²","25 km²","50 km²"],"correct":0,"explanation":"The supplied notes use about 250 km² as a teaching guideline for geodetic surveying. This is not a universal cutoff: required accuracy and the survey's extent determine whether curvature matters.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":7,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"The fixed ratio of a map distance to the corresponding ground distance is called __________.","options":["map projection","map scale","contour interval","coordinate system"],"correct":1,"explanation":"Map scale is map distance divided by corresponding horizontal ground distance in the same units. It connects a measured length on the drawing with the represented real-world length.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":8,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"A representative fraction of 1:2000 means that 1 cm on the map represents __________ on the ground.","options":["200 m","2 m","20 m","2000 m"],"correct":2,"explanation":"At 1:2000, 1 cm represents 2000 cm. Dividing by 100 converts this to 20 m; failing to convert centimetres is the usual trap.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":9,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"Compared with a scale of 1:5000, a scale of 1:500 is a __________ scale.","options":["smaller","verbal","larger","medium"],"correct":2,"explanation":"1/500 is a larger fraction than 1/5000. A large-scale map shows a smaller ground area with more room for detail, despite having a smaller denominator.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":10,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"The type of scale that remains true if a map is photographically enlarged or reduced is the __________.","options":["statement scale","graphical (bar) scale","engineer's scale","representative fraction"],"correct":1,"explanation":"A bar scale enlarges or shrinks with the map, so its graphic length remains proportional to map features. A printed representative fraction does not automatically change when the map is resized.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":11,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"In Nepali hill land measure, 1 ropani is approximately equal to __________.","options":["31.80 m²","338.63 m²","6776.63 m²","508.72 m²"],"correct":3,"explanation":"The customary conversion in the supplied notes is 1 ropani ≈ 508.72 m². Ropani is an area, so it must be converted to square metres, not metres.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":12,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"In the Terai land-measure system, 1 bigha is equal to __________.","options":["20 kattha","16 aana","20 aana","16 kattha"],"correct":0,"explanation":"The Terai system divides one bigha into 20 kattha. Keeping the hierarchy bigha → kattha → dhur avoids mixing it with the hill system ropani → aana → paisa → daam.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":13,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"A 246.00 m length is measured with a steel tape at 35°C when the standard temperature is 20°C. Taking α = 11.6 × 10-6 /°C, the temperature correction is approximately __________.","options":["−0.043 m","+0.043 m","+0.430 m","+0.015 m"],"correct":1,"explanation":"Use Ct = α(T − T0)L = 11.6 × 10⁻⁶ × 15 × 246 = 0.042804 m. The warmer tape expands, so add approximately 0.043 m to the recorded distance.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":14,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Introduction to Surveying","chapterCode":"AGeE0101","topic":"Introduction to Surveying","question":"A complete circle of 360° is equal to __________ gon.","options":["360","200","640","400"],"correct":3,"explanation":"A right angle is 100 gon, so four right angles make 400 gon. Degrees divide a circle into 360 parts; gons divide it into 400.","examTip":"Link this question to AGeE0101: Introduction to Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":15,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"When a tape is longer than its nominal length, the standardization correction applied to the measured length is __________.","options":["positive (additive)","independent of measured length","always negative","always zero"],"correct":0,"explanation":"Each nominal tape length actually spans more ground than stated. Therefore true distance = measured distance × actual tape length / nominal tape length, giving a positive correction.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":16,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"When a tape is supported only at its ends, the correction required because of its curved profile is the __________ correction.","options":["temperature","pull","sag","standardization"],"correct":2,"explanation":"An unsupported tape hangs in a curve, whose arc length exceeds its horizontal chord. The sag correction removes this excess and is negative for a measured horizontal distance.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":17,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"The slope correction applied to a length measured on sloping ground is __________.","options":["zero for slopes less than 10%","always negative","positive on uphill slopes only","always positive"],"correct":1,"explanation":"The horizontal component of a slope length is L cos θ, which cannot exceed L. Thus slope reduction is negative for a nonzero slope and zero on level ground.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":18,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"The coefficient of linear expansion of a steel tape is approximately __________.","options":["11.6 × 10-6 /°C","6.5 × 10-6 /°C","0.5 × 10-6 /°C","23.0 × 10-6 /°C"],"correct":0,"explanation":"The notes use α ≈ 11.6 × 10⁻⁶ per °C for steel. Temperature correction multiplies this expansion coefficient by the temperature difference and measured length.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":19,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"A 30 m steel tape is actually 30.006 m long. If it measures a line as 246.00 m, the true length is approximately __________.","options":["246.180 m","246.000 m","245.951 m","246.049 m"],"correct":3,"explanation":"True length = 246 × 30.006/30 = 246.0492 m. The tape is too long, so the corrected ground distance is greater than the recorded 246 m.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":20,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"A distance of 500.00 m is measured along a slope of 1 in 25. The corresponding horizontal distance is approximately __________.","options":["500.40 m","480.00 m","499.60 m","520.00 m"],"correct":2,"explanation":"Taking the slope as rise/horizontal = 1/25, horizontal distance is 500/√(1 + 1/25²) ≈ 499.6005 m. The horizontal projection is shorter than the slope length.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":21,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"The only simple plane figure that is rigid once its three sides are known is a __________.","options":["triangle","pentagon","square","rectangle"],"correct":0,"explanation":"Three fixed side lengths determine a triangle's shape by SSS. A quadrilateral with only its side lengths fixed can deform, which is why triangulation provides a rigid framework.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":22,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"Gunter's chain has a length of __________.","options":["33 ft","20 m","100 ft","66 ft"],"correct":3,"explanation":"Gunter's chain is 66 ft long and contains 100 links. Ten square chains equal one acre, explaining its historical use in land measurement.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":23,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"The tape with a very low coefficient of thermal expansion, used for base-line measurement, is the __________ tape.","options":["cloth","invar","metallic","steel"],"correct":1,"explanation":"Invar expands very little with temperature compared with ordinary steel. This reduces temperature-related uncertainty when measuring a precise baseline; it does not remove all other corrections.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":24,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"In plane table surveying, field observations and plotting are done __________.","options":["on different days","after computing coordinates","simultaneously","only in the office"],"correct":2,"explanation":"With a plane table, rays are sighted and drawn directly in the field on the mounted sheet. Measurement and plotting therefore take place together rather than in separate field and office stages.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":25,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"The plane-table method used to locate an inaccessible point by drawing rays from two stations is __________.","options":["traversing","radiation","intersection","resection"],"correct":2,"explanation":"Intersection locates the target where rays from two known occupied stations cross. The target itself need not be occupied, making the method useful for inaccessible points.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":26,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"The plane-table method in which the occupied unknown station is fixed by sighting to known points is __________.","options":["resection","traversing","radiation","intersection"],"correct":0,"explanation":"Resection reverses intersection: the instrument is at an unknown station and sights known mapped points. Their directions are used to determine the occupied station's position.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":27,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"A whole circle bearing is measured clockwise from the north and ranges from __________.","options":["−180° to +180°","0° to 180°","0° to 90°","0° to 360°"],"correct":3,"explanation":"Whole-circle bearings start at north and increase clockwise through east 90°, south 180° and west 270°. Quadrantal bearings instead use an acute angle and a quadrant label.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":28,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"If the fore bearing of a line is 70°, its back bearing in the whole-circle system is __________.","options":["70°","250°","110°","290°"],"correct":1,"explanation":"Reverse the direction by adding 180°: 70° + 180° = 250°. If the result reaches 360°, subtract 360° to remain within a whole circle.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":29,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"The horizontal angle between the true meridian and the magnetic meridian is called __________.","options":["magnetic declination","local attraction","grid convergence","magnetic dip"],"correct":0,"explanation":"True north follows the geographic meridian; magnetic north follows the horizontal magnetic field. The angle between these directions is magnetic declination, not local attraction.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":30,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"Local attraction is indicated in a compass traverse when, for a line, FB − BB is not equal to __________.","options":["360°","180°","90°","270°"],"correct":1,"explanation":"The forward and reverse directions of the same line should differ by 180°. A discrepancy suggests local attraction or observational error; a 180° difference alone cannot rule out equal attraction at both stations.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":31,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"The theodolite method in which an angle is measured several times cumulatively to reduce reading and pointing errors is the __________ method.","options":["deflection","direction","reiteration","repetition"],"correct":3,"explanation":"Repetition accumulates several copies of the same angle on the circle, then divides the accumulated reading by the number of repetitions. This reduces the effect of reading and pointing errors.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":32,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"The reiteration (direction) method of measuring horizontal angles is preferred in __________.","options":["plane tabling","levelling","triangulation","chain surveying"],"correct":2,"explanation":"Reiteration measures several directions around a station and checks their full-circle closure. This suits triangulation stations, where angles to multiple control points are observed.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":33,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"In tacheometry with an anallactic lens, the additive constant is __________.","options":["100","0","equal to the multiplying constant","50"],"correct":1,"explanation":"An anallactic lens makes the additive tacheometric constant c zero. For a horizontal sight the distance equation then simplifies from D = ks + c to D = ks.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":34,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"For a tacheometer with k = 100, c = 0 and a staff intercept of 1.250 m on a horizontal sight, the horizontal distance is __________.","options":["80.00 m","250.00 m","125.00 m","12.50 m"],"correct":2,"explanation":"For a horizontal sight, D = ks + c. Substituting 100 × 1.250 + 0 gives 125.00 m; the intercept is a length, not an angle.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":35,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"For an inclined sight with the staff held vertical, the tacheometric horizontal distance is given by __________.","options":["D = ks cosθ","D = ks sin²θ","D = ks + c","D = ks cos²θ + c cosθ"],"correct":3,"explanation":"For a vertical staff and inclined line of sight, projection of both the intercept and distance introduces cos²θ. The additive-constant term has only one projection, giving c cos θ.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":36,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Traditional Methods of Surveying","chapterCode":"AGeE0102","topic":"Traditional Methods of Surveying","question":"A tacheometer (k = 100, c = 0) reads a staff intercept of 1.250 m at a vertical angle of +5°30′. The horizontal distance is approximately __________.","options":["123.85 m","125.00 m","126.16 m","118.40 m"],"correct":0,"explanation":"Convert 5°30′ to 5.5°. Then D = 100 × 1.250 × cos²(5.5°) = 123.8517 m, approximately 123.85 m; using 5.30° is incorrect.","examTip":"Link this question to AGeE0102: Traditional Methods of Surveying.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":37,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"Triangulation establishes horizontal control by measuring __________ and computing the remaining sides from a measured base line.","options":["only distances","magnetic bearings only","angles","only elevations"],"correct":2,"explanation":"Triangulation measures angles and at least one baseline. The sine rule propagates known scale through the triangle network; trilateration instead measures the side lengths directly.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":38,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"The most rigid and best-conditioned triangulation figure is the __________.","options":["open traverse","single chain of triangles","double chain of triangles","braced quadrilateral"],"correct":3,"explanation":"A braced quadrilateral adds diagonals and redundant angles to a four-station figure. These extra geometric constraints improve strength and provide checks compared with a simple unbraced chain.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":39,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"Well-conditioned triangulation triangles preferably have angles in the range __________.","options":["10°–20°","30°–120°","150°–180°","120°–150°"],"correct":1,"explanation":"Very small or very large triangle angles amplify the effect of angular errors on computed lengths. The notes' 30°–120° range avoids badly conditioned triangles; near-equilateral triangles are favourable.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":40,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"Trilateration determines horizontal control by measuring the __________ of the sides of a network.","options":["lengths","magnetic bearings","elevations","angles"],"correct":0,"explanation":"Trilateration fixes network geometry from measured distances, commonly with EDM. Triangulation is angle-based; a combined network can use both angles and distances.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":41,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"A traverse that returns to the starting point, or closes onto another known point, is a __________ traverse.","options":["hanging","closed","compass-only","open"],"correct":1,"explanation":"A closed traverse reaches its starting control or another known control point. Comparing computed closure with known coordinates allows misclosure to be assessed and adjusted.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":42,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"The latitude of a survey line is the __________ component of that line.","options":["north–south","vertical","east–west","slope"],"correct":0,"explanation":"In traverse terminology, latitude means a line's north–south component, not geographic latitude. For a north-referenced bearing θ, it is L cos θ.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":43,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"The departure of a line of length l and bearing θ is computed as __________.","options":["l cos θ","l / cos θ","l tan θ","l sin θ"],"correct":3,"explanation":"Departure is the east–west component. Because the bearing is measured from north, departure = l sin θ; latitude = l cos θ. Quadrant determines each sign.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":44,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"In a closed traverse, ΣL = +0.32 m, ΣD = −0.24 m and the perimeter is 2.4 km. The linear closing error is __________.","options":["0.56 m","0.08 m","0.40 m","0.80 m"],"correct":2,"explanation":"Linear misclosure = √[(ΣL)² + (ΣD)²] = √(0.32² + 0.24²) = 0.40 m. The two perpendicular component errors cannot simply be added.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":45,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"If the closing error of a traverse is 0.40 m and the perimeter is 2400 m, the relative precision is __________.","options":["1/3000","1/6000","1/10000","1/8000"],"correct":1,"explanation":"Relative precision = closing error / perimeter = 0.40/2400 = 1/6000. A larger denominator indicates a smaller closure error relative to the surveyed distance.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":46,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"The Bowditch (compass) rule distributes latitude and departure corrections in proportion to the __________ of each line.","options":["length","departure","latitude","included angle"],"correct":0,"explanation":"Bowditch assigns each coordinate correction as minus the total component misclosure times line length / total traverse length. Longer lines receive larger corrections; the corrected components close.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":47,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Horizontal Control","chapterCode":"AGeE0103","topic":"Horizontal Control","question":"The Transit rule is preferred when __________ measurements are more precise than the linear measurements.","options":["magnetic","stadia","angular","barometric"],"correct":2,"explanation":"The transit rule assumes angular observations are relatively more precise. Corrections are allocated using absolute latitude and departure components, unlike Bowditch's allocation by line length.","examTip":"Link this question to AGeE0103: Horizontal Control.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":48,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Vertical Control","chapterCode":"AGeE0104","topic":"Vertical Control","question":"A benchmark is a point of known __________.","options":["scale factor","magnetic declination","latitude only","reduced level"],"correct":3,"explanation":"A benchmark has an established elevation or reduced level relative to a vertical datum. It provides the height reference from which new levels are transferred.","examTip":"Link this question to AGeE0104: Vertical Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":49,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Vertical Control","chapterCode":"AGeE0104","topic":"Vertical Control","question":"In the Height of Instrument method, H.I. is equal to __________.","options":["R.L. + F.S.","B.S. − F.S.","R.L. − B.S.","R.L. + B.S."],"correct":3,"explanation":"A backsight is added to the known benchmark level to obtain the line-of-sight elevation: HI = RL + BS. A subsequent staff reading is subtracted from HI to obtain another point's RL.","examTip":"Link this question to AGeE0104: Vertical Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":50,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Vertical Control","chapterCode":"AGeE0104","topic":"Vertical Control","question":"The arithmetic check of the rise-and-fall method is that ΣBS − ΣFS equals __________.","options":["ΣRise − ΣFall","ΣRise + ΣFall","First RL + Last RL","H.I. − Last RL"],"correct":0,"explanation":"Both ΣBS − ΣFS and ΣRise − ΣFall equal last RL − first RL. Agreement checks the arithmetic, though it cannot detect every field observation mistake.","examTip":"Link this question to AGeE0104: Vertical Control.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":51,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Vertical Control","chapterCode":"AGeE0104","topic":"Vertical Control","question":"Compared with the Height of Instrument method, the rise-and-fall method provides __________.","options":["fewer arithmetic checks","more complete internal checks","no check on intermediate sights","only a single arithmetic check"],"correct":1,"explanation":"The rise-and-fall method explicitly checks changes between successive points as well as the overall level difference. The HI method is faster, but offers fewer independent arithmetic checks.","examTip":"Link this question to AGeE0104: Vertical Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":52,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Vertical Control","chapterCode":"AGeE0104","topic":"Vertical Control","question":"Reciprocal levelling is used primarily to eliminate errors due to curvature, refraction and __________.","options":["magnetic declination","sag of the tape","imperfect collimation","local attraction"],"correct":2,"explanation":"Reciprocal observations are made from near each side of an obstacle. Averaging the two level differences cancels approximately equal long-sight effects from collimation, curvature and refraction.","examTip":"Link this question to AGeE0104: Vertical Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":53,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Vertical Control","chapterCode":"AGeE0104","topic":"Vertical Control","question":"If a₁, b₁ are staff readings with the instrument near A and a₂, b₂ with the instrument near B, the true difference of level is __________.","options":["(a₁ − b₁) only","(a₁ + b₁ + a₂ + b₂) / 4","(a₁ − b₁) + (a₂ − b₂)","[(a₁ − b₁) + (a₂ − b₂)] / 2"],"correct":3,"explanation":"Each setup supplies a difference, a₁ − b₁ or a₂ − b₂. Their long-sight errors have opposite effects, so the average [(a₁ − b₁) + (a₂ − b₂)]/2 estimates the true difference.","examTip":"Link this question to AGeE0104: Vertical Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":54,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Vertical Control","chapterCode":"AGeE0104","topic":"Vertical Control","question":"The combined curvature and refraction correction, with D in kilometres, is approximately __________ metres.","options":["0.3086 D","0.0673 D²","0.0112 D²","0.0785 D²"],"correct":1,"explanation":"The notes give 0.0673D² as the magnitude of the combined curvature/refraction effect with D in kilometres. When correcting a staff reading under the usual convention, subtract this magnitude.","examTip":"Link this question to AGeE0104: Vertical Control.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":55,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Vertical Control","chapterCode":"AGeE0104","topic":"Vertical Control","question":"The combined curvature–refraction correction for a sight of 1200 m is approximately __________.","options":["0.011 m","0.785 m","0.097 m","0.067 m"],"correct":2,"explanation":"Convert 1200 m to 1.2 km before squaring. The magnitude is 0.0673 × 1.2² = 0.096912 m, about 0.097 m; its applied sign depends on the quantity being corrected.","examTip":"Link this question to AGeE0104: Vertical Control.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":56,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Vertical Control","chapterCode":"AGeE0104","topic":"Vertical Control","question":"The two-peg test of a dumpy level is used to check the __________.","options":["collimation error","vertical-circle index","plate bubble only","optical plummet"],"correct":0,"explanation":"The two-peg test compares a balanced-sight level difference with an unbalanced-sight observation. A difference reveals whether the line of collimation is truly horizontal when the bubble is centred.","examTip":"Link this question to AGeE0104: Vertical Control.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":57,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Vertical Control","chapterCode":"AGeE0104","topic":"Vertical Control","question":"The accuracy of precise levelling is commonly specified in millimetres per __________.","options":["degree","100 m","√km","kilometre"],"correct":2,"explanation":"Independent random levelling errors accumulate approximately with the square root of distance. This leads to specifications of the form C√K millimetres, where K is route length in kilometres.","examTip":"Link this question to AGeE0104: Vertical Control.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":58,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Topographical Surveying","chapterCode":"AGeE0105","topic":"Topographical Surveying","question":"A contour is an imaginary line joining points of equal __________.","options":["elevation","magnetic intensity","slope","latitude"],"correct":0,"explanation":"A contour connects locations with the same elevation relative to a datum. It represents height as a line on a plan, allowing the terrain surface to be interpreted.","examTip":"Link this question to AGeE0105: Topographical Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":59,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Topographical Surveying","chapterCode":"AGeE0105","topic":"Topographical Surveying","question":"The vertical distance between two successive contour lines is known as the __________.","options":["horizontal equivalent","contour interval","contour gradient","vertical exaggeration"],"correct":1,"explanation":"Contour interval is a vertical height difference, usually constant on one map. Horizontal spacing between contours varies with slope and is not the contour interval.","examTip":"Link this question to AGeE0105: Topographical Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":60,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Topographical Surveying","chapterCode":"AGeE0105","topic":"Topographical Surveying","question":"Closely spaced contours on a map indicate a __________ slope.","options":["uniform","zero","gentle","steep"],"correct":3,"explanation":"For the same contour interval, a shorter horizontal separation means a greater rise per unit distance. Closely spaced contours therefore indicate a steep slope.","examTip":"Link this question to AGeE0105: Topographical Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":61,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Topographical Surveying","chapterCode":"AGeE0105","topic":"Topographical Surveying","question":"Valley contours form a “V” pointing towards __________.","options":["lower ground","the north","higher ground","the map margin"],"correct":2,"explanation":"A valley becomes higher upstream, so contours crossing it point toward higher ground. Ridge contours generally point downhill, providing a useful contrast when reading relief.","examTip":"Link this question to AGeE0105: Topographical Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":62,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Topographical Surveying","chapterCode":"AGeE0105","topic":"Topographical Surveying","question":"A closed contour with elevations decreasing towards the centre indicates a __________.","options":["ridge","saddle","hill","depression"],"correct":3,"explanation":"If successive inward contours have lower elevations, the centre is a hollow or depression. If elevations rise inward, the same closed pattern indicates a hill instead.","examTip":"Link this question to AGeE0105: Topographical Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":63,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Topographical Surveying","chapterCode":"AGeE0105","topic":"Topographical Surveying","question":"The direct method of contouring is generally __________.","options":["slow but accurate","fast but inaccurate","independent of a level","suitable only for earthwork"],"correct":0,"explanation":"Direct contouring locates points actually lying on the required contour in the field. This can be accurate but takes longer than surveying spot heights and interpolating contours later.","examTip":"Link this question to AGeE0105: Topographical Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":64,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"Accuracy concerns closeness to the true value and is related mainly to __________ error.","options":["personal","systematic","blunder","random"],"correct":1,"explanation":"Systematic bias can shift a tightly clustered set of readings away from the true value. This is why the notes associate accuracy with systematic error; random error also contributes to total accuracy.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":65,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"Precision concerns the closeness of repeated observations to each other and is related mainly to __________ error.","options":["systematic","constant","gross","random"],"correct":3,"explanation":"Precision describes repeatability, so random scatter among repeated observations is central. Measurements can be precise yet inaccurate when they share a systematic bias.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":66,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"For equally weighted observations, the most probable value is the __________.","options":["arithmetic mean","geometric mean","median","mode"],"correct":0,"explanation":"With equal precision and independent unbiased observations, minimizing the sum of squared residuals gives the arithmetic mean. Unequal precision requires a weighted mean instead.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":67,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"The statistical weight of an observation is inversely proportional to its __________.","options":["mean","residual","variance","true error"],"correct":2,"explanation":"Weight is proportional to 1/σ². An observation with half the standard deviation has one-quarter the variance and therefore four times the weight.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":68,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"The standard error of the mean of n equally precise observations is __________.","options":["σ","σ/√n","σ√n","σ/n"],"correct":1,"explanation":"For n independent observations of equal standard deviation σ, the variance of their mean is σ²/n. Taking its square root gives σ/√n; correlated readings do not obey this simple reduction.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":69,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"The probable error is approximately equal to __________.","options":["0.6745 σ","1.9600 σ","0.5000 σ","1.0000 σ"],"correct":0,"explanation":"For a normal distribution, the central interval ±0.6745σ contains half the probability. This defines probable error, which is smaller than the one-standard-deviation interval.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":70,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"Least squares adjustment determines the most probable values by minimizing the quantity __________.","options":["Σ|v|","Σv","Σv³","vᵀPv"],"correct":3,"explanation":"Least squares minimizes the weighted sum of squared residuals, vᵀPv. Squaring avoids cancellation between positive and negative residuals, while P accounts for unequal observation precision.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":71,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"The normal equations of parametric least squares are written as __________.","options":["Bv + w = 0","Ax = L","AᵀPA x = AᵀPL","Px = L"],"correct":2,"explanation":"For the linear model Ax ≈ L, differentiating (Ax − L)ᵀP(Ax − L) gives AᵀPAx = AᵀPL. Solving these normal equations estimates the unknown parameters.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":72,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"Five measurements of an angle are 40°20′10″, 40°20′14″, 40°20′08″, 40°20′12″ and 40°20′16″. The most probable value is __________.","options":["40°20′08″","40°20′12″","40°20′10″","40°20′16″"],"correct":1,"explanation":"The degrees and minutes are common, so average the seconds: (10 + 14 + 8 + 12 + 16)/5 = 12. The mean is 40°20′12″.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":73,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"Bowditch and Transit rules are __________ methods of traverse adjustment, whereas least squares is rigorous.","options":["approximate","magnetic","astronomical","graphical only"],"correct":0,"explanation":"Bowditch and transit corrections follow simplified allocation rules. Least squares uses the observation model and statistical weights explicitly, making it the more rigorous adjustment approach.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":74,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"For independent observations, if z = x + y then σz² equals __________.","options":["(σx + σy)²","σx² × σy²","σx² + σy²","σx² − σy²"],"correct":2,"explanation":"For z = x + y, variance is σx² + σy² + 2Cov(x,y). Independence makes covariance zero, so variances—not standard deviations—are added.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":75,"module":"Fundamentals of Surveying","moduleCode":"AGeE01","moduleId":1,"chapter":"Adjustment of Observations","chapterCode":"AGeE0106","topic":"Adjustment of Observations","question":"Which of the following is NOT one of the five principal tape corrections used in precise linear measurement?","options":["Temperature","Sag","Standardization","Magnetic declination"],"correct":3,"explanation":"Magnetic declination affects bearings measured relative to magnetic north. Tape-length corrections address standard length, temperature, pull, sag and slope, so declination is not a tape correction.","examTip":"Link this question to AGeE0106: Adjustment of Observations.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":76,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Photogrammetry","chapterCode":"AGeE0201","topic":"Fundamentals of Photogrammetry","question":"Photogrammetry obtains quantitative information from photographs and is based on the geometry of __________.","options":["isometric projection","central projection","orthographic projection","parallel projection"],"correct":1,"explanation":"A camera forms an image by rays passing through a common perspective centre. This central-projection geometry links image coordinates, camera position and object coordinates.","examTip":"Link this question to AGeE0201: Fundamentals of Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":77,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"For a truly vertical photograph, the photo scale is __________.","options":["f/H","H − f","f × H","H/f"],"correct":0,"explanation":"For level ground photographed vertically, similar triangles give image distance / ground distance = focal length / height above ground. Thus scale = f/H when H is height above that terrain plane.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":78,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"If the flying height above datum is H and the terrain height is h, the local photo scale is __________.","options":["H/f","f/(H − h)","f/(H + h)","f/H"],"correct":1,"explanation":"Terrain at elevation h lies H − h below the camera. Substituting that actual camera-to-ground height in the scale equation gives f/(H − h), so higher terrain appears at larger scale.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":79,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"A vertical photograph is taken with f = 152 mm from a flying height of 3000 m above MSL. If the mean terrain elevation is 500 m, the photo scale is approximately __________.","options":["1:19 737","1:25 000","1:13 158","1:16 447"],"correct":3,"explanation":"Height above terrain = 3000 − 500 = 2500 m. Convert f = 152 mm to 0.152 m; scale = 0.152/2500 = 1/16447.37, approximately 1:16 447.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":80,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"A photograph is classified as vertical when the camera axis is within about __________ of the vertical.","options":["0.5°","20°","3°","10°"],"correct":2,"explanation":"The notes use about 3° tilt as the conventional tolerance for calling an aerial image vertical. Truly vertical means zero tilt; the approximate classification does not remove tilt-related distortion.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":81,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"A high-oblique aerial photograph is one in which the __________ is visible.","options":["horizon","fiducial mark","nadir point","principal point"],"correct":0,"explanation":"A high-oblique view includes the horizon, while a low-oblique view does not. Both have a deliberately inclined camera axis rather than a near-vertical viewing direction.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":82,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"The standard forward (longitudinal) overlap used in aerial photography is about __________.","options":["90%","20–30%","60%","10%"],"correct":2,"explanation":"Around 60% forward overlap gives successive photographs enough common ground for stereo viewing. Actual flight planning may require more overlap for terrain, UAV matching or project specifications.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":83,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"The standard lateral (side) overlap used in aerial photography is about __________.","options":["5%","80%","60%","20–30%"],"correct":3,"explanation":"Side overlap connects neighbouring flight strips and helps avoid coverage gaps. The notes use a conventional 20–30%; modern projects may specify higher overlap for reliable matching.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":84,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Air base B is related to ground coverage G and forward overlap of by __________.","options":["B = G × of","B = G(1 − of)","B = G + of","B = G/(1 − of)"],"correct":1,"explanation":"The next exposure advances only across the non-overlapping part of the footprint. Therefore B = G(1 − of), where overlap of is entered as a fraction such as 0.60.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":85,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Interior orientation reconstructs the interior geometry of the camera using the principal point, fiducial marks and __________.","options":["flying height","air base","ground control points","calibrated focal length"],"correct":3,"explanation":"Interior orientation restores the camera's internal ray geometry. The calibrated focal length, principal point and fiducial references define where an image measurement lies relative to the perspective centre.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":86,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Relative orientation of a stereo pair has __________ independent elements.","options":["5","6","3","7"],"correct":0,"explanation":"Relative orientation removes y-parallax to create a consistent stereo model. After fixing the model's arbitrary scale and reference frame, five independent relative-orientation elements remain.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":87,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Absolute orientation is a __________-parameter transformation that scales, levels and orients the stereo model to the ground.","options":["6","7","3","5"],"correct":1,"explanation":"A 3D similarity transformation has three translations, three rotations and one uniform scale: seven parameters. These tie a relative stereo model to ground control.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":88,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Exterior orientation of a photograph consists of __________ parameters of camera position and attitude.","options":["7","3","6","5"],"correct":2,"explanation":"Exterior orientation needs three camera-position coordinates and three rotations. These six parameters say where the camera was and how it was pointed; focal length belongs to interior orientation.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":89,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Relief displacement of an elevated object is __________ from the principal point.","options":["radial","tangential","independent of radial distance","parallel to the flight line"],"correct":0,"explanation":"Height above the reference plane displaces an image point along a radius from the principal point on a vertical photograph. Higher objects move outward; the effect increases farther from the centre.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":90,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Relief displacement d is given by the relation __________.","options":["d = H/rh","d = rh/H","d = rH/h","d = r + h/H"],"correct":1,"explanation":"For the conventional vertical-photo geometry, d = rh/H, where r is the image radius of the elevated point. Displacement increases with object height and radial distance, and decreases with flight height.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":91,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"In a vertical photograph taken from 2000 m, the image of a 60 m tower is 80 mm from the principal point. The relief displacement is __________.","options":["1.2 mm","24.0 mm","2.4 mm","4.8 mm"],"correct":2,"explanation":"Use d = rh/H = 80 × 60/2000 = 2.4 mm. The height ratio is dimensionless, so using r in millimetres returns displacement in millimetres.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":92,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Rectification of a tilted photograph is performed primarily to remove __________ displacement.","options":["relief","earth-curvature","atmospheric","tilt"],"correct":3,"explanation":"Rectification transforms the image to remove camera-tilt effects for a reference plane. It does not generally remove terrain relief displacement, which needs elevation information.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":93,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Orthorectification removes both tilt and relief displacements and therefore requires a __________.","options":["DEM","histogram","anaglyph filter","fiducial mark"],"correct":0,"explanation":"Orthorectification uses terrain elevations and camera/sensor geometry to place each pixel in map coordinates. A DEM supplies the height needed to correct relief displacement as well as tilt effects.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":94,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Aerial Photogrammetry","chapterCode":"AGeE0202","topic":"Aerial Photogrammetry","question":"Ground control points that are marked on the ground before photography are said to be __________.","options":["post-pointed","mosaic-controlled","pre-pointed","resected"],"correct":2,"explanation":"Pre-pointed control is physically marked before the flight so it can be identified clearly in the photographs. This improves the link between measured ground coordinates and image coordinates.","examTip":"Link this question to AGeE0202: Aerial Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":95,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Binocular Vision and Digital Photogrammetry","chapterCode":"AGeE0203","topic":"Binocular Vision and Digital Photogrammetry","question":"When the left eye views the right photograph of a stereo pair, the resulting impression of relief is __________.","options":["stereoscopic","anaglyphic","orthographic","pseudoscopic"],"correct":3,"explanation":"Swapping left and right views reverses the disparity interpreted by the eyes. Peaks can appear as hollows: this inverted depth perception is pseudoscopic rather than normal stereoscopic vision.","examTip":"Link this question to AGeE0203: Binocular Vision and Digital Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":96,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Binocular Vision and Digital Photogrammetry","chapterCode":"AGeE0203","topic":"Binocular Vision and Digital Photogrammetry","question":"X-parallax of a point on a stereo pair is defined as __________.","options":["x / x′","x − x′","x × x′","x + x′"],"correct":1,"explanation":"X-parallax is the difference between corresponding along-flight image coordinates, p = x − x′, under the adopted coordinate convention. It is this disparity that relates stereo geometry to elevation.","examTip":"Link this question to AGeE0203: Binocular Vision and Digital Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":97,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Binocular Vision and Digital Photogrammetry","chapterCode":"AGeE0203","topic":"Binocular Vision and Digital Photogrammetry","question":"The height of a point above datum obtained from parallax is given by h = __________.","options":["H + Bf/p","pH/B","H − Bf/p","Bf/H"],"correct":2,"explanation":"For the ideal vertical stereo geometry, p = Bf/(H − h). Rearranging gives h = H − Bf/p; B, H and h must share ground units and f and p share image units.","examTip":"Link this question to AGeE0203: Binocular Vision and Digital Photogrammetry.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":98,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Binocular Vision and Digital Photogrammetry","chapterCode":"AGeE0203","topic":"Binocular Vision and Digital Photogrammetry","question":"A stereo pair has air base 800 m, f = 152 mm and flying height 3000 m. If the parallax of point P is 92.0 mm, the height of P above datum is approximately __________.","options":["1322 m","1678 m","2174 m","2826 m"],"correct":1,"explanation":"Use h = 3000 − (800 × 152/92) = 1678.26 m. The millimetres in f/p cancel, leaving height in metres; this is elevation above the specified datum.","examTip":"Link this question to AGeE0203: Binocular Vision and Digital Photogrammetry.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":99,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Binocular Vision and Digital Photogrammetry","chapterCode":"AGeE0203","topic":"Binocular Vision and Digital Photogrammetry","question":"The approximate inter-pupillary (eye-base) distance of the human eyes is __________.","options":["35 mm","152 mm","17 mm","65 mm"],"correct":3,"explanation":"About 65 mm is a representative adult eye separation, not a fixed value for everyone. This eye base lets the two eyes receive different perspectives and perceive depth.","examTip":"Link this question to AGeE0203: Binocular Vision and Digital Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":100,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Binocular Vision and Digital Photogrammetry","chapterCode":"AGeE0203","topic":"Binocular Vision and Digital Photogrammetry","question":"Compared with feature-based matching, area-based image matching typically produces __________ correspondences.","options":["denser","fewer distinctive","sparser","only one"],"correct":0,"explanation":"Area matching compares image windows across many pixels, so it can generate dense correspondences. Feature matching first identifies distinctive points or structures and usually produces a sparser set.","examTip":"Link this question to AGeE0203: Binocular Vision and Digital Photogrammetry.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":101,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Binocular Vision and Digital Photogrammetry","chapterCode":"AGeE0203","topic":"Binocular Vision and Digital Photogrammetry","question":"SIFT and SURF are examples of __________ used in feature-based image matching.","options":["radiometric corrections","atmospheric windows","feature detectors/descriptors","map projections"],"correct":2,"explanation":"SIFT and SURF detect distinctive image features and describe their neighbourhoods. Matching these descriptors links corresponding points between images even when viewpoint or scale changes moderately.","examTip":"Link this question to AGeE0203: Binocular Vision and Digital Photogrammetry.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":102,"module":"Photogrammetry, Remote Sensing and Image Processing","moduleCode":"AGeE02","moduleId":2,"chapter":"Fundamentals of Remote Sensing","chapterCode":"AGeE0204","topic":"Fundamentals of Remote Sensing","question":"Remote sensing obtains information about an object by a device that is __________ the object under investigation.","options":["in physical contact with","not in contact with","always underground","always hand-held"],"correct":1,"explanation":"Remote sensing measures reflected or emitted energy without touching the target. The absence of direct physical contact distinguishes it from an in-situ measurement such as a soil probe.","examTip":"Link this question to AGeE0204: Fundamentals of Remote Sensing.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":fals
