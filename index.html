    function renderMockIntro(){const dist=syllabus.map(m=>`<span class="pill">${m.code}: ${mockDistribution[m.id]}</span>`).join('');app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Exam simulation</p><h1>Full Mock Examination</h1><p class="subhead">A 100-question session balanced to the chapter pattern in the supplied NEC model paper.</p></div><button class="btn btn-secondary" data-view="dashboard">Back to dashboard</button></div><section class="mock-intro"><div class="card"><h2>Before you begin</h2><ul class="instruction-list"><li><span class="checkmark">✓</span><span><strong>100 questions.</strong> Every mock avoids duplicate questions and draws from all 10 official chapters.</span></li><li><span class="checkmark">✓</span><span><strong>Answers stay hidden.</strong> Correct answers and explanations appear only after final submission.</span></li><li><span class="checkmark">✓</span><span><strong>Move freely.</strong> Use the palette, Previous/Next buttons and Mark for Review.</span></li><li><span class="checkmark">✓</span><span><strong>Auto-submit.</strong> A timed practice session submits when its selected practice timer ends.</span></li></ul><div class="notice"><strong>Official-score caution:</strong> The supplied documents confirm 100 × 1-mark model questions, but do not verify an official duration, negative marking rule or pass mark. The timer and performance bands here are study settings, not official NEC rules.</div><div class="question-meta">${dist}</div></div><aside class="card config-card"><p class="eyebrow">Session setup</p><h2>Mock configuration</h2><div class="field"><label for="mockTimer">Practice timer</label><select id="mockTimer"><option value="7200">120 minutes</option><option value="5400">90 minutes</option><option value="3600">60 minutes</option><option value="0">Untimed</option></select></div><div class="field"><label>Question selection</label><input value="Syllabus-balanced · randomized" disabled></div><button class="btn btn-primary question-footer"><button class="btn btn-secondary" data-action="prev" ${idx===0?'disabled':''}>← Previous</button>${s.mode==='exam'?`<button class="btn btn-ghost" data-action="mark">${s.marked.includes(q.id)?'Unmark review':'Mark for review'}</button>`:`<button class="btn btn-primary" data-action="check" ${checked?'disabled':''}>Check Answer</button><button class="btn btn-ghost" data-action="mark">${s.marked.includes(q.id)?'Remove from review':'Add to review'}</button>`}<button class="btn btn-secondary push" data-action="next" ${idx===s.questionIds.length-1?'disabled':''}>Next →</button><button class="btn btn-primary" data-action="finish">${s.mode==='exam'?'Submit Exam':'Finish Practice'}</button></div></article><aside class="exam-side"><div class="card timer-card"><div><small>${s.duration?'Time remaining':'Time used'}</small><div class="timer" id="timerValue">${timerText()}</div></div><div class="progress-track"><div class="progress-fill" id="timeBar" style="width:${timePercent()}%"></div></div></div><div class="card palette-card" id="paletteCard">${paletteHtml()}</div></aside></section>`;if(s.duration)startTimer()}
    function paletteHtml(){const s=appState.session;s.visited=s.visited||[s.questionIds[s.current]];const answered=Object.keys(s.answers).length,marked=s.marked.length;return `<div class="palette-head"><h3>Question palette</h3><span class="pill">${s.questionIds.length}</span></div><div class="palette-grid">${s.questionIds.map((id,i)=>`<button class="qnum ${s.answers[id]!==undefined?'answered':''} ${s.marked.includes(id)?'review':''} ${i===s.current?'current':''}" data-action="jump" data-index="${i}">${i+1}</button>`).join('')}</div><div class="palette-counts"><div class="palette-count"><strong>${answered}</strong><span>Answered</span></div><div class="palette-count"><strong>${s.questionIds.length-answered}</strong><span>Not answered</span></div><div class="palette-count"><strong>${marked}</strong><span>Review</span></div><div class="palette-count"><strong>${s.questionIds.length-s.visited.length}</strong><span>Not visited</span></div></div><div class="legend"><span><i style="background:var(--good)"></i>Answered</span><span><i style="background:var(--review)"></i>Review</span><span><i style="background:var(--accent)"></i>Current</span></div>`}
    function timerText(){const s=appState.session,elapsed=Math.max(0,Math.floor((Date.now()-s.startedAt)/1000)),seconds=s.duration?Math.max(0,s.duration-elapsed):elapsed;const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),sec=seconds%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}

    function chooseAnswer(i){const s=appState.session,q=currentQuestion();if(s.mode==='practice'&&s.checked[q.id])return;s.answers[q.id]=i;save();renderSession()}
    function changeQuestion(delta){const s=appState.session;s.current=Math.max(0,Math.min(s.questionIds.length-1,s.current+delta));s.visited=s.visited||[];if(!s.visited.includes(s.questionIds[s.current]))s.visited.push(s.questionIds[s.current]);save();renderSession();window.scrollTo(0,0)}
    function checkCurrent(){const s=appState.session,q=currentQuestion();if(s.answers[q.id]===undefined)return showToast('Select an answer before checking.');if(!s.checked[q.id]){s.checked[q.id]=true;if(!s.recorded[q.id]){recordAttempt(q.id,s.answers[q.id]===q.correct);s.recorded[q.id]=true}}save();renderSession()}
    function requestFinish(){const s=appState.session,answered=Object.keys(s.answers).length,unanswered=s.questionIds.length-answered;openModal(s.mode==='exam'?'Submit examination?':'Finish practice?',`<p>You have answered <strong>${answered} of ${s.questionIds.length}</strong> questions.</p>${unanswered?`<div class="notice">${unanswered} question${unanswered===1?' is':'s are'} unanswered.</div>`:''}`,`<button class="btn btn-secondary" data-action="closeModal">Return to session</button><button class="btn btn-primary" data-action="confirmFinish">Submit final</button>`)}
    function finishSession(auto=false){closeModal();clearInterval(timerHandle);const s=appState.session;if(!s)return;if(s.mode==='exam'){s.questionIds.forEach(id=>{if(s.answers[id]!==undefined&&!s.recorded[id]){recordAttempt(id,s.answers[id]===byId(id).correct);s.recorded[id]=true}})}else{s.questionIds.forEach(id=>{if(s.answers[id]!==undefined&&!s.recorded[id]){recordAttempt(id,s.answers[id]===byId(id).correct);s.recorded[id]=true}})}const result=buildResult(s,auto);progress.history.unshift({...result});progress.history=progress.history.slice(0,25);appState.result=result;appState.session=null;progress.activeSession=null;save();go('result')}
    function buildResult(s,auto=false){const correct=s.questionIds.filter(id=>s.answers[id]===byId(id).correct).length,answered=Object.keys(s.answers).length,total=s.questionIds.length;return{id:s.id,kind:s.kind,mode:s.mode,questionIds:s.questionIds,answers:s.answers,marked:s.marked,score:correct,total,answered,unanswered:total-answered,percentage:pct(correct,total),accuracy:pct(correct,answered),startedAt:s.startedAt,submittedAt:Date.now(),durationUsed:Math.floor((Date.now()-s.startedAt)/1000),autoSubmitted:auto}}

    function resultModuleRows(r){return syllabus.map(m=>{const ids=r.questionIds.filter(id=>byId(id)?.moduleId===m.id),correct=ids.filter(id=>r.answers[id]===byId(id).correct).length,answered=ids.filter(id=>r.answers[id]!==undefined).length;return{m,total:ids.length,correct,answered,accuracy:pct(correct,answered)}}).filter(x=>x.total)}
    function band(p){return p>=80?['Excellent','A strong result—maintain breadth and sharpen the lowest two sections.']:p>=60?['Good progress','Your foundation is working. Focus next on the weakest chapters.']:['Needs improvement','Use chapter practice and the wrong-answer notebook before the next mock.']}
    function renderResult(){const r=appState.result||progress.history[0];if(!r)return go('dashboard');appState.result=r;const [label,message]=band(r.percentage),rows=resultModuleRows(r),weak=[...rows].sort((a,b)=>a.accuracy-b.accuracy).slice(0,2);app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Submitted ${fmtDate(r.submittedAt)}</p><h1>${esc(r.kind)} Result</h1></div><button class="btn btn-secondary" data-view="dashboard">Dashboard</button></div><section class="card result-hero"><div class="result-score"><strong>${r.score}/${r.total}</strong><span>${r.percentage}% overall score</span></div><div class="result-summary"><p class="eyebrow">${label}</p><h2>${message}</h2><div class="score-breakdown"><span class="score-chip good"><b>${r.score}</b> Correct</span><span class="score-chip bad"><b>${r.answered-r.score}</b> Incorrect</span><span class="score-chip"><b>${r.unanswered}</b> Unanswered</span><span class="score-chip"><b>${r.accuracy}%</b> Answered accuracy</span><span class="score-chip"><b>${Math.floor(r.durationUsed/60)}m ${r.durationUsed%60}s</b> Time used</span></div><div class="card-actions"><button class="btn btn-primary" data-action="reviewResult">Review every question</button><button class="btn btn-secondary" data-action="weak">Practice weak topics</button></div></div></section><div class="section-title"><h2>Performance by official chapter</h2></div><section class="card performance-list">${rows.map(x=>`<div class="performance-row"><span>${x.m.id}. ${esc(x.m.title)}</span><div class="progress-track"><div class="progress-fill" style="width:${x.accuracy}%"></div></div><strong>${x.correct}/${x.total}</strong></div>`).join('')}</section><div class="recommendation"><strong>Recommended next step:</strong> Focus on ${weak.map(x=>esc(x.m.title)).join(' and ')}. Your scores in these chapters were ${weak.map(x=>x.accuracy+'%').join(' and ')}.</div>`}
    function renderReview(){const r=appState.result||progress.history[0];if(!r)return go('progress');const filter=appState.reviewFilter;const items=r.questionIds.map((id,i)=>({q:byId(id),i,answer:r.answers[id]})).filter(x=>filter==='all'||(filter==='correct'&&x.answer===x.q.correct)||(filter==='wrong'&&x.answer!==undefined&&x.answer!==x.q.correct)||(filter==='blank'&&x.answer===undefined)||(filter==='saved'&&progress.bookmarks.includes(x.q.id)));app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Answer review</p><h1>${esc(r.kind)}</h1><p class="subhead">Compare your answers with the source-backed answer key and revision notes.</p></div><button class="btn btn-secondary" data-view="result">Back to result</button></div><div class="section-title"><div class="review-filter">${[['all','All'],['correct','Correct'],['wrong','Incorrect'],['blank','Unanswered'],['saved','Bookmarked']].map(([v,l])=>`<button class="size-btn" data-action="reviewFilter" data-value="${v}" ${filter===v?'style="border-color:var(--brand);color:var(--brand)"':''}>${l}</button>`).join('')}</div><span class="muted">${items.length} questions</span></div><section class="review-list">${items.length?items.map(x=>reviewCard(x.q,x.answer,x.i+1)).join(''):`<div class="card empty"><div class="empty-mark">✓</div><h2>No questions in this view</h2><p>Choose another review filter.</p></div>`}</section>`}
    function reviewCard(q,answer,n){const status=answer===undefined?['blank','Unanswered']:answer===q.correct?['good','Correct']:['bad','Incorrect'];return `<article class="card review-card"><div class="review-top"><span class="review-status ${status[0]}">${status[1]}</span><span class="pill">Question ${n}</span><span class="pill pill-brand">${q.chapterCode}</span><button class="bookmark ${progress.bookmarks.includes(q.id)?'active':''}" data-action="bookmark" data-id="${q.id}" aria-label="Bookmark question">${progress.bookmarks.includes(q.id)?'★':'☆'}</button></div><h3>${esc(q.question)}</h3><p class="answer-line"><strong>Your answer:</strong> ${answer===undefined?'Not answered':`${'ABCD'[answer]}. ${esc(q.options[answer])}`}</p><p class="answer-line"><strong>Correct answer:</strong> ${'ABCD'[q.correct]}. ${esc(q.options[q.correct])}</p><div class="review-explanation"><strong>Explanation:</strong> ${esc(q.explanation)}<div class="exam-tip"><strong>Remember:</strong> ${esc(q.examTip.replace(/^Remember:\s*/i,''))}</div><div class="muted" style="margin-top:8px">Source: ${esc(q.source)} · ${esc(q.chapter)}</div></div></article>`}

    function filteredBank(){const f=appState.bankFilters,q=f.q.toLowerCase();return questionBank.filter(x=>(!q||`${x.question} ${x.options.join(' ')} ${x.topic}`.toLowerCase().includes(q))&&(f.module==='all'||x.moduleId===Number(f.module))&&(f.chapter==='all'||x.chapterCode===f.chapter)&&(f.difficulty==='all'||x.difficulty===f.difficulty)&&(f.source==='all'||(f.source==='past'&&x.isPastQuestion)||(f.source==='model'&&x.isModelQuestion)||(f.source==='study'&&!x.isPastQuestion&&!x.isModelQuestion))&&(f.status==='all'||(f.status==='answered'&&questionStat(x.id).attempts)||(f.status==='unanswered'&&!questionStat(x.id).attempts)||(f.status==='correct'&&questionStat(x.id).lastCorrect===true)||(f.status==='wrong'&&progress.wrong[x.id])||(f.status==='saved'&&progress.bookmarks.includes(x.id))))}
    function renderBank(){const all=filteredBank(),pages=Math.max(1,Math.ceil(all.length/30));appState.bankPage=Math.min(appState.bankPage,pages);const rows=all.slice((appState.bankPage-1)*30,appState.bankPage*30),f=appState.bankFilters;const sectionOptions=syllabus.flatMap(m=>m.sections).map(s=>`<option value="${s[0]}" ${f.chapter===s[0]?'selected':''}>${s[0]} · ${esc(s[1])}</option>`).join('');app.innerHTML=`<div class="page-head"><div><p class="eyebrow">${questionBank.length} verified items</p><h1>Question Bank</h1><p class="subhead">Search question wording and filter by official syllabus code, source, difficulty or your progress.</p></div><button class="btn btn-secondary" data-view="dashboard">Dashboard</button></div><section class="card"><div class="filters"><input id="bankSearch" value="${esc(f.q)}" placeholder="Search questions or topics…" aria-label="Search question bank"><select id="bankModule"><option value="all">All chapters</option>${syllabus.map(m=>`<option value="${m.id}" ${f.module===String(m.id)?'selected':''}>${m.id}. ${esc(m.title)}</option>`).join('')}</select><select id="bankChapter"><option value="all">All modules</option>${sectionOptions}</select><select id="bankDifficulty"><option value="all">All difficulty</option>${['easy','medium','hard'].map(v=>`<option value="${v}" ${f.difficulty===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select><select id="bankSource"><option value="all">All sources</option><option value="study" ${f.source==='study'?'selected':''}>Study notes</option><option value="model" ${f.source==='model'?'selected':''}>NEC model</option><option value="past" ${f.source==='past'?'selected':''}>Exam recall</option></select><select id="bankStatus"><option value="all">All progress</option><option value="answered" ${f.status==='answered'?'selected':''}>Answered</option><option value="unanswered" ${f.status==='unanswered'?'selected':''}>Unanswered</option><option value="correct" ${f.status==='correct'?'selected':''}>Last correct</option><option value="wrong" ${f.status==='wrong'?'selected':''}>Wrong notebook</option><option value="saved" ${f.status==='saved'?'selected':''}>Bookmarked</option></select></div><div class="section-title"><h2>${all.length} matching questions</h2><span class="muted">Page ${appState.bankPage} of ${pages}</span></div><div class="bank-list">${rows.length?rows.map(x=>`<article class="card bank-row"><span class="bank-id">${x.id}</span><div><h3>${esc(x.question)}</h3><div class="bank-tags"><span class="pill pill-brand">${x.chapterCode}</span><span class="pill">${x.difficulty}</span><span class="pill">${x.isPastQuestion?'Exam recall':x.isModelQuestion?'Model question':'Study notes'}</span></div></div><div class="bank-actions"><button class="bookmark ${progress.bookmarks.includes(x.id)?'active':''}" data-action="bookmark" data-id="${x.id}">${progress.bookmarks.includes(x.id)?'★':'☆'}</button><button class="btn btn-secondary btn-sm" data-action="openQuestion" data-id="${x.id}">Practice</button></div></article>`).join(''):`<div class="empty"><div class="empty-mark">⌕</div><h2>No matches</h2><p>Try clearing one or more filters.</p></div>`}</div><div class="pagination"><button class="btn btn-secondary btn-sm" data-action="bankPage" data-delta="-1" ${appState.bankPage===1?'disabled':''}>Previous</button><span>Page ${appState.bankPage} / ${pages}</span><button class="btn btn-secondary btn-sm" data-action="bankPage" data-delta="1" ${appState.bankPage===pages?'disabled':''}>Next</button></div></section>`}

    function renderProgress(){const s=overallStats(),mocks=progress.history.filter(x=>x.mode==='exam'),avg=mocks.length?Math.round(mocks.reduce((a,x)=>a+x.percentage,0)/mocks.length):0,best=mocks.length?Math.max(...mocks.map(x=>x.percentage)):0,recent=mocks[0]?.percentage||0;app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Performance analytics</p><h1>Progress & Test History</h1><p class="subhead">Your data stays in this browser using local storage.</p></div><button class="btn btn-danger" data-action="resetAsk">Reset all progress</button></div><section class="stats-grid"><div class="stat-card"><span>Overall accuracy</span><strong>${s.accuracy}%</strong></div><div class="stat-card"><span>Mock average</span><strong>${avg}%</strong></div><div class="stat-card"><span>Best mock</span><strong>${best}%</strong></div><div class="stat-card"><span>Recent mock</span><strong>${recent}%</strong></div></section><div class="section-title"><h2>Accuracy by official chapter</h2></div><section class="card performance-list">${syllabus.map(m=>{const x=moduleStats(m.id);return `<div class="performance-row"><span>${m.id}. ${esc(m.title)}</span><div class="progress-track"><div class="progress-fill" style="width:${x.accuracy}%"></div></div><strong>${x.attempts?x.accuracy+'%':'—'}</strong></div>`}).join('')}</section><div class="section-title"><h2>Test history</h2><span class="muted">Most recent 25 sessions</span></div><section class="card">${progress.history.length?`<div style="overflow:auto"><table><thead><tr><th>Test</th><th>Date</th><th>Score</th><th>Percentage</th><th></th></tr></thead><tbody>${progress.history.map((h,i)=>`<tr><td>${esc(h.kind)}</td><td>${fmtDate(h.submittedAt)}</td><td>${h.score}/${h.total}</td><td>${h.percentage}%</td><td><button class="btn btn-secondary btn-sm" data-action="openHistory" data-index="${i}">Open</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-mark">↗</div><h2>No completed tests yet</h2><p>Finish a Quick 10 or a full mock and the result will appear here.</p><button class="btn btn-primary" data-action="randomQuick">Start Quick 10</button></div>`}</section>`}

    function toggleBookmark(id){id=Number(id);const i=progress.bookmarks.indexOf(id);if(i>=0){progress.bookmarks.splice(i,1);showToast('Bookmark removed.')}else{progress.bookmarks.push(id);showToast('Question bookmarked.')}save();render()}
    document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-view]');if(!el)return;if(el.dataset.view){go(el.dataset.view);return}const a=el.dataset.action;if(a==='home')go('dashboard');else if(a==='theme'){progress.theme=progress.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=progress.theme;save()}else if(a==='menu')document.getElementById('topNav').classList.toggle('open');else if(a==='showModules')renderModules();else if(a==='showChapters')renderPractice();else if(a==='quick')renderQuick();else if(a==='modules')renderModules();else if(['past','wrong','bookmarks','weak'].includes(a))startCollection(a);else if(a==='randomQuick'){closeModal();const qs=syllabus.map(m=>sample(questionBank.filter(q=>q.moduleId===m.id&&!q.isPastQuestion),1)[0]).filter(Boolean);startSession(shuffle(qs),{kind:'Random Quick 10'})}else if(a==='startQuick'){const ids=curatedQuickTests[el.dataset.id];startSession(shuffle(ids.map(byId).filter(Boolean)),{kind:`Quick Test ${String(el.dataset.id).padStart(2,'0')}`})}else if(a==='startMock'){const d=Number(document.getElementById('mockTimer').value);startSession(balancedMock(),{mode:'exam',kind:`Full Mock ${String(progress.history.filter(x=>x.mode==='exam').length+1).padStart(2,'0')}`,duration:d})}else if(a==='startModule'){const pool=questionBank.filter(q=>q.moduleId===Number(el.dataset.id));const n=el.dataset.size==='all'?pool.length:Number(el.dataset.size);startSession(sample(pool,n),{kind:`${syllabus[Number(el.dataset.id)-1].title} Practice`})}else if(a==='startSection'){const pool=questionBank.filter(q=>q.chapterCode===el.dataset.code),n=el.dataset.size==='all'?pool.length:Number(el.dataset.size);startSession(sample(pool,n),{kind:`${el.dataset.code} Practice`})}else if(a==='resume'){if(appState.session)go('session')}else if(a==='answer')chooseAnswer(Number(el.dataset.index));else if(a==='prev')changeQuestion(-1);else if(a==='next')changeQuestion(1);else if(a==='jump'){appState.session.current=Number(el.dataset.index);appState.session.visited=appState.session.visited||[];if(!appState.session.visited.includes(appState.session.questionIds[appState.session.current]))appState.session.visited.push(appState.session.questionIds[appState.session.current]);save();renderSession()}else if(a==='mark'){const q=currentQuestion(),arr=appState.session.marked,i=arr.indexOf(q.id);i>=0?arr.splice(i,1):arr.push(q.id);save();renderSession()}else if(a==='bookmark')toggleBookmark(el.dataset.id);else if(a==='check')checkCurrent();else if(a==='finish')requestFinish();else if(a==='closeModal')closeModal();else if(a==='confirmFinish')finishSession(false);else if(a==='palette')document.getElementById('paletteCard')?.classList.toggle('open');else if(a==='reviewResult'){appState.reviewFilter='all';go('review')}else if(a==='reviewFilter'){appState.reviewFilter=el.dataset.value;renderReview()}else if(a==='openQuestion')startSession([byId(el.dataset.id)],{kind:'Question Bank Practice'});else if(a==='bankPage'){appState.bankPage+=Number(el.dataset.delta);renderBank();window.scrollTo(0,0)}else if(a==='openHistory'){appState.result=progress.history[Number(el.dataset.index)];go('result')}else if(a==='resetAsk')openModal('Reset all progress?',`<p>This permanently deletes attempts, scores, test history, bookmarks, wrong answers and the active session saved in this browser.</p>`,`<button class="btn btn-secondary" data-action="closeModal">Cancel</button><button class="btn btn-danger" data-action="resetNow">Reset progress</button>`);else if(a==='resetNow'){const theme=progress.theme;progress=defaultProgress();progress.theme=theme;appState.session=null;appState.result=null;save();closeModal();go('dashboard');showToast('All study progress was reset.')}});
    document.addEventListener('input',e=>{if(e.target.id==='bankSearch'){appState.bankFilters.q=e.target.value;appState.bankPage=1;renderBank();const input=document.getElementById('bankSearch');input.focus();input.setSelectionRange(input.value.length,input.value.length)}});
    document.addEventListener('change',e=>{const map={bankModule:'module',bankChapter:'chapter',bankDifficulty:'difficulty',bankSource:'source',bankStatus:'status'};if(map[e.target.id]){appState.bankFilters[map[e.target.id]]=e.target.value;appState.bankPage=1;renderBank()}});
    document.addEventListener('keydown',e=>{if(appState.view!=='session'||!appState.session||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const key=e.key.toLowerCase(),answers={a:0,'1':0,b:1,'2':1,c:2,'3':2,d:3,'4':3};if(answers[key]!==undefined){e.preventDefault();chooseAnswer(answers[key])}else if(e.key==='ArrowLeft'){e.preventDefault();changeQuestion(-1)}else if(e.key==='ArrowRight'){e.preventDefault();changeQuestion(1)}});
    (function selfCheck(){console.assert(questionBank.length>=600,'Expected a substantial question bank');console.assert(questionBank.every(q=>q.options.length===4&&q.correct>=0&&q.correct<4),'Question-bank structure invalid');const test=balancedMock();console.assert(test.length===100&&new Set(test.map(q=>q.id)).size===100,'Mock generator failed');})();
    render();setActiveNav();
  </script>
</body>
</html>
