Scale factor k is the ratio of local scale to __________.","options":["principal (nominal) scale","contour interval","ellipsoid flattening","flying height"],"correct":0,"explanation":"A projection scale factor compares local scale with the nominal or principal map scale. A factor of one means no local scale change relative to that nominal value.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":315,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Cartographic Visualization","chapterCode":"AGeE0603","topic":"Cartographic Visualization","question":"Choropleth maps typically represent statistical data by __________ enumeration areas.","options":["contour lines through","flow arrows across","proportional point symbols on","shading or colouring"],"correct":3,"explanation":"A choropleth fills defined areas according to a statistical value. Rates or normalized values usually compare regions more fairly than raw totals influenced by area or population size.","examTip":"Link this question to AGeE0603: Cartographic Visualization.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":316,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Cartographic Visualization","chapterCode":"AGeE0603","topic":"Cartographic Visualization","question":"Visual hierarchy on a map places the __________ at the highest level of importance.","options":["neatline","map face (body)","printer's mark","north arrow"],"correct":1,"explanation":"The mapped information should dominate the visual hierarchy. Supporting elements such as legend and scale must be legible without overwhelming the map body.","examTip":"Link this question to AGeE0603: Cartographic Visualization.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":317,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Generalization, Typography and Colour","chapterCode":"AGeE0604","topic":"Generalization, Typography and Colour","question":"Italic lettering on topographic maps is conventionally used for __________.","options":["cities","water features","spot heights","political boundaries"],"correct":1,"explanation":"Italic labels are a conventional way to distinguish water features on many topographic maps. Typography is a design convention, so a specific map series' legend and standards take precedence.","examTip":"Link this question to AGeE0604: Generalization, Typography and Colour.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":318,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Map Projection and Sheet Numbering","chapterCode":"AGeE0602","topic":"Map Projection and Sheet Numbering","question":"The International Map of the World (IMW) 1:1 000 000 sheets cover __________.","options":["1° × 1°","1° × 6°","4° latitude × 6° longitude","15′ × 15′"],"correct":2,"explanation":"Standard IMW million-scale sheets span 4° latitude by 6° longitude in the usual indexing scheme. Geographic extents are angular, so their ground dimensions vary with latitude.","examTip":"Link this question to AGeE0602: Map Projection and Sheet Numbering.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":319,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Cartographic Visualization","chapterCode":"AGeE0603","topic":"Cartographic Visualization","question":"Quantile classification places __________ in each class.","options":["equal numbers of observations","equal standard deviations","equal value ranges","equal areas"],"correct":0,"explanation":"Quantiles allocate approximately equal numbers of observations to each class. Class interval widths can differ substantially, which may exaggerate small value differences near a boundary.","examTip":"Link this question to AGeE0603: Cartographic Visualization.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":320,"module":"Cartography and Geo-Visualization","moduleCode":"AGeE06","moduleId":6,"chapter":"Cartographic Visualization","chapterCode":"AGeE0603","topic":"Cartographic Visualization","question":"Which statement about map enlargement is correct?","options":["Map area changes linearly with the scale ratio.","A graphical scale becomes incorrect after photographic enlargement.","Enlarging a small-scale map creates new ground detail.","Enlarging a small-scale map does not create new ground detail."],"correct":3,"explanation":"Enlargement makes existing symbols and pixels bigger but cannot recover detail absent from the source. New ground information requires better-resolution data, not just a larger print.","examTip":"Link this question to AGeE0603: Cartographic Visualization.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":321,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Fundamentals of SDBMS","chapterCode":"AGeE0701","topic":"Fundamentals of SDBMS","question":"A DBMS is software for defining, storing, querying and managing __________.","options":["only GNSS orbits","data","only field books","only paper maps"],"correct":1,"explanation":"A DBMS manages structured data and provides controlled operations for defining, storing, updating and querying it. It is software, not the dataset itself.","examTip":"Link this question to AGeE0701: Fundamentals of SDBMS.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":322,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Fundamentals of SDBMS","chapterCode":"AGeE0701","topic":"Fundamentals of SDBMS","question":"An SDBMS is a DBMS extended to store and query __________ data types.","options":["only financial","only textual","spatial (geometric)","only temporal"],"correct":2,"explanation":"Spatial extensions add geometry types, spatial predicates and indexing to database management. This lets the system ask location-based questions rather than treating coordinates as unrelated numbers.","examTip":"Link this question to AGeE0701: Fundamentals of SDBMS.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":323,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Fundamentals of SDBMS","chapterCode":"AGeE0701","topic":"Fundamentals of SDBMS","question":"The ACID properties of database transactions include Atomicity, Consistency, Isolation and __________.","options":["Distortion","Duplication","Datum","Durability"],"correct":3,"explanation":"Durability means a committed transaction survives subsequent failures under the database's guarantees. Atomicity handles all-or-nothing execution; isolation separates concurrent operations; consistency preserves declared rules.","examTip":"Link this question to AGeE0701: Fundamentals of SDBMS.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":324,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Structured Query Language","chapterCode":"AGeE0704","topic":"Structured Query Language","question":"SQL is the standard __________ language of relational databases.","options":["access/query","map-projection","gravity-reduction","photogrammetric"],"correct":0,"explanation":"SQL provides declarative operations for relational data: users state what results they want rather than every access step. It also includes schema and transaction commands.","examTip":"Link this question to AGeE0704: Structured Query Language.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":325,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Structured Query Language","chapterCode":"AGeE0704","topic":"Structured Query Language","question":"CREATE TABLE is an example of a __________ statement.","options":["DCL","DML","DDL","TCL"],"correct":2,"explanation":"CREATE TABLE defines database structure, so it is data definition language. Inserting rows changes the table's data rather than defining the table itself.","examTip":"Link this question to AGeE0704: Structured Query Language.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":326,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Structured Query Language","chapterCode":"AGeE0704","topic":"Structured Query Language","question":"SELECT is primarily a __________ statement.","options":["DQL","TCL","DDL","DCL"],"correct":0,"explanation":"SELECT retrieves results and is commonly classified as data query language. Some classifications include querying within DML, so the terminology depends on the convention used.","examTip":"Link this question to AGeE0704: Structured Query Language.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":327,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Structured Query Language","chapterCode":"AGeE0704","topic":"Structured Query Language","question":"GRANT and REVOKE belong to __________.","options":["DML","DCL","TCL","DDL"],"correct":1,"explanation":"GRANT gives privileges and REVOKE removes them. Because they control access rather than data values, they are grouped as data control language.","examTip":"Link this question to AGeE0704: Structured Query Language.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":328,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Structured Query Language","chapterCode":"AGeE0704","topic":"Structured Query Language","question":"COMMIT and ROLLBACK belong to __________.","options":["DDL","DCL","DQL","TCL"],"correct":3,"explanation":"COMMIT makes a transaction permanent; ROLLBACK undoes uncommitted work. These manage transaction boundaries, so they are transaction control commands.","examTip":"Link this question to AGeE0704: Structured Query Language.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":329,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Structured Query Language","chapterCode":"AGeE0704","topic":"Structured Query Language","question":"A primary key uniquely identifies each __________ in a table.","options":["index","column","database","row"],"correct":3,"explanation":"A primary key uniquely identifies a row and cannot be null. It may consist of one column or several columns together.","examTip":"Link this question to AGeE0704: Structured Query Language.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":330,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Structured Query Language","chapterCode":"AGeE0704","topic":"Structured Query Language","question":"A foreign key enforces __________ integrity between tables.","options":["referential","spatial","entity","domain"],"correct":0,"explanation":"A foreign key requires referenced values to correspond to valid parent-table keys, subject to null rules. This prevents orphan references and enforces referential integrity.","examTip":"Link this question to AGeE0704: Structured Query Language.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":331,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Data Models","chapterCode":"AGeE0703","topic":"Data Models","question":"The relational data model was proposed by __________ in 1970.","options":["Mercator","Gauss","E. F. Codd","Bertin"],"correct":2,"explanation":"Codd's 1970 relational model organized information using relations rather than navigational storage links. This became the theoretical foundation of relational database systems.","examTip":"Link this question to AGeE0703: Data Models.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":332,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Data Models","chapterCode":"AGeE0703","topic":"Data Models","question":"The hierarchical data model organizes data as a __________.","options":["table","tree (parent–child)","raster","graph of many-to-many sets only"],"correct":1,"explanation":"A hierarchical model arranges records in a parent–child tree. A child normally has one parent, unlike network models that can represent more complex links.","examTip":"Link this question to AGeE0703: Data Models.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":333,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Data Models","chapterCode":"AGeE0703","topic":"Data Models","question":"An Entity–Relationship (E–R) model is used mainly at the __________ design stage.","options":["physical printing","flight-planning","press-plate","conceptual"],"correct":3,"explanation":"An ER model identifies entities, attributes and relationships before choosing physical storage details. It is therefore a conceptual database-design tool.","examTip":"Link this question to AGeE0703: Data Models.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":334,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Data Infrastructure","chapterCode":"AGeE0702","topic":"Spatial Data Infrastructure","question":"An SDI is the framework of technologies, policies, standards and institutional arrangements for __________ geospatial data.","options":["encrypting only","surveying only","sharing and using","destroying"],"correct":2,"explanation":"An SDI combines governance, standards, people and technology so geospatial information can be found and reused. A server or dataset alone is not an infrastructure.","examTip":"Link this question to AGeE0702: Spatial Data Infrastructure.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":335,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Data Infrastructure","chapterCode":"AGeE0702","topic":"Spatial Data Infrastructure","question":"Metadata is commonly described as __________.","options":["a type of contour","data about data","a map projection","raw GNSS observables"],"correct":1,"explanation":"Metadata describes a dataset's meaning, coverage, reference system, quality, provenance and access conditions. It helps a user judge whether the data fit a purpose.","examTip":"Link this question to AGeE0702: Spatial Data Infrastructure.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":336,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Data Infrastructure","chapterCode":"AGeE0702","topic":"Spatial Data Infrastructure","question":"The ISO standard commonly cited for geographic metadata is __________.","options":["ISO 19115","ISO 9001","ISO 19107 only","ISO 14001"],"correct":0,"explanation":"ISO 19115 defines geographic-information metadata concepts. Do not confuse the conceptual metadata standard with specific XML encoding implementations.","examTip":"Link this question to AGeE0702: Spatial Data Infrastructure.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":337,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Data Infrastructure","chapterCode":"AGeE0702","topic":"Spatial Data Infrastructure","question":"Interoperability is the ability of different systems to __________ data.","options":["print only","exchange and use","delete","hide"],"correct":1,"explanation":"Interoperability requires both exchanging information and interpreting/using it correctly. Moving a file is not enough if units, coordinate systems or meanings remain incompatible.","examTip":"Link this question to AGeE0702: Spatial Data Infrastructure.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":338,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Database Technology","chapterCode":"AGeE0705","topic":"Spatial Database Technology","question":"The OGC Simple Features model includes Point, LineString, Polygon and their __________ types.","options":["raster","gravity","attribute-only","Multi* (collection)"],"correct":3,"explanation":"Simple Features includes basic geometries and collections such as MultiPoint, MultiLineString and MultiPolygon. These represent multiple components of the same broad geometry type.","examTip":"Link this question to AGeE0705: Spatial Database Technology.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":339,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Database Technology","chapterCode":"AGeE0705","topic":"Spatial Database Technology","question":"SRID in a spatial database encodes the __________.","options":["flying height","contour interval","spatial reference system","owner's name"],"correct":2,"explanation":"An SRID identifies a spatial reference system known to the database. Assigning an SRID label does not itself transform coordinates into that system.","examTip":"Link this question to AGeE0705: Spatial Database Technology.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":340,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Database Technology","chapterCode":"AGeE0705","topic":"Spatial Database Technology","question":"A spatial join combines tables using a __________ rather than an attribute key.","options":["spatial predicate","primary key only","sheet number","password"],"correct":0,"explanation":"A spatial join links records through relationships such as within, intersects or nearest. An attribute join instead matches stored key values.","examTip":"Link this question to AGeE0705: Spatial Database Technology.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":341,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Database Technology","chapterCode":"AGeE0705","topic":"Spatial Database Technology","question":"The standard spatial index used in PostGIS (GiST) is the __________.","options":["bitmap only","R-tree","hash only","B-tree only"],"correct":1,"explanation":"PostGIS commonly uses R-tree-style bounding-box indexing implemented through GiST. Bounding boxes narrow candidates; exact geometry tests can then refine the result.","examTip":"Link this question to AGeE0705: Spatial Database Technology.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":342,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Database Technology","chapterCode":"AGeE0705","topic":"Spatial Database Technology","question":"PostGIS is a spatial extension of the open-source RDBMS __________.","options":["Oracle only","MySQL only","SQLite only","PostgreSQL"],"correct":3,"explanation":"PostGIS extends PostgreSQL with spatial types, indexes and functions. PostgreSQL supplies the relational database engine and transaction support.","examTip":"Link this question to AGeE0705: Spatial Database Technology.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":343,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Database Technology","chapterCode":"AGeE0705","topic":"Spatial Database Technology","question":"ST_Area, ST_Buffer and ST_Intersects are examples of __________ functions.","options":["PERT","map-algebra","PostGIS/OGC spatial","Kalman-filter"],"correct":2,"explanation":"These functions calculate area, construct distance zones and test intersection. They operate on geometries rather than only on scalar attributes like names or prices.","examTip":"Link this question to AGeE0705: Spatial Database Technology.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":344,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Database Technology","chapterCode":"AGeE0705","topic":"Spatial Database Technology","question":"An ORDBMS is a relational DBMS extended with __________ features.","options":["object (user-defined types and functions)","only cadastral","only magnetic","only paper"],"correct":0,"explanation":"Object-relational systems retain relational tables while supporting richer user-defined types and behaviour. This makes geometry types and associated operations natural database extensions.","examTip":"Link this question to AGeE0705: Spatial Database Technology.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":345,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Data Infrastructure","chapterCode":"AGeE0702","topic":"Spatial Data Infrastructure","question":"A national SDI clearinghouse is typically implemented as a __________ for discovery and access.","options":["gravimeter","field book","theodolite","geoportal"],"correct":3,"explanation":"A geoportal provides discovery and access to datasets and services, often through metadata catalogues. It need not physically store every dataset it describes.","examTip":"Link this question to AGeE0702: Spatial Data Infrastructure.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":346,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Data Models","chapterCode":"AGeE0703","topic":"Data Models","question":"UML class diagrams are widely used for __________ of spatial databases.","options":["flight planning","printing","object-oriented design","spirit levelling"],"correct":2,"explanation":"UML class diagrams describe classes, attributes and relationships. They help express object-oriented conceptual schemas before implementing spatial database tables and constraints.","examTip":"Link this question to AGeE0703: Data Models.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":347,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Structured Query Language","chapterCode":"AGeE0704","topic":"Structured Query Language","question":"NOT NULL, UNIQUE, CHECK and DEFAULT are examples of database __________.","options":["projections","constraints","datums","indexes"],"correct":1,"explanation":"NOT NULL, UNIQUE and CHECK constrain allowed data. DEFAULT supplies an initial value rather than validating one, so it is often discussed alongside constraints but is not a constraint in every SQL system.","examTip":"Link this question to AGeE0704: Structured Query Language.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":348,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Structured Query Language","chapterCode":"AGeE0704","topic":"Structured Query Language","question":"A composite key is a key composed of __________ columns.","options":["multiple","no","only spatial","only temporal"],"correct":0,"explanation":"A composite key uses the combination of multiple columns for uniqueness. Individual component values may repeat even though the complete combination cannot.","examTip":"Link this question to AGeE0704: Structured Query Language.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":349,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"National Spatial Data Infrastructure","chapterCode":"AGeE0706","topic":"National Spatial Data Infrastructure","question":"Four parcels of 508.72 m² each have a combined area of __________ hectares.","options":["20.35 ha","0.2035 ha","0.0204 ha","2.035 ha"],"correct":1,"explanation":"Total area = 4 × 508.72 = 2034.88 m². Since 1 ha = 10 000 m², the result is 0.203488 ha, approximately 0.2035 ha.","examTip":"Link this question to AGeE0706: National Spatial Data Infrastructure.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":350,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Structured Query Language","chapterCode":"AGeE0704","topic":"Structured Query Language","question":"Which SQL clause filters groups after aggregation?","options":["WHERE","JOIN","HAVING","FROM"],"correct":2,"explanation":"WHERE filters rows before grouping; HAVING filters aggregated groups. For example, HAVING COUNT(*) > 5 selects groups with more than five members.","examTip":"Link this question to AGeE0704: Structured Query Language.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":351,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Data Infrastructure","chapterCode":"AGeE0702","topic":"Spatial Data Infrastructure","question":"CSW in an SDI context is a service for __________.","options":["curve setting-out","printing plates","carrier-phase tracking","catalogue / metadata search"],"correct":3,"explanation":"Catalogue Service for the Web supports discovery through metadata queries. It identifies suitable resources rather than directly performing map rendering or spatial analysis.","examTip":"Link this question to AGeE0702: Spatial Data Infrastructure.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":352,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Data Infrastructure","chapterCode":"AGeE0702","topic":"Spatial Data Infrastructure","question":"Accessibility of SDI data requires that datasets are discoverable, obtainable and __________.","options":["legally accessible (licensed)","secret","unprojected","unattributed"],"correct":0,"explanation":"A discoverable dataset may still have licence or access restrictions. Practical accessibility includes a lawful way to obtain and use it, not just knowing that it exists.","examTip":"Link this question to AGeE0702: Spatial Data Infrastructure.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":353,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Data Models","chapterCode":"AGeE0703","topic":"Data Models","question":"A candidate key is any column, or set of columns, that could serve as a __________.","options":["primary key","spatial join","metadata record","foreign index"],"correct":0,"explanation":"A candidate key is a minimal set of attributes uniquely identifying a row. One is selected as the primary key; the other candidates remain possible unique identifiers.","examTip":"Link this question to AGeE0703: Data Models.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":354,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Data Models","chapterCode":"AGeE0703","topic":"Data Models","question":"The network data model represents data as a __________ allowing many-to-many links.","options":["TIN only","graph (sets)","tree only","raster"],"correct":1,"explanation":"The network model allows records to participate in multiple linked sets, forming graph-like relationships. This is more flexible than a single-parent hierarchy.","examTip":"Link this question to AGeE0703: Data Models.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":355,"module":"Spatial Data Management and Spatial Data Infrastructure","moduleCode":"AGeE07","moduleId":7,"chapter":"Spatial Data Infrastructure","chapterCode":"AGeE0702","topic":"Spatial Data Infrastructure","question":"Which of the following is NOT a typical SDI component?","options":["Standards and metadata","People (custodians and users)","Policies for access and licensing","Ionospheric scintillation only"],"correct":3,"explanation":"Ionospheric scintillation is a GNSS propagation phenomenon. SDI components concern data, metadata, standards, access technology, people and institutional coordination.","examTip":"Link this question to AGeE0702: Spatial Data Infrastructure.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":356,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"GIS Fundamentals","chapterCode":"AGeE0801","topic":"GIS Fundamentals","question":"A GIS is an integrated system of hardware, software, data, people and __________ for managing spatially referenced data.","options":["satellites only","only printers","procedures (methods)","only field books"],"correct":2,"explanation":"Procedures specify how people collect, validate, manage and analyse data using GIS hardware and software. Technology alone does not produce a dependable information system.","examTip":"Link this question to AGeE0801: GIS Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":357,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"GIS Fundamentals","chapterCode":"AGeE0801","topic":"GIS Fundamentals","question":"Among GIS components, __________ is generally considered the most valuable.","options":["the plotter","the title block","data","the mouse"],"correct":2,"explanation":"The supplied notes emphasize data because collecting and maintaining reliable geographic information is costly and central to results. This is a teaching emphasis, not a universal ranking above skilled people.","examTip":"Link this question to AGeE0801: GIS Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":358,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"GIS Fundamentals","chapterCode":"AGeE0801","topic":"GIS Fundamentals","question":"The first true GIS is commonly identified as the 1960s __________.","options":["Canada Geographic Information System (CGIS)","QGIS","ArcGIS Online","Google Earth"],"correct":0,"explanation":"CGIS was an early operational geographic information system developed for Canadian land inventory work. Its importance lies in computer-based storage and analysis, not simply digital map drawing.","examTip":"Link this question to AGeE0801: GIS Fundamentals.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":359,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"GIS Fundamentals","chapterCode":"AGeE0801","topic":"GIS Fundamentals","question":"Georeferencing assigns __________ to spatial data.","options":["DOP values","parcel identifiers only","colours only","real-world coordinates"],"correct":3,"explanation":"Georeferencing ties an image or dataset to known real-world coordinates. It requires control and a coordinate reference system, rather than merely naming the file after a place.","examTip":"Link this question to AGeE0801: GIS Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":360,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"GIS Fundamentals","chapterCode":"AGeE0801","topic":"GIS Fundamentals","question":"Shapefile, GeoJSON, KML and GeoPackage are examples of __________ data formats.","options":["gravity","vector","GNSS-only","raster"],"correct":1,"explanation":"These formats can store vector features such as points, lines and polygons. Some, particularly GeoPackage, can also contain other data types, so vector is not an exclusive capability claim.","examTip":"Link this question to AGeE0801: GIS Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":361,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"GIS Fundamentals","chapterCode":"AGeE0801","topic":"GIS Fundamentals","question":"GeoTIFF is a widely used __________ format.","options":["cadastral-deed","SQL","raster","vector"],"correct":2,"explanation":"GeoTIFF embeds geographic referencing information in TIFF raster imagery. Raster data represent a grid of cells, unlike separate vector feature geometries.","examTip":"Link this question to AGeE0801: GIS Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":362,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"GIS Fundamentals","chapterCode":"AGeE0801","topic":"GIS Fundamentals","question":"Topology describes spatial relationships that are invariant under continuous deformation, namely connectivity, adjacency and __________.","options":["scale","containment","hue","colour"],"correct":1,"explanation":"Topology concerns relationships such as connection, shared boundaries and containment. These can remain unchanged when shapes stretch, unlike exact lengths or angles.","examTip":"Link this question to AGeE0801: GIS Fundamentals.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":363,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Data Sources and Spatial Data Models","chapterCode":"AGeE0802","topic":"Data Sources and Spatial Data Models","question":"A field-based spatial model represents continuously varying phenomena and is typically implemented as __________.","options":["WFS transactions only","cadastral parcels only","deed registers","raster or TIN"],"correct":3,"explanation":"A field assigns a value throughout space, such as elevation or temperature. Raster grids and triangulated surfaces approximate that continuous variation.","examTip":"Link this question to AGeE0802: Data Sources and Spatial Data Models.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":364,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Data Sources and Spatial Data Models","chapterCode":"AGeE0802","topic":"Data Sources and Spatial Data Models","question":"An object-based model represents discrete entities with boundaries and is typically implemented as __________.","options":["vector","a histogram","raster DEM only","a semivariogram only"],"correct":0,"explanation":"Object models represent identifiable entities such as parcels, roads and wells. Vector geometries provide boundaries or locations linked to each object's attributes.","examTip":"Link this question to AGeE0802: Data Sources and Spatial Data Models.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":365,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Data Sources and Spatial Data Models","chapterCode":"AGeE0802","topic":"Data Sources and Spatial Data Models","question":"A TIN is a network of irregular triangles built from mass points and __________.","options":["satellites","pixels only","contours only, without points","breaklines"],"correct":3,"explanation":"TIN vertices sample elevations, while breaklines constrain important terrain discontinuities. Triangles should respect those lines so interpolation does not smooth across a ridge or channel incorrectly.","examTip":"Link this question to AGeE0802: Data Sources and Spatial Data Models.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":366,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Transformation and Geospatial Analysis","chapterCode":"AGeE0803","topic":"Transformation and Geospatial Analysis","question":"A two-dimensional affine transformation has __________ parameters.","options":["6","3","4","7"],"correct":0,"explanation":"A 2D affine model uses x′ = a + bx + cy and y′ = d + ex + fy. The six coefficients allow translation, rotation, scaling and shear.","examTip":"Link this question to AGeE0803: Transformation and Geospatial Analysis.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":367,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Transformation and Geospatial Analysis","chapterCode":"AGeE0803","topic":"Transformation and Geospatial Analysis","question":"The quality of an affine fit from control points is commonly expressed by the __________ of residuals.","options":["contour interval","RMS error","DOP","NDVI"],"correct":1,"explanation":"RMS residual summarizes disagreement between transformed and control coordinates. Small fitted residuals do not guarantee accuracy at independent check points or outside the control extent.","examTip":"Link this question to AGeE0803: Transformation and Geospatial Analysis.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":368,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Transformation and Geospatial Analysis","chapterCode":"AGeE0803","topic":"Transformation and Geospatial Analysis","question":"Rubber sheeting is a __________ geometric correction.","options":["gravity","3-D Helmert","non-rigid local","global conformal"],"correct":2,"explanation":"Rubber sheeting locally deforms a map to fit control points. Because distortion can vary across the map, it is non-rigid rather than one global similarity transform.","examTip":"Link this question to AGeE0803: Transformation and Geospatial Analysis.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":369,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Transformation and Geospatial Analysis","chapterCode":"AGeE0803","topic":"Transformation and Geospatial Analysis","question":"Vector overlay operations include union, intersection, clip and __________.","options":["PERT","erase","kriging","hillshade"],"correct":1,"explanation":"Erase removes portions overlapped by another feature. Union retains combined areas; intersection keeps common areas; clip extracts content within a boundary.","examTip":"Link this question to AGeE0803: Transformation and Geospatial Analysis.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":370,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Transformation and Geospatial Analysis","chapterCode":"AGeE0803","topic":"Transformation and Geospatial Analysis","question":"Map algebra refers to cell-by-cell operations performed on __________ layers.","options":["raster","cadastral-deed","GNSS-orbit","vector-only"],"correct":0,"explanation":"Map algebra combines raster values through local, neighbourhood or broader operations. The simplest case applies a formula to corresponding cells in aligned grids.","examTip":"Link this question to AGeE0803: Transformation and Geospatial Analysis.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":371,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Transformation and Geospatial Analysis","chapterCode":"AGeE0803","topic":"Transformation and Geospatial Analysis","question":"The classic algorithm for shortest-path network analysis is __________.","options":["Newton–Raphson","Simpson","Dijkstra","Helmert"],"correct":2,"explanation":"Dijkstra's algorithm finds shortest paths with non-negative edge weights. The weight can represent distance, travel time or another cost, so shortest need not mean geometrically nearest.","examTip":"Link this question to AGeE0803: Transformation and Geospatial Analysis.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":372,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Surface Modelling","chapterCode":"AGeE0804","topic":"Surface Modelling","question":"Slope of a surface is the magnitude of the elevation __________.","options":["datum","Laplacian","histogram","gradient"],"correct":3,"explanation":"The gradient describes rate and direction of elevation change. Its magnitude gives steepness, from which percent slope or slope angle can be calculated.","examTip":"Link this question to AGeE0804: Surface Modelling.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":373,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Surface Modelling","chapterCode":"AGeE0804","topic":"Surface Modelling","question":"Aspect is the compass direction of __________.","options":["magnetic north","steepest descent","the central meridian","the flight line"],"correct":1,"explanation":"Aspect points downhill in the direction of greatest elevation decrease. It is undefined or conventionally coded specially on a perfectly flat surface.","examTip":"Link this question to AGeE0804: Surface Modelling.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":374,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Surface Modelling","chapterCode":"AGeE0804","topic":"Surface Modelling","question":"Two points 300 m apart horizontally differ in elevation by 60 m. The percent slope is __________.","options":["20%","5%","30%","60%"],"correct":0,"explanation":"Percent slope = rise/horizontal run × 100 = 60/300 × 100 = 20%. It is not an angle of 20 degrees.","examTip":"Link this question to AGeE0804: Surface Modelling.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":375,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Surface Modelling","chapterCode":"AGeE0804","topic":"Surface Modelling","question":"Two points 300 m apart horizontally differ in elevation by 60 m. The slope angle is approximately __________.","options":["20.0°","30.0°","5.7°","11.3°"],"correct":3,"explanation":"Slope angle = arctan(60/300) = arctan(0.2) ≈ 11.31°. Use horizontal run, not the sloping distance, in this ratio.","examTip":"Link this question to AGeE0804: Surface Modelling.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":376,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Surface Modelling","chapterCode":"AGeE0804","topic":"Surface Modelling","question":"Hillshade simulates illumination of a DEM using a sun __________ and altitude.","options":["ellipsoid","datum","azimuth","scale factor"],"correct":2,"explanation":"Hillshade combines terrain slope/aspect with a chosen illumination azimuth and altitude. It is a simulated visual aid, not an additional measured elevation surface.","examTip":"Link this question to AGeE0804: Surface Modelling.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":377,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Surface Modelling","chapterCode":"AGeE0804","topic":"Surface Modelling","question":"Viewshed analysis determines cells __________ from one or more observer points.","options":["taxed","classified","visible","flooded"],"correct":2,"explanation":"A viewshed checks whether terrain blocks lines of sight from an observer. Results depend on observer height, terrain resolution and whether buildings or vegetation are included.","examTip":"Link this question to AGeE0804: Surface Modelling.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":378,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Surface Modelling","chapterCode":"AGeE0804","topic":"Surface Modelling","question":"A typical watershed-delineation sequence is: fill sinks → flow direction → flow accumulation → __________.","options":["kriging","basin/stream extraction","bundle adjustment","affine transform"],"correct":1,"explanation":"A typical terrain workflow conditions problematic depressions, computes drainage directions and accumulation, then extracts streams and basins. Real depressions should not be removed blindly.","examTip":"Link this question to AGeE0804: Surface Modelling.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":379,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Surface Modelling","chapterCode":"AGeE0804","topic":"Surface Modelling","question":"The D8 algorithm is used to compute __________ on a DEM.","options":["NDVI","kappa","DOP","flow direction"],"correct":3,"explanation":"D8 sends flow from each cell to one of its eight neighbours, usually the steepest downslope one. This discretizes flow direction into eight possible directions.","examTip":"Link this question to AGeE0804: Surface Modelling.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":380,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"Interpolation estimates values at __________ locations from known samples.","options":["unsampled","only ocean","only sampled","only cadastral"],"correct":0,"explanation":"Interpolation predicts values inside the sampled spatial domain using nearby observations and a model. Prediction beyond that domain is extrapolation and often less reliable.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":381,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"Resampling recomputes cell values when a raster changes __________ or orientation.","options":["datum name only","owner","resolution","file format only, without geometry"],"correct":2,"explanation":"When a raster is moved, rotated or resized, its new cells rarely coincide with original centres. Resampling assigns their values using a chosen method such as nearest neighbour or bilinear interpolation.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":382,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"The semivariogram quantifies spatial __________ as a function of lag distance.","options":["dependence (dissimilarity)","map scale","flying height","colour"],"correct":0,"explanation":"A semivariogram summarizes half the expected squared difference between values separated by a lag. Increasing semivariance generally indicates decreasing similarity over distance.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":383,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"In a semivariogram, the nugget represents variance at __________.","options":["infinite distance","lag approaching zero","the sill only","the range only"],"correct":1,"explanation":"The nugget is a nonzero limiting discontinuity near zero separation, often reflecting measurement error or variation below the sampling scale. It is not the range distance.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":384,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"The sill of a semivariogram is the __________ variance reached at large lags.","options":["infinite","zero","negative","plateau (total)"],"correct":3,"explanation":"The sill is the plateau reached by a bounded variogram model, commonly the total variance. Some models do not reach a finite sill, so the interpretation is model-dependent.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":385,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"The range of a semivariogram is the distance beyond which data are essentially __________.","options":["always higher","identical","uncorrelated","always lower"],"correct":2,"explanation":"The range marks where a bounded variogram reaches its sill and spatial correlation becomes negligible under that model. It is not the maximum distance between any two samples.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":386,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"Kriging is described as a __________ estimator.","options":["graphical only","biased nonlinear","purely deterministic with no variance","best linear unbiased (BLUE)"],"correct":3,"explanation":"Given its covariance/variogram assumptions, kriging minimizes prediction variance among linear unbiased estimators. The label BLUE does not mean it outperforms every method for every dataset.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":387,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"Ordinary kriging assumes an unknown but locally __________ mean.","options":["zero","constant","infinite","quadratic"],"correct":1,"explanation":"Ordinary kriging estimates with an unknown constant local mean. A systematic spatial trend violates that simple assumption and may require detrending or a different model.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":388,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"Universal kriging models a deterministic __________ plus a residual.","options":["trend (drift)","nugget only","map legend","sheet number"],"correct":0,"explanation":"Universal kriging adds a deterministic spatial trend to a correlated residual model. Ordinary kriging instead uses a locally constant unknown mean.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":389,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"IDW interpolation assigns weights inversely proportional to __________.","options":["a power of distance","elevation","area","hue"],"correct":0,"explanation":"IDW assigns weights proportional to 1/dᵖ, then normalizes them to sum to one. A larger power increases the influence of nearby samples relative to distant ones.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":390,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"Breaklines in a DTM are linear features of abrupt slope change that triangles must not __________.","options":["densify","cross","follow","snap to"],"correct":1,"explanation":"A breakline forces triangle edges to follow an abrupt terrain change. Allowing triangles to cross it can interpolate unrealistic elevations across a ridge, bank or drainage channel.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":391,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Open GIS","chapterCode":"AGeE0806","topic":"Open GIS","question":"QGIS is an example of an open-source __________ GIS.","options":["GNSS receiver","server-only","desktop","gravimeter"],"correct":2,"explanation":"QGIS is a desktop application for viewing, editing and analysing geospatial data. Open source concerns its software licence, not a guarantee that every dataset used with it is freely licensed.","examTip":"Link this question to AGeE0806: Open GIS.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":392,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Open GIS","chapterCode":"AGeE0806","topic":"Open GIS","question":"GeoServer is used primarily to publish spatial data as __________ services.","options":["only printing","only GNSS","only CAD","OGC web"],"correct":3,"explanation":"GeoServer publishes geospatial layers through web-service interfaces such as WMS and WFS. It plays a server role rather than replacing every desktop analysis workflow.","examTip":"Link this question to AGeE0806: Open GIS.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":393,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Open GIS","chapterCode":"AGeE0806","topic":"Open GIS","question":"SLD (Styled Layer Descriptor) is an OGC standard that describes __________ of a layer.","options":["symbolization/rendering","topology only","datum transformation","ambiguity resolution"],"correct":0,"explanation":"SLD defines how spatial features should be portrayed, such as colours, line widths and rules. It styles data but does not change the underlying feature geometry.","examTip":"Link this question to AGeE0806: Open GIS.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":394,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"GIS Fundamentals","chapterCode":"AGeE0801","topic":"GIS Fundamentals","question":"Data quality elements include positional accuracy, attribute accuracy, logical consistency, completeness, temporal accuracy and __________.","options":["flying height","DOP","ink density","lineage"],"correct":3,"explanation":"Lineage explains data origin and processing and supports quality assessment. Formal standards may organize lineage separately from measured quality elements, so this list is a study summary rather than a strict schema.","examTip":"Link this question to AGeE0801: GIS Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":395,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"GIS Fundamentals","chapterCode":"AGeE0801","topic":"GIS Fundamentals","question":"Lineage of a GIS dataset documents its __________.","options":["font","sheet size","history of compilation and processing","colour"],"correct":2,"explanation":"Lineage records sources, transformations, edits and processing history. This helps users trace errors and judge whether a dataset is suitable for a new application.","examTip":"Link this question to AGeE0801: GIS Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":396,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Transformation and Geospatial Analysis","chapterCode":"AGeE0803","topic":"Transformation and Geospatial Analysis","question":"Buffer analysis creates a zone of specified __________ around a feature.","options":["colour","distance","scale factor","elevation only"],"correct":1,"explanation":"A buffer constructs all locations within a specified distance of a feature. The CRS and units matter: a numeric distance in degrees is not automatically a distance in metres.","examTip":"Link this question to AGeE0803: Transformation and Geospatial Analysis.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":397,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Surface Modelling","chapterCode":"AGeE0804","topic":"Surface Modelling","question":"Profile curvature is curvature along the direction of __________ slope.","options":["contour","maximum","magnetic","zero"],"correct":1,"explanation":"Profile curvature follows the direction of steepest slope and describes how that slope changes. Plan curvature instead examines curvature across the slope and relates to flow convergence.","examTip":"Link this question to AGeE0804: Surface Modelling.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":398,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Spatial Interpolation and DTM","chapterCode":"AGeE0805","topic":"Spatial Interpolation and DTM","question":"A semivariogram with nugget 0.2, sill 1.0 and range 800 m implies that beyond 800 m the expected dissimilarity is about __________.","options":["800","0.2","1.0","0.0"],"correct":2,"explanation":"Once separation exceeds the 800 m range, the bounded model approaches its sill of 1.0. The nugget 0.2 concerns near-zero separation, not long-distance dissimilarity.","examTip":"Link this question to AGeE0805: Spatial Interpolation and DTM.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":399,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Transformation and Geospatial Analysis","chapterCode":"AGeE0803","topic":"Transformation and Geospatial Analysis","question":"A combined GIS query uses both __________ and spatial conditions.","options":["attribute","only temporal","only legal","only graphic"],"correct":0,"explanation":"A combined query might select parcels larger than 500 m² that intersect a flood zone. The area condition is attribute-based and the intersection condition is spatial.","examTip":"Link this question to AGeE0803: Transformation and Geospatial Analysis.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":400,"module":"Geographic Information System","moduleCode":"AGeE08","moduleId":8,"chapter":"Open GIS","chapterCode":"AGeE0806","topic":"Open GIS","question":"Which of the following is NOT a typical open-source GIS component?","options":["QGIS","GeoServer","PostGIS","A proprietary hardware lock (dongle) as a required component"],"correct":3,"explanation":"A proprietary hardware dongle is not a required element of an open-source GIS architecture. The defining components concern software, data and interoperable services, not a mandatory vendor lock.","examTip":"Link this question to AGeE0806: Open GIS.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":401,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Engineering Survey Fundamentals","chapterCode":"AGeE0901","topic":"Engineering Survey Fundamentals","question":"The first stage of an engineering survey, used to compare route or site options, is the __________ survey.","options":["precise deformation","preliminary (reconnaissance)","cadastral mutation","as-built"],"correct":1,"explanation":"Reconnaissance and preliminary surveys explore alternatives and constraints before detailed design measurements. They establish where and how to investigate further, rather than recording completed construction.","examTip":"Link this question to AGeE0901: Engineering Survey Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":402,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Engineering Survey Fundamentals","chapterCode":"AGeE0901","topic":"Engineering Survey Fundamentals","question":"Transfer of a design to the ground by marking alignments and levels is called __________.","options":["reconnaissance","mutation","setting out (stakeout)","photogrammetry"],"correct":2,"explanation":"Setting out translates design coordinates, alignments and levels into physical site marks. An as-built survey performs the reverse comparison by measuring what was constructed.","examTip":"Link this question to AGeE0901: Engineering Survey Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":403,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Engineering Survey Fundamentals","chapterCode":"AGeE0901","topic":"Engineering Survey Fundamentals","question":"An as-built survey records the __________ constructed geometry.","options":["magnetic","cadastral","proposed","actual"],"correct":3,"explanation":"An as-built survey records actual completed positions and dimensions. Comparing them with design identifies deviations; copying design coordinates does not constitute an as-built survey.","examTip":"Link this question to AGeE0901: Engineering Survey Fundamentals.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":404,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"An echo sounder computes depth from __________.","options":["two-way travel time of an acoustic pulse","magnetic declination","GNSS pseudorange only","staff readings"],"correct":0,"explanation":"An echo sounder sends a sound pulse and measures its return time from the bed. Depth calculation must account for two-way travel and the instrument's depth below the reference water surface.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":405,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"The echo-sounder formula is d = __________, where v is sound velocity and t is two-way travel time.","options":["vt/2","vt","v/t","2vt"],"correct":0,"explanation":"The pulse travels down and back, so the total path vt is twice the transducer-to-bed distance. Dividing by two gives d = vt/2.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":406,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"Sound velocity in water is approximately __________.","options":["330 m/s","1500 m/s","5000 m/s","3 × 108 m/s"],"correct":1,"explanation":"About 1500 m/s is a useful water sound-speed approximation. Temperature, salinity and pressure change the actual value, so hydrographic work needs appropriate calibration or profiles.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":407,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"An echo sounder records a two-way travel time of 0.12 s. Taking v = 1500 m/s, the water depth is __________.","options":["180 m","12 m","360 m","90 m"],"correct":3,"explanation":"Depth below the transducer = 1500 × 0.12/2 = 90 m. Draft, water-level and other corrections are needed to reference the sounding to a survey datum.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":408,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"Discharge in a river is computed as __________.","options":["A + V","A / V","A × V","V / A"],"correct":2,"explanation":"Discharge is flow area times mean velocity: Q = A V. More generally, integrate velocity across the section when it varies spatially.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"hard","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":409,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"A river cross-section of area 84 m² with mean velocity 1.6 m/s has a discharge of __________.","options":["134.4 m³/s","52.5 m³/s","85.6 m³/s","168.0 m³/s"],"correct":0,"explanation":"Q = 84 m² × 1.6 m/s = 134.4 m³/s. Area multiplied by velocity produces volume per unit time.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":410,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"With a current meter, a common single-point mean-velocity observation is made at a depth of __________.","options":["the water surface only","0.2 d","0.8 d","0.6 d"],"correct":3,"explanation":"A measurement at 0.6 of total depth below the surface approximates mean velocity in a vertical under typical conditions. It is not 0.6 depth above the riverbed.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":411,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"The two-point current-meter method averages velocities at __________.","options":["0.3 d and 0.7 d","0.5 d and 1.0 d","0.2 d and 0.8 d","0.1 d and 0.9 d"],"correct":2,"explanation":"The average of velocities at 0.2d and 0.8d below the surface approximates the vertical mean. Multiple verticals are still needed to represent the whole cross-section.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":412,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"A stage–discharge rating curve relates __________ to discharge.","options":["wind speed","gauge height (stage)","water temperature","sediment colour"],"correct":1,"explanation":"A rating curve empirically links observed water level with discharge at a gauging station. Channel changes can alter this relationship, so it requires calibration and maintenance.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":413,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"The pressure conduit that delivers water to a hydropower turbine is the __________.","options":["weir","penstock","spillway","tailrace"],"correct":1,"explanation":"A penstock conveys water under pressure to the turbine. The tailrace carries water away after energy extraction, so the two occupy different parts of the scheme.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":414,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Hydrographic, Hydropower and Irrigation Survey","chapterCode":"AGeE0902","topic":"Hydrographic, Hydropower and Irrigation Survey","question":"Water leaving a hydropower powerhouse is returned to the river through the __________.","options":["tailrace","penstock","surge shaft only","intake"],"correct":0,"explanation":"The tailrace returns water from the turbine/powerhouse to the downstream channel. It is downstream of generation, unlike the intake, headrace and penstock.","examTip":"Link this question to AGeE0902: Hydrographic, Hydropower and Irrigation Survey.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":415,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Underground and Geophysical Surveying","chapterCode":"AGeE0903","topic":"Underground and Geophysical Surveying","question":"Surface-to-underground orientation through a vertical shaft is commonly achieved by __________.","options":["barometric levelling","plane tabling","compass traversing only","shaft plumbing (two plumb wires)"],"correct":3,"explanation":"Two suspended plumb wires transfer a surface alignment through a shaft. Their positions below allow the underground network to inherit a reference direction.","examTip":"Link this question to AGeE0903: Underground and Geophysical Surveying.","difficulty":"medium","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":416,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Underground and Geophysical Surveying","chapterCode":"AGeE0903","topic":"Underground and Geophysical Surveying","question":"A gyro-theodolite is used underground to determine __________.","options":["gravity anomaly","magnetic dip","true azimuth","water depth"],"correct":2,"explanation":"A gyro-theodolite determines a north-referenced azimuth without needing magnetic north or a view of the stars. This is valuable in underground control networks.","examTip":"Link this question to AGeE0903: Underground and Geophysical Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":417,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Underground and Geophysical Surveying","chapterCode":"AGeE0903","topic":"Underground and Geophysical Surveying","question":"Breakthrough error in tunnelling is the misclosure when two __________ meet.","options":["excavation drives","rivers","flight lines","cadastral sheets"],"correct":0,"explanation":"When excavation advances from opposite ends, the drives may meet with horizontal or vertical offset. That misclosure is breakthrough error and reflects accumulated control and setting-out uncertainty.","examTip":"Link this question to AGeE0903: Underground and Geophysical Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":418,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Underground and Geophysical Surveying","chapterCode":"AGeE0903","topic":"Underground and Geophysical Surveying","question":"Electrical Resistivity Tomography (ERT) images the subsurface by measuring __________.","options":["sound velocity","magnetic declination","GNSS phase","apparent resistivity"],"correct":3,"explanation":"ERT injects current and measures potential differences to infer apparent resistivity. Inversion interprets subsurface electrical variation; it does not directly photograph geological layers.","examTip":"Link this question to AGeE0903: Underground and Geophysical Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":419,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Route Surveying","chapterCode":"AGeE0904","topic":"Route Surveying","question":"Horizontal route curves include simple circular, compound, reverse and __________ curves.","options":["summit","parabolic vertical only","transition (spiral)","sag only"],"correct":2,"explanation":"A transition curve gradually changes curvature between a straight and a circular arc. This avoids an abrupt change in lateral acceleration at the join.","examTip":"Link this question to AGeE0904: Route Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":420,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Route Surveying","chapterCode":"AGeE0904","topic":"Route Surveying","question":"For a simple circular curve, the tangent length is __________.","options":["R sin(Δ/2)","R tan(Δ/2)","R (sec(Δ/2) − 1)","R (1 − cos(Δ/2))"],"correct":1,"explanation":"The radius to the tangent point is perpendicular to the tangent. The resulting right triangle gives tangent length T = R tan(Δ/2).","examTip":"Link this question to AGeE0904: Route Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":421,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Route Surveying","chapterCode":"AGeE0904","topic":"Route Surveying","question":"The length of a circular curve is __________.","options":["π R Δ° / 180°","2 R sin(Δ/2)","R / Δ","R Δ°"],"correct":0,"explanation":"Arc length equals radius times central angle in radians. Converting Δ degrees to radians gives L = πRΔ/180.","examTip":"Link this question to AGeE0904: Route Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":422,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Route Surveying","chapterCode":"AGeE0904","topic":"Route Surveying","question":"The long chord of a circular curve is __________.","options":["π R Δ / 180","2 R sin(Δ/2)","R (sec(Δ/2) − 1)","R tan(Δ/2)"],"correct":1,"explanation":"The long chord joins the two tangent points. Splitting the isosceles radius triangle in half gives LC = 2R sin(Δ/2).","examTip":"Link this question to AGeE0904: Route Surveying.","difficulty":"easy","source":"NEC Comprehensive Study Notes","isPastQuestion":false,"isModelQuestion":false},{"id":423,"module":"Engineering Survey","moduleCode":"AGeE09","moduleId":9,"chapter":"Route Surveying","chapterCode":"AGeE0904","topic":"Route Surveying","question":"The external distance E of a circular curve is __________.","options":["R tan(Δ/2)","2 R sin(Δ/2)","R (1 − cos(Δ/2))","R (sec(Δ/2) − 1)"],"correct":3,"explanation":"The intersectio
