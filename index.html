    function currentQuestion(){return byId(appState.session.questionIds[appState.session.current])}
    function renderSession(){const s=appState.session,q=currentQuestion();if(!q){progress.activeSession=null;appState.session=null;save();return go('dashboard')}const idx=s.current,selected=s.answers[q.id],checked=!!s.checked[q.id],isCorrect=selected===q.correct;const options=q.options.map((o,i)=>{let cls=selected===i?' selected':'';if(s.mode==='practice'&&checked){if(i===q.correct)cls+=' correct';else if(i===selected)cls+=' incorrect'}return `<button class="option${cls}" data-action="answer" data-index="${i}" ${checked&&s.mode==='practice'?'disabled':''}><span class="option-key">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`}).join('');const feedback=s.mode==='practice'&&checked?`<div class="feedback ${isCorrect?'good':'bad'}"><h3>${isCorrect?'Correct ✓':'Incorrect ✕'}</h3><p><strong>Correct answer:</strong> ${'ABCD'[q.correct]}. ${esc(q.options[q.correct])}</p><p>${esc(q.explanation)}</p><p class="exam-tip"><strong>Concept:</strong> ${esc(q.chapterCode)} · ${esc(q.chapter)}</p><button class="btn btn-secondary btn-sm" data-action="guideFromQuestion" data-id="${q.moduleId}">Study this chapter</button></div>`:'';app.innerHTML=`<div class="page-head"><div><p class="eyebrow">${esc(s.kind)}</p><h1>${s.mode==='exam'?'Examination in progress':'Practice session'}</h1></div><button class="btn btn-secondary mobile-palette" data-action="palette">Question palette</button></div><section class="exam-layout"><article class="card question-card"><div class="question-meta"><span class="pill pill-brand">${q.moduleCode}</span><span class="pill">${q.chapterCode}</span><span class="pill">${esc(q.difficulty)}</span>${q.isModelQuestion?'<span class="pill">Model question</span>':''}${q.isPastQuestion?'<span class="pill">Exam recall</span>':''}${q.unscored?'<span class="pill">Source answer under review</span>':''}<button class="bookmark ${progress.bookmarks.includes(q.id)?'active':''}" data-action="bookmark" data-id="${q.id}" aria-label="Bookmark question">${progress.bookmarks.includes(q.id)?'★':'☆'}</button></div><div class="question-kicker">Question ${idx+1} of ${s.questionIds.length}</div><h2 class="question-text">${esc(q.question)}</h2><div class="options">${options}</div>${feedback}<div class="question-footer"><button class="btn btn-secondary" data-action="prev" ${idx===0?'disabled':''}>← Previous</button>${s.mode==='exam'?`<button class="btn btn-ghost" data-action="mark">${s.marked.includes(q.id)?'Unmark review':'Mark for review'}</button>`:`<button class="btn btn-primary" data-action="check" ${checked?'disabled':''}>Check Answer</button><button class="btn btn-ghost" data-action="mark">${s.marked.includes(q.id)?'Remove from review':'Add to review'}</button>`}<button class="btn btn-secondary push" data-action="next" ${idx===s.questionIds.length-1?'disabled':''}>Next →</button><button class="btn btn-primary" data-action="finish">${s.mode==='exam'?'Submit Exam':'Finish Practice'}</button></div></article><aside class="exam-side"><div class="card timer-card"><div><small>${s.duration?'Time remaining':'Time used'}</small><div class="timer" id="timerValue">${timerText()}</div></div><div class="progress-track"><div class="progress-fill" id="timeBar" style="width:${timePercent()}%"></div></div></div><div class="card palette-card" id="paletteCard">${paletteHtml()}</div></aside></section>`;if(s.duration)startTimer()}
    function paletteHtml(){const s=appState.session;s.visited=s.visited||[s.questionIds[s.current]];const answered=Object.keys(s.answers).length,marked=s.marked.length;return `<div class="palette-head"><h3>Question palette</h3><span class="pill">${s.questionIds.length}</span></div><div class="palette-grid">${s.questionIds.map((id,i)=>`<button class="qnum ${s.answers[id]!==undefined?'answered':''} ${s.marked.includes(id)?'review':''} ${i===s.current?'current':''}" data-action="jump" data-index="${i}">${i+1}</button>`).join('')}</div><div class="palette-counts"><div class="palette-count"><strong>${answered}</strong><span>Answered</span></div><div class="palette-count"><strong>${s.questionIds.length-answered}</strong><span>Not answered</span></div><div class="palette-count"><strong>${marked}</strong><span>Review</span></div><div class="palette-count"><strong>${s.questionIds.length-s.visited.length}</strong><span>Not visited</span></div></div><div class="legend"><span><i style="background:var(--good)"></i>Answered</span><span><i style="background:var(--review)"></i>Review</span><span><i style="background:var(--accent)"></i>Current</span></div>`}
    function timerText(){const s=appState.session,elapsed=Math.max(0,Math.floor((Date.now()-s.startedAt)/1000)),seconds=s.duration?Math.max(0,s.duration-elapsed):elapsed;const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),sec=seconds%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
    function timePercent(){const s=appState.session;if(!s.duration)return Math.min(100,((Date.now()-s.startedAt)/3600000)*100);const elapsed=(Date.now()-s.startedAt)/1000;return Math.max(0,100-(elapsed/s.duration*100))}
    function startTimer(){clearInterval(timerHandle);timerHandle=setInterval(()=>{const tv=document.getElementById('timerValue'),bar=document.getElementById('timeBar');if(tv)tv.textContent=timerText();if(bar)bar.style.width=timePercent()+'%';const s=appState.session;if(s&&s.duration&&(Date.now()-s.startedAt)/1000>=s.duration){clearInterval(timerHandle);finishSession(true)}},1000)}

    function requestFinish(){const s=appState.session,answered=Object.keys(s.answers).length,unanswered=s.questionIds.length-answered;openModal(s.mode==='exam'?'Submit examination?':'Finish practice?',`<p>You have answered <strong>${answered} of ${s.questionIds.length}</strong> questions.</p>${unanswered?`<div class="notice">${unanswered} question${unanswered===1?' is':'s are'} unanswered.</div>`:''}`,`<button class="btn btn-secondary" data-action="closeModal">Return to session</button><button class="btn btn-primary" data-action="confirmFinish">Submit final</button>`)}

    function buildResult(s,auto=false){const correct=s.questionIds.filter(id=>s.answers[id]===byId(id).correct).length,answered=Object.keys(s.answers).length,total=s.questionIds.length;return{id:s.id,kind:s.kind,mode:s.mode,questionIds:s.questionIds,answers:s.answers,marked:s.marked,score:correct,total,answered,unanswered:total-answered,percentage:pct(correct,total),accuracy:pct(correct,answered),startedAt:s.startedAt,submittedAt:Date.now(),durationUsed:Math.floor((Date.now()-s.startedAt)/1000),autoSubmitted:auto}}

    function resultModuleRows(r){return syllabus.map(m=>{const ids=r.questionIds.filter(id=>byId(id)?.moduleId===m.id),correct=ids.filter(id=>r.answers[id]===byId(id).correct).length,answered=ids.filter(id=>r.answers[id]!==undefined).length;return{m,total:ids.length,correct,answered,accuracy:pct(correct,answered)}}).filter(x=>x.total)}
    function band(p){return p>=80?['Excellent','A strong result—maintain breadth and sharpen the lowest two sections.']:p>=60?['Good progress','Your foundation is working. Focus next on the weakest chapters.']:['Needs improvement','Use chapter practice and the wrong-answer notebook before the next mock.']}
    function renderResult(){const r=appState.result||progress.history[0];if(!r)return go('dashboard');appState.result=r;const [label,message]=band(r.percentage),rows=resultModuleRows(r),weak=[...rows].sort((a,b)=>a.accuracy-b.accuracy).slice(0,2);app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Submitted ${fmtDate(r.submittedAt)}</p><h1>${esc(r.kind)} Result</h1></div><button class="btn btn-secondary" data-view="dashboard">Dashboard</button></div><section class="card result-hero"><div class="result-score"><strong>${r.score}/${r.total}</strong><span>${r.percentage}% overall score</span></div><div class="result-summary"><p class="eyebrow">${label}</p><h2>${message}</h2><div class="score-breakdown"><span class="score-chip good"><b>${r.score}</b> Correct</span><span class="score-chip bad"><b>${r.answered-r.score}</b> Incorrect</span><span class="score-chip"><b>${r.unanswered}</b> Unanswered</span><span class="score-chip"><b>${r.accuracy}%</b> Answered accuracy</span><span class="score-chip"><b>${Math.floor(r.durationUsed/60)}m ${r.durationUsed%60}s</b> Time used</span></div><div class="card-actions"><button class="btn btn-primary" data-action="reviewResult">Review every question</button><button class="btn btn-secondary" data-action="weak">Practice weak topics</button></div></div></section><div class="section-title"><h2>Performance by official chapter</h2></div><section class="card performance-list">${rows.map(x=>`<div class="performance-row"><span>${x.m.id}. ${esc(x.m.title)}</span><div class="progress-track"><div class="progress-fill" style="width:${x.accuracy}%"></div></div><strong>${x.correct}/${x.total}</strong></div>`).join('')}</section><div class="recommendation"><strong>Recommended next step:</strong> Focus on ${weak.map(x=>esc(x.m.title)).join(' and ')}. Your scores in these chapters were ${weak.map(x=>x.accuracy+'%').join(' and ')}.</div>`}

ilter=el.dataset.value;renderReview()}else if(a==='openQuestion')startSession([byId(el.dataset.id)],{kind:'Question Bank Practice'});else if(a==='bankPage'){appState.bankPage+=Number(el.dataset.delta);renderBank();window.scrollTo(0,0)}else if(a==='openHistory'){appState.result=progress.history[Number(el.dataset.index)];go('result')}else if(a==='resetAsk')openModal('Reset all progress?',`<p>This permanently deletes attempts, scores, test history, bookmarks, wrong answers and the active session saved in this browser.</p>`,`<button class="btn btn-secondary" data-action="closeModal">Cancel</button><button class="btn btn-danger" data-action="resetNow">Reset progress</button>`);else if(a==='resetNow'){const theme=progress.theme;progress=defaultProgress();progress.theme=theme;appState.session=null;appState.result=null;save();closeModal();go('dashboard');showToast('All study progress was reset.')}});

function mergeSet(a,b){return [...new Set([...(a||[]),...(b||[])])];}
function laterRecord(a,b){if(!a)return b;if(!b)return a;const ta=Date.parse(a.lastAttemptAt||a.updatedAt||0)||0,tb=Date.parse(b.lastAttemptAt||b.updatedAt||0)||0;if(ta!==tb)return ta>tb?a:b;return (a.attempts||0)>=(b.attempts||0)?a:b;}

  const a=ensureProgressShape(local||{}),b=ensureProgressShape(remote||{}),ta=Date.parse(a.updatedAt||0)||0,tb=Date.parse(b.updatedAt||0)||0,newer=ta>=tb?a:b,older=ta>=tb?b:a;
  const out=ensureProgressShape({...older,...newer});
  out.bookmarks=mergeSet(a.bookmarks,b.bookmarks);out.studyBookmarks=mergeSet(a.studyBookmarks,b.studyBookmarks);out.formulaBookmarks=mergeSet(a.formulaBookmarks,b.formulaBookmarks);out.conceptBookmarks=mergeSet(a.conceptBookmarks,b.conceptBookmarks);
  const rank={'not-started':0,'reading':1,'completed':2};out.studySections={...a.studySections,...b.studySections};for(const code of new Set([...Object.keys(a.studySections||{}),...Object.keys(b.studySections||{})]))out.studySections[code]=(rank[a.studySections?.[code]]||0)>=(rank[b.studySections?.[code]]||0)?a.studySections?.[code]:b.studySections?.[code];
  out.questions={};for(const id of new Set([...Object.keys(a.questions||{}),...Object.keys(b.questions||{})])){const x=a.questions?.[id],y=b.questions?.[id],z=laterRecord(x,y)||{};out.questions[id]={...z,attempts:Math.max(x?.attempts||0,y?.attempts||0),correct:Math.max(x?.correct||0,y?.correct||0),incorrectAttempts:Math.max(x?.incorrectAttempts||0,y?.incorrectAttempts||0)}}
  out.wrong={};for(const id of new Set([...Object.keys(a.wrong||{}),...Object.keys(b.wrong||{})])){const x=a.wrong?.[id],y=b.wrong?.[id];if(x||y){const z=laterRecord(x,y)||{};out.wrong[id]={...z,misses:Math.max(x?.misses||0,y?.misses||0),recoveries:Math.max(x?.recoveries||0,y?.recoveries||0)}}}

  out.knowledgeChecks={...a.knowledgeChecks,...b.knowledgeChecks};out.recall={...a.recall,...b.recall};const ra=[...(a.recentAttempts||[]),...(b.recentAttempts||[])],rs=new Set();out.recentAttempts=ra.filter(x=>{const k=`${x.qid}|${x.at}`;if(rs.has(k))return false;rs.add(k);return true}).sort((x,y)=>Date.parse(y.at||0)-Date.parse(x.at||0)).slice(0,200);
  out.preferences={...older.preferences,...newer.preferences};out.studyPlan=(Date.parse(a.studyPlan?.updatedAt||0)||0)>=(Date.parse(b.studyPlan?.updatedAt||0)||0)?a.studyPlan:b.studyPlan;
  out.schemaVersion=SCHEMA_VERSION;out.courseVersion=COURSE_VERSION;out.updatedAt=newer.updatedAt||nowIso();return ensureProgressShape(out);

function sectionMetrics(code){const qs=questionBank.filter(q=>q.chapterCode===code&&!q.unscored),st=chapterStats(code),study=sectionState(code);let level='not-started';if(study==='reading')level='learning';if(study==='completed')level='read';if(st.attempts>0)level='practised';const needed=Math.min(5,qs.length||5);if(study==='completed'&&st.attempted>=needed&&st.accuracy>=80)level='mastered';return{...st,available:qs.length,study,level}}
function masteryLabel(level){return({'not-started':'Not started','learning':'Learning','read':'Read','practised':'Practised','mastered':'Mastered'})[level]||level}
function readiness(){const sections=allStudySections(),studied=sections.filter(x=>sectionState(x.section.code)==='completed').length,mastered=sections.filter(x=>sectionMetrics(x.section.code).level==='mastered').length,s=overallStats(),mocks=progress.history.filter(x=>x.mode==='exam'),mockAvg=mocks.length?Math.round(mocks.reduce((a,x)=>a+x.percentage,0)/mocks.length):0,recent=progress.recentAttempts.slice(0,50),recentAccuracy=recent.length?pct(recent.filter(x=>x.isCorrect).length,recent.length):s.accuracy,score=Math.round((studied/60*35)+(mastered/60*25)+(s.attempted/questionBank.length*20)+(recentAccuracy/100*10)+(Math.min(3,mocks.length)/3*10));return{studied,mastered,questionCoverage:s.attempted,accuracy:s.accuracy,recentAccuracy,mocks:mocks.length,mockAvg,wrong:Object.keys(progress.wrong||{}).length,score,label:score>=80?'Strong':score>=55?'Building':'Needs focus'}}
function nextRecommendation(){const rows=allStudySections().map(x=>({...x,m:sectionMetrics(x.section.code)}));const weak=rows.filter(x=>x.m.attempted>=3&&x.m.accuracy<65).sort((a,b)=>a.m.accuracy-b.m.accuracy||b.m.attempted-a.m.attempted)[0];if(weak)return{...weak,reason:`Accuracy is ${weak.m.accuracy}% after ${weak.m.attempted} questions. Review before another attempt.`};const next=rows.find(x=>x.m.study!=='completed');if(next)return{...next,reason:'This is the next unfinished official syllabus section.'};const low=rows.filter(x=>x.m.level!=='mastered').sort((a,b)=>a.m.accuracy-b.m.accuracy)[0];return low?{...low,reason:'Study is complete; now strengthen practice mastery.'}:rows[0]}

actionCard=function(icon,title,text,action,count){const attr=['mock','practice','bank','progress','resources','plan','gaps'].includes(action)?`data-view="${action}"`:`data-action="${action}"`;return `<button class="action-card" ${attr}><span class="count">${count}</span><span class="action-icon">${icon}</span><h3>${title}</h3><p>${text}</p></button>`}

renderDashboard=function(){const r=readiness(),rec=nextRecommendation(),name=cloud.profile?.display_name||'Student',signed=!!cloud.user,st=sectionMetrics(rec.section.code),plan=progress.studyPlan?.tasks?.length?todayPlanTasks():[];app.innerHTML=`<section class="hero"><div class="hero-main"><p class="eyebrow">${signed?`Welcome back, ${esc(name)}`:'Learn → Practise → Diagnose → Retain'}</p><h1>Continue your preparation.</h1><p><strong>${rec.section.code} — ${esc(rec.section.title)}</strong><br>${esc(rec.reason||'')}</p><div class="hero-actions"><button class="btn btn-primary" data-action="openStudyCode" data-code="${rec.section.code}">Continue Lesson</button><button class="btn btn-ghost" data-action="wrong">Review Wrong Answers</button>${!signed?'<button class="btn btn-ghost" data-action="authChoice">Sync across devices</button>':''}</div></div><div class="hero-stat"><div class="score-ring" style="--p:${r.score}"><div><strong>${r.score}%</strong><span>study readiness</span></div></div><div class="ring-copy"><h2>${r.label}</h2><p>Preparation indicator based on your study, practice and mock activity.</p></div></div></section><section class="stats-grid"><div class="stat-card"><span>Syllabus studied</span><strong>${r.studied}/60</strong></div><div class="stat-card"><span>Sections mastered</span><strong>${r.mastered}/60</strong></div><div class="stat-card"><span>Question coverage</span><strong>${r.questionCoverage}/${questionBank.length}</strong></div><div class="stat-card"><span>Recent accuracy</span><strong>${r.recentAccuracy}%</strong></div></section><div class="section-title"><h2>Today's study</h2><div class="card-actions"><button class="size-btn" data-view="plan">Study plan</button><button class="size-btn" data-view="gaps">Preparation gaps</button></div></div><section class="card today-card"><div><p class="eyebrow">Recommended next</p><h2>${rec.section.code} — ${esc(rec.section.title)}</h2><div class="today-meta"><span>Study: ${st.study==='completed'?'complete':st.study}</span><span>Practice: ${st.attempted}/${st.available}</span><span>Accuracy: ${st.attempts?st.accuracy+'%':'—'}</span><span>Mastery: ${masteryLabel(st.level)}</span></div>${plan.length?`<p class="muted">Your active study plan has ${plan.filter(t=>!t.completed).length} task(s) scheduled for today.</p>`:''}</div><div class="card-actions"><button class="btn btn-primary" data-action="openStudyCode" data-code="${rec.section.code}">Study</button><button class="btn btn-secondary" data-action="startSection" data-code="${rec.section.code}" data-size="10">Practice 10</button></div></section><div class="section-title"><h2>Core preparation tools</h2></div><section class="action-grid">${actionCard('01','Study Guide','Complete lessons built around all 60 official syllabus sections.','studyHome',r.studied)}${actionCard('10','Quick 10','Balanced recall across all 10 chapters.','quick',10)}${actionCard('100','Full Mock','Exam-style 100-question balanced session.','mock',100)}${actionCard('×','Wrong Answers','Recover concepts you previously missed.','wrong',r.wrong)}</section><details class="card" style="margin-top:16px"><summary><strong>More preparation tools</strong></summary><section class="action-grid" style="margin-top:14px">${actionCard('CH','Chapter Practice','Target one chapter.','practice',10)}${actionCard('§','Module Practice','Target any coded section.','modules',60)}${actionCard('PQ','Past & Model','Use verified model and recall questions.','past',questionBank.filter(q=>q.isPastQuestion||q.isModelQuestion).length)}${actionCard('⌑','Bookmarks','Questions you saved.','bookmarks',progress.bookmarks.length)}${actionCard('QB','Question Bank','Search all scored questions.','bank',questionBank.length)}${actionCard('ƒ','Formula & Revision','Formula centre, glossary, comparisons and recall.','resources',allStudySections().flatMap(x=>x.section.formulas).length)}${actionCard('%','Progress','Readiness, chapter performance and history.','progress',progress.history.length)}</section></details>`;updateAccountUI()}

function roadmapHtml(ch){return chapterProfiles[ch.moduleId].roadmap.map((x,i,a)=>`<span>${esc(x)}</span>${i<a.length-1?'<i>→</i>':''}`).join('')}
renderStudyHome=function(){const q=appState.studySearch.trim().toLowerCase(),matches=q?allStudySections().filter(({section})=>`${section.code} ${section.title} ${OFFICIAL_SCOPE[section.code]||''} ${section.introduction} ${section.concepts.map(c=>c.heading+' '+c.body).join(' ')} ${section.formulas.map(f=>f.title+' '+f.expression).join(' ')}`.toLowerCase().includes(q)):[];app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Complete digital preparation course</p><h1>NEC Geomatics Study Guide</h1><p class="subhead">Official syllabus structure first; teaching, examples, audio, knowledge checks and practice connected to each topic.</p></div><div class="card-actions"><button class="btn btn-secondary" data-view="resources">Revision resources</button><button class="btn btn-primary" data-action="openStudyCode" data-code="${esc(progress.lastStudyCode||'AGeE0101')}">Continue studying</button></div></div><div class="study-search"><input id="studySearch" value="${esc(appState.studySearch)}" placeholder="Search: Bowditch, orthometric height, producer accuracy, RTK, SQL…" aria-label="Search study guide"></div>${q?`<div class="section-title"><h2>Search results</h2><span class="muted">${matches.length} sections</span></div><section class="card">${matches.length?matches.map(({ch,section})=>{const m=sectionMetrics(section.code);return `<button class="study-link" data-action="openStudyCode" data-code="${section.code}"><b>${m.level==='mastered'?'★':m.study==='completed'?'✓':m.study==='reading'?'●':'○'}</b><span><strong>${section.code}</strong><br>${esc(section.title)} · ${masteryLabel(m.level)}</span></button>`}).join(''):`<div class="empty"><h2>No matching lesson</h2><p>Try a broader concept, formula or syllabus code.</p></div>`}</section>`:`<div class="section-title"><h2>10 chapters · 60 official sections</h2><span class="muted">○ Not started · ● Learning · ✓ Read · ★ Mastered</span></div><section class="study-home">${studyGuide.map(ch=>{const st=chapterStudyStats(ch),ps=moduleStats(ch.moduleId),mastered=ch.sections.filter(s=>sectionMetrics(s.code).level==='mastered').length,qCount=questionBank.filter(x=>x.moduleId===ch.moduleId&&!x.unscored).length,next=ch.sections.find(s=>sectionState(s.code)!=='completed')?.code||ch.sections[0].code,p=chapterProfiles[ch.moduleId];return `<article class="card study-chapter-card"><div class="study-topline"><span class="study-number">${String(ch.moduleId).padStart(2,'0')}</span><span class="chapter-code">${ch.code}</span></div><h2>${esc(ch.title)}</h2><div class="chapter-roadmap">${roadmapHtml(ch)}</div><p class="muted">${esc(p.focus)}</p><div class="readiness-grid"><div class="readiness-box"><strong>${st.completed}/6</strong><small>study</small></div><div class="readiness-box"><strong>${mastered}/6</strong><small>mastered</small></div><div class="readiness-box"><strong>${ps.attempts?ps.accuracy+'%':'—'}</strong><small>accuracy</small></div></div><div class="card-meta"><span>${qCount} scored MCQs</span><span>Prerequisite: ${esc(p.prereq)}</span></div><div class="card-actions"><button class="btn btn-primary btn-sm" data-action="openStudyCode" data-code="${next}">${st.completed===6?'Review Chapter':'Continue Study'}</button><button class="btn btn-secondary btn-sm" data-action="startModule" data-id="${ch.moduleId}" data-size="20">Chapter Test</button></div></article>`}).join('')}</section>`}`}

const baseConceptHtml=conceptHtml;
conceptHtml=function(section){const depth=progress.preferences?.readingDepth||'standard';if(depth==='standard')return baseConceptHtml(section);if(!section.concepts.length)return baseConceptHtml(section);const block=(c,label='')=>`<div class="concept-block">${label?`<p class="eyebrow">${label}</p>`:''}<h3>${esc(c.heading)}</h3><p>${esc(c.body)}</p></div>`;if(depth==='core')return section.concepts.slice(0,Math.min(2,section.concepts.length)).map((c,i)=>block(c,i===0?'Must know':'Core')).join('')+`<details><summary>Show the remaining ${Math.max(0,section.concepts.length-2)} concepts</summary>${section.concepts.slice(2).map(c=>block(c)).join('')}</details>`;return section.concepts.map((c,i)=>block(c,i===0?'Must know':i<3?'Understand':'Deeper')).join('')}

function glossaryTerms(section){const terms=[];for(const r of section.comparison||[])terms.push({term:r[0],definition:r[1]});for(const f of section.formulas||[])terms.push({term:f.title,definition:f.variables||f.spoken||f.expression});for(const c of (section.concepts||[]).slice(0,6))terms.push({term:c.heading.replace(/^(The|A|An)\s+/i,'').slice(0,72),definition:c.body});const seen=new Set();return terms.filter(x=>{const k=x.term.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).slice(0,8)}
function lessonWhy(ch,section){return `${chapterProfiles[ch.moduleId].application} In ${section.code}, the immediate goal is to ${section.objective.charAt(0).toLowerCase()+section.objective.slice(1)}`}

function knowledgeItems(section){return (section.relatedQuestionIds||[]).map(byId).filter(q=>q&&!q.unscored).slice(0,2)}
function noteValue(code){const n=progress.notes?.[code];return typeof n==='object'?n.text||'':n||''}
function buildAudioScript(section,ch){const seg=[];seg.push(`Welcome to ${section.code}, ${section.title}. This lesson sits in Chapter ${ch.moduleId}, ${ch.title}. The official syllabus asks you to cover: ${OFFICIAL_SCOPE[section.code]||section.title}. By the end, you should be able to ${section.objective.charAt(0).toLowerCase()+section.objective.slice(1)}`);seg.push(`Why this matters. ${lessonWhy(ch,section)} Start with this foundation: ${section.introduction}`);const groups=[];for(let i=0;i<section.concepts.length;i+=2)groups.push(section.concepts.slice(i,i+2));groups.forEach((g,i)=>seg.push(`${i===0?'First':'Next'}, connect these ideas. ${g.map(c=>`${c.heading}. ${c.body}`).join(' ')}`));if(section.formulas.length)seg.push(`Now the key relationships. ${section.formulas.map(f=>`${f.title}. ${f.spoken||f.expression}. ${f.variables}`).join(' ')}`);if(section.workedExamples.length)seg.push(`Let's work through an example. ${section.workedExamples.slice(0,2).map(e=>`Problem: ${e.problem}. Given: ${e.given}. Use ${e.formula}. Calculation: ${e.calculation}. Therefore ${e.answer}.`).join(' ')}`);seg.push(`For NEC preparation, remember this exam focus: ${section.examTips.join(' ')} A common mistake is: ${section.commonMistakes.join(' ')}`);seg.push(`Recap. ${section.quickRecap.join(' ')} Before you leave, explain the central idea without the notes, then use Practice 5 or Practice 10 to test retrieval.`);return seg}
function updateTranscript(section,ch){const box=document.getElementById('audioTranscript');if(box)box.innerHTML=buildAudioScript(section,ch).map((x,i)=>`<p><span class="audio-segment">Segment ${i+1}</span><br>${esc(x)}</p>`).join('')}

const baseRenderStudySection=renderStudySection;
renderStudySection=function(code){baseRenderStudySection(code);const item=allStudySections().find(x=>x.section.code===code);if(!item)return;const {ch,section,index}=item,m=sectionMetrics(code),terms=glossaryTerms(section),kq=knowledgeItems(section),article=document.getElementById('studyArticle');if(!article)return;const footer=article.querySelector('.lesson-footer'),bookmarked=progress.studyBookmarks.includes(code),layer=document.createElement('section');layer.className='lesson-layer';layer.innerHTML=`<h2>Connect the lesson</h2><div class="scope-box"><p class="eyebrow">Official syllabus requirement</p><p>${esc(OFFICIAL_SCOPE[code]||section.title)}</p></div><div class="priority-row"><span class="priority-tag must">Must know · core definitions & relationships</span><span class="priority-tag should">Should know · applications & distinctions</span><span class="priority-tag">Useful · deeper professional context</span></div><h3>Why it matters</h3><p>${esc(lessonWhy(ch,section))}</p><p><strong>Prerequisite:</strong> ${esc(chapterProfiles[ch.moduleId].prereq)}</p>${diagramFor(code)}<div class="term-grid"><div class="term-card"><strong>For NEC preparation</strong><span>Prioritise the official scope, key distinctions, formulas and question patterns linked to this section.</span></div><div class="term-card"><strong>In professional practice</strong><span>${esc(chapterProfiles[ch.moduleId].application)}</span></div></div><h3>Terminology to own</h3><div class="term-grid">${terms.map(t=>`<div class="term-card"><strong>${esc(t.term)}</strong><span>${esc(t.definition)}</span></div>`).join('')}</div><h3>Knowledge check</h3><p class="muted">These checks build recall but do not alter formal practice accuracy.</p><div class="knowledge-check">${kq.map((q,i)=>`<div class="knowledge-question" data-kqbox="${q.id}"><p><strong>${i+1}. ${esc(q.question)}</strong></p><div class="knowledge-options">${q.options.map((o,oi)=>`<button data-action="knowledgeAnswer" data-qid="${q.id}" data-index="${oi}">${'ABCD'[oi]}. ${esc(o)}</button>`).join('')}</div><div class="knowledge-feedback" id="kqFeedback${q.id}"></div></div>`).join('')||'<p>No suitable scored question is linked to this section yet. Use topic practice instead.</p>'}</div><div class="note-box"><h3>My Note</h3><textarea id="studyNote" data-code="${code}" placeholder="Write your own explanation, memory cue or question here…">${esc(noteValue(code))}</textarea><div class="note-meta"><span>Private to your local/account progress.</span><span id="noteSavedState">Saved locally</span></div></div>`;footer?.before(layer);article.querySelectorAll('.concept-block').forEach((b,i)=>{const h=b.querySelector('h3');if(!h)return;const key=`${code}|${i}`,saved=progress.conceptBookmarks.includes(key);h.insertAdjacentHTML('beforeend',` <button class="size-btn" style="float:right" data-action="toggleConceptBookmark" data-key="${esc(key)}">${saved?'★':'☆'}</button>`)});const title=app.querySelector('.page-head h1');if(title)title.insertAdjacentHTML('afterend',`<div class="priority-row"><span class="mastery-pill ${m.level}">${masteryLabel(m.level)}</span><button class="size-btn" data-action="toggleStudyBookmark" data-code="${code}">${bookmarked?'★ Lesson saved':'☆ Save lesson'}</button><button class="size-btn" data-action="printLesson">Print lesson</button></div>`);const audio=document.querySelector('.audio-panel');if(audio){audio.insertAdjacentHTML('beforeend',`<div class="audio-buttons"><button class="size-btn" data-action="audioRevision">Revision audio</button><button class="size-btn" data-action="audioFormula">Formula audio</button><button class="size-btn" data-action="audioPrev">← Segment</button><button class="size-btn" data-action="audioNext">Segment →</button></div><details><summary>View Transcript</summary><div class="transcript" id="audioTranscript"></div></details><strong>Reading depth</strong><div class="depth-controls"><button class="size-btn ${progress.preferences.readingDepth==='core'?'active':''}" data-action="readingDepth" data-value="core">Core</button><button class="size-btn ${progress.preferences.readingDepth==='standard'?'active':''}" data-action="readingDepth" data-value="standard">Standard</button><button class="size-btn ${progress.preferences.readingDepth==='detailed'?'active':''}" data-action="readingDepth" data-value="detailed">Detailed</button></div>`);updateTranscript(section,ch);const rate=document.getElementById('speechRate');if(rate){rate.innerHTML=[.75,.9,1,1.15,1.25,1.5].map(v=>`<option value="${v}" ${Number(progress.speechRate)===v?'selected':''}>${v}×</option>`).join('')}}updateAccountUI()}

function startAudioQueue(parts,mode){audioMode=mode;audioQueue=parts.filter(Boolean);audioIndex=0;speakAudioSegment(0)}

function speakAudioSegment(index){if(!('speechSynthesis'in window))return showToast('Audio lessons are not supported by this browser. The complete written lesson remains available.');stopNarration();if(!audioQueue.length)return;audioIndex=Math.max(0,Math.min(index,audioQueue.length-1));const u=new SpeechSynthesisUtterance(audioQueue[audioIndex]);currentUtterance=u;u.rate=Number(progress.speechRate)||1;u.lang='en';const voice=window.speechSynthesis.getVoices().find(v=>v.name===progress.speechVoice);if(voice)u.voice=voice;u.onstart=()=>updateAudioState(`${audioMode==='chapter'?'Chapter recap':'Lesson'} · segment ${audioIndex+1}/${audioQueue.length}`);u.onend=()=>{currentUtterance=null;speechPaused=false;if(audioIndex<audioQueue.length-1){audioIndex++;speakAudioSegment(audioIndex)}else updateAudioState('Finished')};u.onerror=()=>updateAudioState('Audio stopped');window.speechSynthesis.speak(u)}
speakGuide=function(){const item=allStudySections().find(x=>x.section.code===appState.studyCode);if(!item)return;audioMode='section';audioQueue=buildAudioScript(item.section,item.ch);audioIndex=0;speakAudioSegment(0)}

function resourceTabs(active){return ['formula','glossary','comparisons','revision','recall','interactive'].map(x=>`<button class="size-btn ${active===x?'active':''}" data-action="resourceTab" data-tab="${x}">${({formula:'Formula Centre',glossary:'Glossary',comparisons:'Comparisons',revision:'High-Yield Revision',recall:'Active Recall',interactive:'Interactive'})[x]}</button>`).join('')}
function renderResources(){appState.resourceTab=appState.resourceTab||'formula';const tab=appState.resourceTab,q=(appState.resourceSearch||'').trim().toLowerCase();let body='';if(tab==='formula'){let items=formulaEntries().filter(x=>!q||`${x.title} ${x.expression} ${x.variables} ${x.section.code}`.toLowerCase().includes(q));body=`<section class="resource-list">${items.map(x=>`<article class="card resource-item formula-entry"><p class="eyebrow">${x.section.code} · ${esc(x.section.title)}</p><h3>${esc(x.title)}</h3><code>${esc(x.expression)}</code><p>${esc(x.variables)}</p><p class="muted">Spoken: ${esc(x.spoken||x.expression)}</p><div class="card-actions"><button class="size-btn" data-action="openStudyCode" data-code="${x.section.code}">Study topic</button><button class="size-btn" data-action="toggleFormulaBookmark" data-key="${esc(x.section.code+'|'+x.title)}">${progress.formulaBookmarks.includes(x.section.code+'|'+x.title)?'★ Saved':'☆ Save formula'}</button></div></article>`).join('')||'<div class="card empty"><h2>No formula matches</h2></div>'}</section>`}else if(tab==='glossary'){let items=glossaryEntries().filter(x=>!q||`${x.term} ${x.definition} ${x.section.code}`.toLowerCase().includes(q));body=`<section class="glossary-grid">${items.map(x=>`<article class="card glossary-card"><p class="eyebrow">${x.section.code}</p><h3>${esc(x.term)}</h3><p>${esc(x.definition)}</p><button class="size-btn" data-action="openStudyCode" data-code="${x.section.code}">Open lesson</button></article>`).join('')}</section>`}else if(tab==='comparisons'){let items=comparisonEntries().filter(x=>!q||`${x.a} ${x.b} ${x.section.code}`.toLowerCase().includes(q));body=`<section class="resource-list">${items.map(x=>`<article class="card resource-item"><p class="eyebrow">${x.section.code}</p><h3>${esc(x.a)}</h3><p>${esc(x.b)}</p><button class="size-btn" data-action="openStudyCode" data-code="${x.section.code}">Study distinction</button></article>`).join('')}</section>`}else if(tab==='revision'){body=`<section class="study-home">${studyGuide.map(ch=>`<article class="card study-chapter-card"><p class="eyebrow">Chapter ${ch.moduleId} · ${ch.code}</p><h2>${esc(ch.title)}</h2><div class="chapter-roadmap">${roadmapHtml(ch)}</div><h3>Must know</h3><ul>${ch.sections.flatMap(s=>s.quickRecap.slice(0,2)).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Key formulas</h3>${ch.sections.flatMap(s=>s.formulas).slice(0,6).map(f=>`<p><code>${esc(f.expression)}</code> — ${esc(f.title)}</p>`).join('')||'<p class="muted">This chapter is mainly conceptual.</p>'}<div class="card-actions"><button class="size-btn" data-action="openStudyCode" data-code="${ch.sections[0].code}">Review chapter</button><button class="size-btn" data-action="printRevision" data-id="${ch.moduleId}">Print revision</button></div></article>`).join('')}</section>`}else if(tab==='recall'){body=renderRecallResource()}else body=renderInteractive();app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Remember · revise · retrieve</p><h1>Formula & Revision Centre</h1><p class="subhead">Searchable relationships, glossary, common distinctions, final revision and active recall drawn from the course data.</p></div><button class="btn btn-secondary" data-action="studyHome">Study Guide</button></div><div class="resource-tabs">${resourceTabs(tab)}</div>${!['recall','interactive'].includes(tab)?`<div class="study-search"><input id="resourceSearch" value="${esc(appState.resourceSearch||'')}" placeholder="Search this resource…"></div>`:''}${body}`}
function recallPool(){return allStudySections().flatMap(({section})=>section.concepts.slice(0,2).map((c,i)=>({id:`${section.code}.${i}`,code:section.code,prompt:c.heading,answer:c.body})))}
function renderRecallResource(){const pool=recallPool(),due=pool.filter(x=>progress.recall[x.id]!=='know'),item=due.length?due[(appState.recallOffset||0)%due.length]:pool[(appState.recallOffset||0)%pool.length];if(!item)return'<div class="card empty">No recall cards.</div>';return `<article class="card recall-card"><p class="eyebrow">Active recall · ${item.code}</p><div class="recall-prompt">${esc(item.prompt)}</div><details><summary>Reveal answer</summary><div class="recall-answer">${esc(item.answer)}</div></details><div class="recall-actions"><button class="btn btn-secondary" data-action="recallRate" data-id="${item.id}" data-rate="review">Review again</button><button class="btn btn-secondary" data-action="recallRate" data-id="${item.id}" data-rate="unsure">Unsure</button><button class="btn btn-primary" data-action="recallRate" data-id="${item.id}" data-rate="know">Know it</button></div><p class="muted">${pool.filter(x=>progress.recall[x.id]==='know').length}/${pool.length} marked “Know it”.</p></article>`}

function planOrder(){let items=allStudySections().map(x=>({code:x.section.code,title:x.section.title,moduleId:x.ch.moduleId,m:sectionMetrics(x.section.code)}));const level=progress.preferences.prepLevel;if(level==='revision'||level==='soon')items.sort((a,b)=>(a.m.level==='mastered')-(b.m.level==='mastered')||a.m.accuracy-b.m.accuracy||a.moduleId-b.moduleId);return items}
function generateStudyPlan(days){days=Math.max(1,Math.min(90,Number(days)||14));const tasks=[],items=planOrder(),per=Math.ceil(items.length/days);items.forEach((x,i)=>tasks.push({id:`section-${x.code}`,day:Math.min(days,Math.floor(i/per)+1),type:'section',code:x.code,title:`Study + practise ${x.code} — ${x.title}`,completed:x.m.level==='mastered'}));for(let d=1;d<=days;d++){if(d%Math.max(2,Math.round(days/4))===0)tasks.push({id:`review-${d}`,day:d,type:'review',title:'Review wrong answers and active-recall cards',completed:false})}if(days>=7)tasks.push({id:`mock-${Math.max(2,Math.round(days*.7))}`,day:Math.max(2,Math.round(days*.7)),type:'mock',title:'Full 100-question mock exam',completed:false});tasks.push({id:`final-${days}`,day:days,type:'revision',title:'Final high-yield revision across all 10 chapters',completed:false});progress.studyPlan={id:Date.now(),days,startDate:new Date().toISOString().slice(0,10),createdAt:nowIso(),updatedAt:nowIso(),tasks};save();appState.planDay=1;renderPlan()}
function currentPlanDay(){const p=progress.studyPlan;if(!p?.startDate)return 1;const start=new Date(p.startDate+'T00:00:00'),today=new Date();start.setHours(0,0,0,0);today.setHours(0,0,0,0);return Math.max(1,Math.min(p.days,Math.floor((today-start)/86400000)+1))}

function renderPlan(){const p=progress.studyPlan;if(!p?.tasks?.length){app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Personal study plan</p><h1>Choose your preparation window</h1><p class="subhead">The plan guides your order but never locks the syllabus.</p></div></div><section class="card"><h2>Create a plan</h2><p>Choose a study window. The course will distribute sections, recovery work, revision and mocks based on your current preparation.</p><div class="card-actions">${[7,14,21,30].map(d=>`<button class="btn btn-secondary" data-action="createPlan" data-days="${d}">${d} days</button>`).join('')}<button class="btn btn-secondary" data-action="customPlanAsk">Custom</button></div></section>`;return}appState.planDay=appState.planDay||currentPlanDay();const day=appState.planDay,tasks=p.tasks.filter(t=>t.day===day);app.innerHTML=`<div class="page-head"><div><p class="eyebrow">${p.days}-day preparation plan</p><h1>Day ${day}</h1><p class="subhead">${p.tasks.filter(t=>t.completed).length}/${p.tasks.length} plan tasks complete · today's day is ${currentPlanDay()}</p></div><button class="btn btn-secondary" data-action="replacePlanAsk">Rebuild plan</button></div><section class="plan-grid"><aside class="card plan-days">${Array.from({length:p.days},(_,i)=>i+1).map(d=>`<button class="plan-day ${d===day?'active':''}" data-action="planDay" data-day="${d}"><strong>Day ${d}</strong><br><small>${p.tasks.filter(t=>t.day===d&&t.completed).length}/${p.tasks.filter(t=>t.day===d).length} complete</small></button>`).join('')}</aside><div class="task-list">${tasks.map(t=>`<article class="plan-task ${t.completed?'done':''}"><button class="task-check" data-action="planComplete" data-id="${t.id}">${t.completed?'✓':''}</button><div><strong>${esc(t.title)}</strong><br><small class="muted">${t.type==='section'?'Lesson + retrieval practice':t.type}</small></div><div class="card-actions">${t.type==='section'?`<button class="size-btn" data-action="openStudyCode" data-code="${t.code}">Study</button><button class="size-btn" data-action="startSection" data-code="${t.code}" data-size="10">Practice</button>`:t.type==='mock'?'<button class="size-btn" data-view="mock">Open Mock</button>':t.type==='revision'?'<button class="size-btn" data-view="resources">Revision</button>':'<button class="size-btn" data-action="wrong">Review</button>'}</div></article>`).join('')||'<div class="card empty"><p>No tasks on this day.</p></div>'}</div></section>`}
function renderGaps(){const rows=allStudySections().map(x=>({...x,m:sectionMetrics(x.section.code)})),notStudied=rows.filter(x=>x.m.study==='not-started'),lowPractice=rows.filter(x=>x.m.study==='completed'&&x.m.attempted<Math.min(5,x.m.available)),weak=rows.filter(x=>x.m.attempted>=3&&x.m.accuracy<65).sort((a,b)=>a.m.accuracy-b.m.accuracy),untested=studyGuide.filter(ch=>!progress.history.some(h=>h.questionIds?.some(id=>byId(id)?.moduleId===ch.moduleId)));const block=(title,items,desc)=>`<section class="card"><h2>${title}</h2><p class="muted">${desc}</p><div class="gap-list">${items.slice(0,12).map(x=>`<div class="gap-row"><span><strong>${x.section?.code||x.code}</strong> ${esc(x.section?.title||x.title||'')}</span><span class="card-actions">${x.section?`<button class="size-btn" data-action="openStudyCode" data-code="${x.section.code}">Study</button><button class="size-btn" data-action="startSection" data-code="${x.section.code}" data-size="10">Practice</button>`:`<button class="size-btn" data-action="startModule" data-id="${x.moduleId}" data-size="20">Test</button>`}</span></div>`).join('')||'<p>No gap in this category.</p>'}</div></section>`;app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Know exactly what remains</p><h1>Preparation Gaps</h1><p class="subhead">Study coverage, practice depth and weak results are separated so one metric does not hide another.</p></div><button class="btn btn-secondary" data-view="progress">Readiness dashboard</button></div><section class="gap-grid">${block('Not studied',notStudied,'Official sections not yet opened.')}${block('Low practice',lowPractice,'Read sections with fewer than five scored questions attempted.')}${block('Weak',weak,'Sections below 65% after at least three attempts.')}${block('Untested chapters',untested,'Chapters with no recorded test exposure.')}</section><section class="card" style="margin-top:14px"><h2>Wrong answers remaining</h2><p><strong>${Object.keys(progress.wrong||{}).length}</strong> unresolved questions remain in the wrong-answer notebook.</p><button class="btn btn-primary" data-action="wrong">Review wrong answers</button></section>`}

renderProgress=function(){const r=readiness(),mocks=progress.history.filter(x=>x.mode==='exam'),trend=mocks.slice(0,5).reverse();app.innerHTML=`<div class="page-head"><div><p class="eyebrow">Internal preparation dashboard</p><h1>Exam Readiness</h1><p class="subhead">This combines study, practice and mock activity to show where to revise next.</p></div><div class="card-actions"><button class="btn btn-secondary" data-view="gaps">Preparation gaps</button><button class="btn btn-secondary" data-view="plan">Study plan</button><button class="btn btn-danger" data-action="resetAsk">Reset progress</button></div></div><section class="stats-grid"><div class="stat-card"><span>Syllabus studied</span><strong>${r.studied}/60</strong></div><div class="stat-card"><span>Sections mastered</span><strong>${r.mastered}/60</strong></div><div class="stat-card"><span>Question coverage</span><strong>${r.questionCoverage}/${questionBank.length}</strong></div><div class="stat-card"><span>Wrong unresolved</span><strong>${r.wrong}</strong></div></section><section class="card"><div class="readiness-grid"><div class="readiness-box"><strong>${r.recentAccuracy}%</strong><small>recent accuracy (up to 50 attempts)</small></div><div class="readiness-box"><strong>${r.mocks}</strong><small>full mocks</small></div><div class="readiness-box"><strong>${r.mockAvg||'—'}${r.mocks?'%':''}</strong><small>mock average</small></div></div>${trend.length?`<p class="muted" style="margin-top:14px">Recent mock trend: ${trend.map(x=>x.percentage+'%').join(' → ')}</p>`:''}</section><div class="section-title"><h2>Study and practice by chapter</h2></div><section class="card"><div style="overflow:auto"><table><thead><tr><th>Chapter</th><th>Study</th><th>Mastery</th><th>Practice</th><th>Next</th></tr></thead><tbody>${studyGuide.map(ch=>{const st=chapterStudyStats(ch),ps=moduleStats(ch.moduleId),mastered=ch.sections.filter(s=>sectionMetrics(s.code).level==='mastered').length,next=ch.sections.find(s=>sectionMetrics(s.code).level!=='mastered')?.code||ch.sections[0].code;return `<tr><td><strong>${ch.code}</strong><br>${esc(ch.title)}</td><td>${st.completed}/6</td><td>${mastered}/6</td><td>${ps.attempted} attempted · ${ps.attempts?ps.accuracy+'%':'—'}</td><td><button class="size-btn" data-action="openStudyCode" data-code="${next}">Study</button></td></tr>`}).join('')}</tbody></table></div></section><div class="section-title"><h2>Test history</h2><span class="muted">Most recent ${progress.history.length}</span></div><section class="card">${progress.history.length?`<div style="overflow:auto"><table><thead><tr><th>Test</th><th>Date</th><th>Score</th><th>%</th><th></th></tr></thead><tbody>${progress.history.map((h,i)=>`<tr><td>${esc(h.kind)}</td><td>${fmtDate(h.submittedAt)}</td><td>${h.score}/${h.total}</td><td>${h.percentage}%</td><td><button class="btn btn-secondary btn-sm" data-action="openHistory" data-index="${i}">Open</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h2>No completed tests yet</h2></div>'}</section>`;updateAccountUI()}

window.addEventListener('online',()=>{setSyncStatus(cloud.user?'Sync needed':'Guest · device only',cloud.user?'saving':'local');queueCloudSync(true)});window.addEventListener('offline',()=>setSyncStatus('Offline','offline'));
document.addEventListener('input',e=>{if(e.target.id==='resourceSearch'){appState.resourceSearch=e.target.value;renderResources();const input=document.getElementById('resourceSearch');input?.focus();input?.setSelectionRange(input.value.length,input.value.length)}if(e.target.id==='studyNote'){clearTimeout(e.target._saveTimer);e.target._saveTimer=setTimeout(()=>saveStudyNote(e.target.dataset.code,e.target.value),500)}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='authChoice')showAuthChoice();else if(a==='profileGo'){closeModal();go(el.dataset.target)}else if(a==='guestContinue'){localStorage.setItem('nec.welcomeSeen','1');closeModal();setSyncStatus('Guest · device only','local')}else if(a==='authForm')showAuthForm(el.dataset.mode);else if(a==='sendOtp')await sendOtp(el.dataset.mode);else if(a==='verifyOtp')await verifyOtp(el.dataset.email);else if(a==='googleSignIn')await googleSignIn();else if(a==='profileMenu')showProfileMenu();else if(a==='preferences')showPreferences();else if(a==='savePreferences')savePreferences();else if(a==='accountInfo')showAccountInfo();else if(a==='signOut')await signOutAccount();else if(a==='importGuestProgress')await importGuestProgress(true);else if(a==='useCloudProgress')await importGuestProgress(false);else if(a==='savePrepSetup')savePrepSetup();else if(a==='knowledgeAnswer')answerKnowledge(Number(el.dataset.qid),Number(el.dataset.index),el);else if(a==='toggleStudyBookmark'){const code=el.dataset.code,idx=progress.studyBookmarks.indexOf(code);idx>=0?progress.studyBookmarks.splice(idx,1):progress.studyBookmarks.push(code);save();renderStudySection(code)}else if(a==='toggleConceptBookmark'){const k=el.dataset.key,idx=progress.conceptBookmarks.indexOf(k);idx>=0?progress.conceptBookmarks.splice(idx,1):progress.conceptBookmarks.push(k);save();renderStudySection(appState.studyCode)}else if(a==='toggleFormulaBookmark'){const k=el.dataset.key,idx=progress.formulaBookmarks.indexOf(k);idx>=0?progress.formulaBookmarks.splice(idx,1):progress.formulaBookmarks.push(k);save();renderResources()}else if(a==='readingDepth'){progress.preferences.readingDepth=el.dataset.value;save();renderStudySection(appState.studyCode)}else if(a==='audioRevision')playRevisionAudio();else if(a==='audioFormula')playFormulaAudio();else if(a==='audioPrev'){if(audioQueue.length)speakAudioSegment(audioIndex-1)}else if(a==='audioNext'){if(audioQueue.length)speakAudioSegment(audioIndex+1)}else if(a==='printLesson')window.print();else if(a==='printRevision')window.print();else if(a==='resourceTab'){appState.resourceTab=el.dataset.tab;appState.resourceSearch='';renderResources()}else if(a==='recallRate'){progress.recall[el.dataset.id]=el.dataset.rate;appState.recallOffset=(appState.recallOffset||0)+1;save();renderResources()}else if(a==='calcScale'){const n=Number(document.getElementById('calcScaleN')?.value),cm=Number(document.getElementById('calcScaleCm')?.value),m=cm*n/100;document.getElementById('calcScaleResult').textContent=`${cm} cm at 1:${n} = ${Number.isFinite(m)?m.toFixed(2):'—'} m`;}else if(a==='calcNdvi'){const nir=Number(document.getElementById('calcNir')?.value),red=Number(document.getElementById('calcRed')?.value),v=(nir-red)/(nir+red);document.getElementById('calcNdviResult').textContent=`NDVI = ${Number.isFinite(v)?v.toFixed(3):'undefined'}`;}else if(a==='calcNpv'){const c=Number(document.getElementById('calcCost')?.value),b=Number(document.getElementById('calcBenefit')?.value),y=Number(document.getElementById('calcYears')?.value),rate=Number(document.getElementById('calcRate')?.value)/100;let npv=-c;for(let i=1;i<=y;i++)npv+=b/Math.pow(1+rate,i);document.getElementById('calcNpvResult').textContent=`NPV = ${Number.isFinite(npv)?npv.toFixed(2):'—'}`;}else if(a==='createPlan')generateStudyPlan(el.dataset.days);else if(a==='customPlanAsk')customPlanAsk();else if(a==='customPlanCreate'){const d=Number(document.getElementById('customDays')?.value)||14;closeModal();generateStudyPlan(d)}else if(a==='replacePlanAsk')openModal('Rebuild study plan?',`<p>Your existing plan completion marks will be replaced. Study and question progress will not be deleted.</p>`,`<button class="btn btn-secondary" data-action="closeModal">Cancel</button><button class="btn btn-primary" data-action="customPlanAsk">Choose new plan</button>`);else if(a==='planDay'){appState.planDay=Number(el.dataset.day);renderPlan()}else if(a==='planComplete')planToggle(el.dataset.id)});

/* Keep the account header in sync after every navigation and initialise cloud without blocking local study. */
setTimeout(initCloud,0);


    render();setActiveNav();
  </script>
